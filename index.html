<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e140d">
<meta name="description" content="Mahalle çay ocağını devral, şehrin en ünlü mekânına dönüştür! Türk usulü dükkân işletme oyunu.">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Çay Ocağı">
<title>Çay Ocağı Tycoon</title>
<style>
:root{--bg:#2b1d14;--panel:#3d2a1e;--panel2:#4a3426;--text:#f6ead8;--muted:#c9b39a;--accent:#e8a23a;--good:#6cc070;--bad:#e05a4f;--line:#5c4232;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  --hud:52px;--nav:60px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
button{touch-action:manipulation;font:inherit;color:inherit}

/* ---------- Üst bilgi çubuğu ---------- */
.hud{position:sticky;top:0;z-index:30;display:flex;gap:6px;align-items:center;justify-content:flex-end;
  min-height:calc(var(--hud) + var(--st));padding:calc(6px + var(--st)) calc(10px + var(--sr)) 8px calc(10px + var(--sl));
  background:#1e140d;border-bottom:2px solid var(--line)}
.brand{margin:0 auto 0 0;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stat{background:var(--panel);padding:6px 11px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap;border:0;font-variant-numeric:tabular-nums}
.stat.money{color:var(--accent)}
.icon-btn{background:var(--panel);border:0;border-radius:50%;width:36px;height:36px;font-size:17px;cursor:pointer;flex:none;padding:0}
.icon-btn:hover{background:var(--panel2)}
.daybar{position:absolute;left:0;right:0;bottom:-2px;height:4px;background:#0006}
.daybar>div{height:100%;background:var(--accent);transition:width .1s linear}
@media(max-width:620px){.brand{display:none}.stat.money{margin-right:auto}.stat{font-size:13px;padding:6px 9px}}
.stat.bump{animation:bumpA .4s}
@keyframes bumpA{40%{transform:scale(1.2);color:#fff}}
.stat.shake{animation:shakeA .4s}
@keyframes shakeA{25%{transform:translateX(-4px);color:var(--bad)}75%{transform:translateX(4px);color:var(--bad)}}

/* ---------- Yerleşim (telefon: tek sütun, sahne sabit, alt menü) ---------- */
main{padding-bottom:calc(var(--nav) + var(--sb) + 12px);transition:filter .6s}
.left,.right{display:contents}
.scene-sec{position:sticky;top:calc(var(--hud) + var(--st));z-index:20;background:var(--bg);padding:8px calc(8px + var(--sr)) 8px calc(8px + var(--sl))}
.scene{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#1a110b}
#scene{width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0009;text-align:center;color:var(--muted);padding:10px}
.overlay[hidden]{display:none}
@media(max-width:999px){.overlay{gap:6px;font-size:14px}.overlay .big{padding:10px 20px;font-size:16px}}
#events{position:absolute;bottom:6px;left:6px;right:6px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;pointer-events:none}
.ev{background:#000a;border:1px solid var(--accent);border-radius:999px;padding:3px 9px;font-size:12px}
.ev small{color:var(--muted)}
.ev.fans{pointer-events:auto;cursor:pointer;color:#fff;font:inherit;font-size:13px;padding:6px 12px;background:#7a3fb8e6;border-color:#e08bff;animation:pulseA 1.2s infinite}
.panel{display:none;background:var(--panel);border-radius:14px;padding:14px;border:1px solid var(--line);margin:0 calc(8px + var(--sr)) 8px calc(8px + var(--sl))}
.panel.active{display:block}

#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#1e140d;border-top:2px solid var(--line);padding:0 var(--sr) var(--sb) var(--sl)}
.tab{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:var(--nav);
  background:none;border:0;font-size:22px;color:var(--muted);cursor:pointer;padding:0}
.tab span{font-size:11px;font-weight:700}
.tab.on{color:var(--accent)}
.tab.on::before{content:"";position:absolute;top:-2px;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{display:none;position:absolute;top:7px;left:calc(50% + 9px);width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid #1e140d}
.tab.has .badge{display:block}

/* Dikey telefon: sayfa değil içerik kayar (itch.io gibi scrolling="no" çerçevelerde de çalışsın) */
@media(max-width:999px) and (orientation:portrait){
  html,body{height:100%;overflow:hidden}
  body{display:flex;flex-direction:column}
  .hud{flex:none}
  main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .scene-sec{top:0}
  /* Sahne ekranın en fazla yarısı: ocak ve tepsi oyun sırasında görünür kalsın (--ar = genişlik/yükseklik) */
  .scene{max-width:calc(max(36dvh, 50dvh - var(--pextra, 0px)) * var(--ar, 1.78));margin:0 auto}
  body.running #p-mutfak h2{display:none}
  /* Oyun sırasında mutfak sıkışık: ürünler tek satırda, ocak ve tepsi sahnenin hemen altında */
  body.running #p-mutfak{padding:10px}
  /* 5 sütun; ürünler ilk satırdan uzunsa fazlası sahnenin sınırından düşülür (--pextra, renderUI) */
  body.running .products{grid-template-columns:repeat(5,1fr);gap:5px}
  body.running .prod{padding:5px 1px;gap:0}
  body.running .prod .em{font-size:22px}
  body.running .prod b{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  body.running .prod small{font-size:10px}
  body.running .products.many .prod small{display:none}
  /* 10'dan fazla ürün (geç oyun, şube ürünleri): yalnızca emoji, 7 sütun */
  body.running .products.lots{grid-template-columns:repeat(7,1fr);gap:4px}
  body.running .products.lots .prod{padding:6px 0}
  body.running .products.lots .prod b{display:none}
  body.running .quests{margin-bottom:6px}
  body.running .quest{padding:3px 6px 5px}
  body.running #p-mutfak .row{margin-top:8px}
}

/* Yatay telefon: sahne solda, panel sağda */
@media(max-width:999px) and (orientation:landscape) and (max-height:560px){
  :root{--hud:44px;--nav:46px}
  main{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:100%;padding:0;
    height:calc(100dvh - var(--hud) - var(--st) - var(--nav) - var(--sb))}
  .scene-sec{position:static;grid-column:1;grid-row:1;width:min(58vw,calc((100dvh - var(--hud) - var(--st) - var(--nav) - var(--sb) - 16px) * 16 / 9 + 16px))}
  .panel{grid-column:2;grid-row:1;margin:8px calc(8px + var(--sr)) 8px 0;overflow-y:auto}
  .panel .hint{display:none}
  .tab{flex-direction:row;gap:6px;font-size:18px}
  .tab span{font-size:13px}
  .badge{top:6px;left:calc(50% - 4px)}
}

/* Bilgisayar / tablet: iki sütun, mutfak hep görünür */
@media(min-width:1000px){
  main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px;max-width:1300px;margin:0 auto;align-items:start}
  .left,.right{display:flex;flex-direction:column;gap:16px;min-width:0}
  .scene-sec{position:static;background:var(--panel);border-radius:14px;padding:14px;border:1px solid var(--line)}
  .panel{margin:0}
  #tabs{position:static;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:4px;gap:4px}
  .tab{height:auto;padding:9px 4px;flex-direction:row;gap:6px;font-size:18px;border-radius:10px}
  .tab span{font-size:14px}
  .tab.on{background:var(--panel2)}
  .tab.on::before{display:none}
  .tab[data-tab=mutfak]{display:none}
  .badge{position:static;margin-left:2px}
}

/* ---------- Ortak parçalar ---------- */
h2{margin:0 0 10px;font-size:16px;color:var(--accent)}
h2 small{color:var(--muted);font-weight:500}
h3{margin:14px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hint{color:var(--muted);font-size:13px;margin:-4px 0 10px}
.big{background:var(--accent);color:#2b1d14;border:0;border-radius:12px;padding:14px 26px;font-size:18px;font-weight:800;cursor:pointer}
.big:hover{filter:brightness(1.1)}
.btn2{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:700}
.btn2:hover{border-color:var(--accent)}
.btn2.danger{color:var(--bad)}
.item{font-size:22px;background:#0003;border-radius:8px;padding:2px 5px;display:inline-block}

/* Mutfak */
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
@media(max-width:999px){
  .products{grid-template-columns:repeat(3,1fr);gap:6px}
  .prod{padding:6px 2px;gap:0}
  .prod .em{font-size:24px}
  .prod b{font-size:13px}
  #p-mutfak{padding:10px 12px}
  #p-mutfak h2{display:none}  /* alt menüde zaten yazıyor */
  #p-mutfak .row{margin-top:8px}
  #p-mutfak h3{margin:4px 0 6px}
  .products.many{grid-template-columns:repeat(4,1fr);gap:5px}
  .products.many .prod{padding:5px 1px;border-radius:10px}
  .products.many .em{font-size:22px}
  .products.many b{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .products.many .pt{display:none}
}
.prod{position:relative;background:var(--panel2);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit}
.prod:hover{border-color:var(--accent)}
.prod:active{transform:scale(.94)}
.prod.full{opacity:.45}
.prod .em{font-size:30px;line-height:1.1}
.prod b{font-size:14px}
.prod small{color:var(--muted);font-size:12px}
.prod .up{color:var(--good);font-weight:700}
.prod kbd{position:absolute;top:4px;left:6px;font-size:11px;color:var(--muted)}
@media(hover:none){.prod kbd{display:none}}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.row>div{flex:1;min-width:140px}
.slots{display:flex;gap:6px;flex-wrap:wrap;min-height:46px;background:#0002;border-radius:10px;padding:6px}
.chip{position:relative;background:var(--panel2);border-radius:8px;padding:4px 8px;font-size:22px;overflow:hidden}
.chip .who{font-size:12px;position:absolute;top:0;right:2px}
.chip .prog{position:absolute;left:0;bottom:0;height:4px;background:var(--accent)}
.tray .item{cursor:pointer}
.tray .slot{width:38px;height:36px;border:2px dashed var(--line);border-radius:8px}

/* Mağaza & Menü */
.shop-item{display:flex;align-items:center;gap:10px;padding:8px;background:var(--panel2);border-radius:10px;margin-bottom:6px;border:2px solid transparent}
.shop-item.hl{border-color:var(--accent)}
.shop-item .em{font-size:26px;width:34px;text-align:center;flex:none}
.shop-item .info{flex:1;min-width:0}
.shop-item small{display:block;color:var(--muted);font-size:12px}
.lvl{color:var(--accent);font-size:12px}
.rs{color:#ffc94a;letter-spacing:1px}
.rs i{font-style:normal;color:#ffffff26}
.shop-item button{background:var(--accent);color:#2b1d14;border:0;border-radius:8px;padding:10px 10px;cursor:pointer;min-width:76px;font:inherit;font-weight:800;flex:none}
.shop-item button:disabled{background:#0004;color:var(--muted);cursor:not-allowed}
.shop-item .tag{color:var(--good);font-weight:800;font-size:13px;flex:none}
.shop-item.cur{border-color:var(--good)}
.tab[hidden]{display:none}

/* Şubeler */
.net{background:#0002;border-radius:10px;padding:10px 12px;margin-bottom:6px}
.net b{color:var(--accent)}
.net .pbar{height:6px;background:#0004;border-radius:3px;margin-top:6px;overflow:hidden}
.net .pbar div{height:100%;background:var(--accent)}
.shop-item .loc{color:var(--good);font-weight:700}
.shop-item.flash{animation:flashA 1.2s}
.shop-item.warn{border-color:var(--accent)}
.shop-item.crisis{border-color:var(--bad);animation:crisisA 1.4s infinite}
@keyframes crisisA{50%{box-shadow:0 0 0 3px #e05a4f55}}
.hbar{display:block;height:5px;background:#0004;border-radius:3px;margin-top:5px;overflow:hidden;max-width:180px}
.hbar i{display:block;height:100%;background:var(--good)}
.hbar.mid i{background:var(--accent)}
.hbar.low i{background:var(--bad)}
.shop-item:has(.trouble){flex-wrap:wrap}
.trouble{flex-basis:100%;display:flex;align-items:center;gap:8px;background:#0003;border-radius:8px;padding:6px 8px;font-size:13px;color:var(--text)}
.trouble span{flex:1;min-width:0}
.shop-item .trouble .fix{padding:8px 10px;min-width:0;font-size:13px}
.shop-item.crisis .fix:not(:disabled){background:var(--bad);color:#fff}
.banner.bad{background:#e05a4f22;border-color:var(--bad)}
.news{background:#0002;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13px;line-height:1.6}
.wmap .own.bad circle:not(.hit){fill:var(--bad);animation:pinA 1s infinite}
@keyframes flashA{30%{border-color:var(--accent);background:#e8a23a33}}
.wmap{display:block;width:100%;height:auto;background:#1a2a36;border-radius:12px;margin:8px 0 2px;border:1px solid var(--line)}
.wmap .land path{fill:#4d3a2a;stroke:#4d3a2a;stroke-width:4;stroke-linejoin:round}
.wmap .arc{fill:none;stroke:var(--accent);stroke-width:1.2;stroke-dasharray:3 2;opacity:.85}
.wmap .pin{cursor:pointer}
.wmap .pin .hit{fill:transparent}
.wmap .pin circle:not(.hit){stroke:#1a2a36;stroke-width:1.2}
.wmap .pin text{font:700 7px system-ui,sans-serif;fill:#f6ead8;text-anchor:middle;paint-order:stroke;stroke:#1a2a36;stroke-width:2px}
.wmap .own circle:not(.hit){fill:var(--accent)}
.wmap .can circle:not(.hit){fill:var(--good);animation:pinA 1.2s infinite}
.wmap .lock circle:not(.hit){fill:#7d6a5a}
.wmap .lock text{fill:#a8957f}
@keyframes pinA{50%{opacity:.35}}

/* Ünlülük & röportaj */
#pFame{font-size:12px;color:#e8c6ff;margin-top:3px;font-weight:700}
#pFame .fbar{display:block;height:5px;background:#0004;border-radius:3px;margin-top:3px;overflow:hidden}
#pFame .fbar i{display:block;height:100%;background:linear-gradient(90deg,#b36bff,#ffc94a)}
.iv-q{font-size:18px;font-weight:700;margin:6px 0 14px}
.ans{display:block;width:100%;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:15px;line-height:1.35}
.ans:hover,.ans:active{border-color:var(--accent)}
.choice{background:var(--panel2);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.choice small{display:block;color:var(--muted);font-size:13px}
.cover{display:block;width:100%;max-width:300px;margin:0 auto 10px;border-radius:6px;box-shadow:0 8px 24px #000a}

/* Eşyalarım */
.profile{display:flex;align-items:center;gap:12px;background:var(--panel2);border-radius:12px;padding:8px 12px}
#avatar{width:64px;height:80px;border-radius:10px;background:#d8c3a0;flex:none}
.profile .info{flex:1;min-width:0}
.profile small{display:block;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.kv div{background:#0002;border-radius:10px;padding:8px 10px}
.kv small{display:block;color:var(--muted);font-size:12px}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.inv-card{background:var(--panel2);border-radius:12px;padding:10px 6px;text-align:center;border:1px solid var(--line)}
.inv-card .em{font-size:28px}
.inv-card b{display:block;font-size:13px}
.inv-card small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.inv-card .dots{color:var(--accent);font-size:10px;letter-spacing:1px}
.inv-card.off{opacity:.4}

/* Öğretici & ayarlar */
.coach{background:#e8a23a22;border:1px dashed var(--accent);border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:14px;font-weight:600}
.coach[hidden]{display:none}
.prod.pulse{border-color:var(--good);animation:pulseA 1s infinite}
.quests{display:flex;gap:6px;margin-bottom:10px}
.quests:empty{display:none}
.quest{position:relative;flex:1;min-width:0;background:#0003;border:1px solid var(--line);border-radius:10px;padding:5px 8px 7px;overflow:hidden;font-size:12px}
.quest span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quest b{font-size:14px;font-variant-numeric:tabular-nums}
.quest i{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .3s}
.quest.done{border-color:var(--good);background:#6cc07022}
.quest.done b{color:var(--good)}
.quest.done i{background:var(--good)}
.quest.fail{opacity:.5}
.evbar{position:relative;background:linear-gradient(90deg,#c0392b33,#e8a33a22);border:1px solid #e8a33a66;border-radius:10px;padding:6px 10px 8px;margin-bottom:10px;font-size:13px;overflow:hidden}
.evbar:empty{display:none}
.evbar small{display:block;color:var(--muted);font-size:12px}
.evbar i{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .3s}
.evbar.soon{background:#0003;border-color:var(--line)}
.quest.fail b{color:var(--bad)}
/* Dükkân kapalıyken görevler tam metinle, alt alta */
body:not(.running) .quests{flex-direction:column;gap:4px}
body:not(.running) .quest span{white-space:normal;color:var(--text)}
body:not(.running) .quest b{display:none}
body:not(.running) .quest.done b{display:inline}
.qhead{font-weight:800;color:var(--accent);font-size:13px}
@keyframes pulseA{50%{box-shadow:0 0 0 5px #6cc07055}}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row .btn2{min-width:96px}
.icon-btn[hidden]{display:none}
body.veteran .newbie{display:none}

/* Gün sonu, günlük ödül, başarımlar */
.stars{font-size:34px;text-align:center;letter-spacing:4px;margin:-4px 0 6px}
.stars span{filter:grayscale(1);opacity:.3}
.banner{background:#e8a23a22;border:1px solid var(--accent);border-radius:10px;padding:8px 10px;text-align:center;font-weight:700;margin:6px 0}
.streak{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0}
.streak div{background:var(--panel2);border-radius:8px;padding:6px 0;text-align:center;font-size:11px;color:var(--muted);border:2px solid transparent}
.streak div b{display:block;font-size:18px}
.streak .got{background:#6cc07033;color:var(--text)}
.streak .today{border-color:var(--accent);color:var(--text);animation:pulseA 1s infinite}
.reward{text-align:center;font-size:30px;font-weight:900;color:var(--accent);margin:4px 0 12px}
.ach{display:flex;gap:10px;align-items:center;padding:8px 10px;background:var(--panel2);border-radius:10px;margin-bottom:6px;border:1px solid transparent}
.ach.done{border-color:var(--good)}
.ach .em{font-size:24px;width:30px;text-align:center;flex:none}
.ach .info{flex:1;min-width:0}
.ach small{display:block;color:var(--muted);font-size:12px}
.ach .pbar{height:5px;background:#0004;border-radius:3px;margin-top:5px;overflow:hidden}
.ach .pbar div{height:100%;background:var(--accent)}
.ach.done .pbar div{background:var(--good)}
.ach .rw{font-weight:800;font-size:13px;color:var(--accent);flex:none}
.ach.done .rw{color:var(--good)}

/* ---------- Bildirimler & pencereler ---------- */

const COL_ITEMS = COL_SETS.flatMap(s => s.items.map(it => ({...it, set:s})));
const COL = Object.fromEntries(COL_ITEMS.map(it => [it.id, it]));
const ANTIQUE_DAY = 3;
const owned = id => !!(S.col || {})[id];
const setDone = s => s.items.every(it => owned(it.id));
// Bonus türleri: tip (bahşiş), pat (sabır), fame (ünlülük), off (sen yokken kasası)
const colBonus = type => COL_SETS.filter(s => s.bonus === type)
  .reduce((b, s) => b + s.items.filter(it => owned(it.id)).length * s.per + (setDone(s) ? s.full : 0), 0);
// Antikacı vitrini: her oyun günü 3 parça; henüz alınmamış en ucuz 6 parçadan güne göre seçilir
function antiqueStock(){
  const pool = COL_ITEMS.filter(it => !it.set.event && !owned(it.id)).sort((a, b) => a.cost - b.cost).slice(0, 6);
  let seed = S.day * 9973 + 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  return pool.map(it => [rnd(), it]).sort((a, b) => a[0] - b[0]).slice(0, 3).map(x => x[1]).sort((a, b) => a.cost - b.cost);
}
const canAntique = () => S.day >= ANTIQUE_DAY && antiqueStock().some(it => S.money >= it.cost);
// Parça eklendi: set tamamlandıysa kutla
function colAdd(id){
  const it = COL[id], was = setDone(it.set);
  S.col = S.col || {}; S.col[id] = true;
  if (!was && setDone(it.set)){
    announce({emoji:it.set.emoji, name:`${it.set.name} tamamlandı!`, desc:`Set bonusu: +%${Math.round(it.set.full * 100)} ${it.set.what}`, ach:true}, '🏺 Koleksiyon');
    if (status === 'running') confetti();
  }
}

// Test için adres çubuğuna ?tarih=2026-10-29 yazılabilir
const today = () => { const q = new URLSearchParams(location.search).get('tarih'); return q ? new Date(q + 'T12:00') : new Date(); };
const DAY_MS = 86400000;
function eventOn(d){
  for (const ev of EVENTS) for (const y of [d.getFullYear() - 1, d.getFullYear()]){
    const r = ev.at(y);
    if (r && d >= r[0] && d < +r[1] + DAY_MS) return {ev, key:`${ev.id}-${r[0].getFullYear()}`, left:Math.ceil((+r[1] + DAY_MS - d) / DAY_MS)};
  }
  return null;
}
// Bugünün etkinliği ve 14 gün içindeki ilk etkinlik; tarih değişmedikçe yeniden hesaplanmaz
let evCache = {};
function calendar(){
  const d = today(), k = d.toDateString();
  if (evCache.k !== k){
    const cur = eventOn(d);
    let next = null;
    for (let i = 1; i <= 14 && !next; i++){ const e = eventOn(new Date(+d + i * DAY_MS)); if (e && (!cur || e.ev !== cur.ev)) next = {ev:e.ev, days:i}; }
    evCache = {k, cur, next};
  }
  return evCache;
}
const EV = () => (calendar().cur || {}).ev || null;
const evProduct = () => EV() && EV_PRODUCTS.find(p => p.ev === EV().id);
const evProg = () => { const c = calendar().cur; if (!c) return null; S.evp = S.evp || {}; return S.evp[c.key] = S.evp[c.key] || {n:0, done:false, seen:false}; };
function evReward(ep){
  const ev = EV(), gift = Math.round(600 * (1 + mainLv()) * (1 + 0.5 * worldCount()));
  ep.done = true;
  const dup = owned(ev.col.id);
  colAdd(ev.col.id);
  S.money += gift; S.total += gift;
  announce({emoji:ev.col.emoji, name:`${ev.name} görevi tamam!`, desc:`${dup ? '' : `Koleksiyonuna ${ev.col.name} eklendi · `}+₺${fmt(gift)}`, ach:true}, '🎉 Etkinlik');
  if (status === 'running') confetti();
  save();
}

function riskDay(interviewDay){
  const out = {news:[], lost:[]};
  const cur = branch();
  cur.seen = S.day;
  if (!riskActive()) return out;
  for (const b of [...S.branches]){
    if (b.city === 'ana') continue;
    const nm = CITY[b.city].name;
    if (b === cur){
      if (b.issue || b.crisis) out.news.push(`✅ ${nm}: bizzat ilgilendin, sorun çözüldü`);
      b.issue = null; b.crisis = false; b.health = Math.min(100, bHealth(b) + RISK.visit);
      continue;
    }
    if (b.issue){
      b.health = bHealth(b) - RISK.drain;
      if (b.health <= 0){
        const refund = Math.round(paidOf(b) * RISK.refund);
        S.money += refund;
        S.branches.splice(S.branches.indexOf(b), 1);
        S.lostBranches = (S.lostBranches || 0) + 1;
        out.lost.push({nm, refund});
        continue;
      }
      if (b.health <= RISK.crisis && !b.crisis){ b.crisis = true; out.news.push(`🚨 ${nm}: KRİZ! Kurtarmazsan batacak`); }
      else if (b.crisis) out.news.push(`🚨 ${nm}: kriz sürüyor${b.health <= RISK.drain ? ', yarın batabilir!' : ''}`);
      else out.news.push(`📉 ${nm}: ${ISSUES[b.issue.t].emoji} ${ISSUES[b.issue.t].name} hâlâ çözülmedi`);
    } else {
      b.health = Math.min(100, bHealth(b) + RISK.heal);
      // Röportaj günü şubeler daha çok ihmal edilir
      // Uğramadıkça sorun ihtimali artar; yurt dışına açılmadan yarısı kadar
      if (Math.random() < RISK.chance * (interviewDay ? 2 : 1) * (S.riskOn ? 1 : 0.5) * (1 + Math.max(0, S.day - (b.seen ?? b.day ?? S.day)) / 7)){
        const t = pick(Object.keys(ISSUES));
        b.issue = {t, day:S.day};
        out.news.push(`⚠️ ${nm}: ${ISSUES[t].emoji} ${ISSUES[t].name}`);
      }
    }
  }
  S.cur = S.branches.indexOf(cur);   // batan şube listeden çıktıysa sıra kayar
  return out;
}

function moveAlong(e, dt, sp){
  if (!e.path.length) return true;
  const t = e.path[0], dx = t.x - e.x, dy = t.y - e.y, d = Math.hypot(dx, dy), step = sp * dt;
  if (d <= step){ e.x = t.x; e.y = t.y; e.path.shift(); }
  else { e.x += dx / d * step; e.y += dy / d * step; }
  if (Math.abs(dx) > 1) e.flip = dx < 0;
  e.walk = (e.walk || 0) + dt * 13;
  return !e.path.length;
}

function newGarson(i){ const h = garsonHome(i); return {i, x:h.x, y:h.y, state:'idle', path:[], carry:null, cid:null, walk:0}; }

  const newcomer = !S.cur && REGULARS.find(r => S.day >= r.day && !(S.regs[r.id] || {}).met);
  if (newcomer) R.regs = [newcomer.id, ...R.regs.filter(id => id !== newcomer.id)].slice(0, 3);
  R.criticAt = S.critic === S.day ? rand(25, 70) : null;
}

// ---------- Tepsi & müşteri yardımcıları ----------
function trayAdd(p){ R.tray.push(p); R.trayT.push(R.t); SFX.prepDone(); }
function trayRemove(i){ R.tray.splice(i, 1); R.trayT.splice(i, 1); }
const active = c => !c.leaving;
const seated = c => c.state === 'seated' && !c.leaving;
function inProgress(){ return R.queue.length + R.helpers.filter(Boolean).length; }
function hasRoom(){ return R.tray.length + inProgress() < trayCap(); }
const canServe = c => seated(c) && c.order.some(o => !o.done && R.tray.includes(o.p));

function needed(){
  const n = {};
  R.customers.filter(active).forEach(c => c.order.forEach(o => { if (!o.done) n[o.p] = (n[o.p] || 0) + 1; }));
  R.tray.forEach(p => n[p] && n[p]--);
  R.queue.forEach(x => n[x.p] && n[x.p]--);
  R.helpers.forEach(x => x && n[x.p] && n[x.p]--);
  R.garsons.forEach(g => g.carry && n[g.carry] && n[g.carry]--);
  return n;
}

// Art arda mutlu müşteri: bahşiş çarpanı büyür, biri kızarsa sıfırlanır
const comboMult = n => n >= 15 ? 2.5 : n >= 10 ? 2 : n >= 6 ? 1.5 : n >= 3 ? 1.2 : 1;

function spawnInterval(){
  const base = Math.max(1.5, (7 - lv('tabela') * 0.8) * (1.4 - S.rep / 100 * 0.6));
  return base * (DE().spawn || 1) * (CM().spawn || 1) * (1 - 0.08 * lv('dukkan')) * (1 - 0.05 * fameLv())
    * (WD().spawn || 1) * Q().spawn * (ivBuff('esprili') ? 0.75 : 1) * (effect('fans') ? 0.5 : 1) * (1 + 0.04 * (R.stains || []).length)
    * (S.day <= 2 ? 0.7 : 1)    // ilk iki gün daha hareketli: yeni oyuncu boş beklemesin
    * ((EV() || {}).spawn || 1)
    * (EV() && EV().iftar ? (R.t > DAY_LEN * 0.75 ? 0.45 : 1.3) : 1);   // Ramazan: gündüz sakin, iftarda kalabalık
}

function freeSeats(){
  const taken = new Set(R.customers.filter(active).map(c => c.seat));
  const free = [];
  for (let i = 0; i < numTables(); i++) if (!taken.has(i)) free.push(i);
  return free;
}

// Müşteri sabrı (saniye). İlk günler rahat; PAT.from'dan sonra her gün biraz azalır (en az PAT.floor katı)
// Simülasyonla ayarlandı: iyi oyuncu neredeyse hiç kaçırmaz, dalgın oyuncu günde ~1-4 müşteri kaçırır
const PAT = {base:15, item:5, dekor:2, rep:5, ramp:0.018, floor:0.62, from:3};
function patienceFor(count){
  const ramp = Math.max(PAT.floor, 1 - PAT.ramp * Math.max(0, S.day - PAT.from));
  return (ivBuff('samimi') ? 1.2 : 1) * (PAT.base + count * PAT.item + lv('dekor') * PAT.dekor + S.rep / 100 * PAT.rep) * ramp * (DE().patience || 1) * (CM().patience || 1)
    * (1 + colBonus('pat'));
}

// special: 'vip' | 'influencer' | 'turist' | undefined
function spawnCustomer(special, delayPx = 0){
  const free = freeSeats();
  if (!free.length) return null;
  // Sıradan bir müşteri yerine bazen bugünün müdavimlerinden biri gelir (gün bitmeden)
  // Tanışma günü: yeni müdavim 3. müşteriden sonra kesin gelir
  const meet = R.regs.length && !(S.regs[R.regs[0]] || {}).met;
  const reg = !special && R.regs.length && R.t < DAY_LEN * 0.8 && (meet ? R.nextId >= 3 : Math.random() < 0.3) ? REG[R.regs.shift()] : null;
  const maxItems = Math.min(4, 2 + Math.floor(S.day / 4));
  let count = 1 + Math.floor(Math.random() * maxItems);
  if (special === 'vip') count = Math.min(4, Math.max(3, sellable().length));
  const fav = (DE().fav || []).filter(p => sellable().includes(p));
  const evp = evProduct();
  let order = [];
  for (let i = 0; i < count; i++){
    const p = evp && Math.random() < 0.3 ? evp.id : fav.length && Math.random() < 0.55 ? pick(fav) : pick(sellable());
    order.push({p, done:false});
  }
  // Eleştirmen menünün en pahalı 5 ürününden 3-4 parça ister
  if (special === 'elestirmen'){
    const top = sellable().sort((a, b) => P[b].price - P[a].price).slice(0, 5);
    order = Array.from({length:S.day >= 15 ? 4 : 3}, () => ({p:pick(top), done:false}));
  }
  if (reg) order = regOrder(reg).map(p => ({p, done:false}));
  let max = patienceFor(order.length);
  if (special === 'vip') max *= 0.9;
  if (special === 'elestirmen') max *= 0.8;
  if (reg) max *= 1 + 0.08 * regLv(reg.id);   // eski dost biraz daha sabırlıdır
  const look = reg ? {...reg.look} : randomLook();
  if (special === 'vip'){ look.shirt = '#1d1d2b'; look.suit = true; look.hat = 'crown'; }
  if (special === 'influencer'){ look.shirt = '#ff6fae'; look.prop = 'phone'; }
  if (special === 'turist'){ look.shirt = '#21b3a5'; look.hat = 'sun'; look.prop = 'camera'; }
  if (special === 'elestirmen'){ look.shirt = '#3d3d46'; look.glasses = true; look.hat = 'bere'; look.prop = 'note'; }
  const seat = pick(free);
  const c = {id:R.nextId++, seat, look, order, patience:max, max, special, reg:reg && reg.id,
             state:'in', x:rightWall() + 40 + delayPx, y:aisleY(), path:pathIn(seat), walk:0};
  R.customers.push(c);
  SFX.arrive();
  return c;
}

function catchArson(msg){
  const a = R.arson; R.arson = null;
  S.rep = Math.min(100, S.rep + 3);
  floatText(a.x - 30, a.y - 100, msg + ' +3⭐', '#8fe08f'); SFX.combo();
}
function leave(c, mood){
  c.leaving = {mood};
  if (c.seat != null && R.stains.length < MAX_STAINS && Math.random() < 0.55){
    const sl = SLOTS[c.seat];
    R.stains.push({x:sl.x + rand(-50, 50), y:Math.min(sl.y + rand(44, 56), viewH() - 18), r:Math.random()});
    if (!S.stainTip){ S.stainTip = 1; announce({emoji:'🧽', name:'Dükkân kirleniyor', desc:'Müşteriler kalkınca masaların önü kirlenir. Kire dokunup temizle ya da Mağaza’dan temizlikçi tut. Kirli dükkânda müşteri çabuk sabırsızlanır ve daha az gelir.'}); }
  }
  c.state = 'out';
  c.path = pathOut(c.seat);
}

function serve(c, silent){
  if (!seated(c)) return false;
  let delivered = 0;
  for (const o of c.order){
    if (o.done) continue;
    const i = R.tray.indexOf(o.p);
    if (i >= 0){ trayRemove(i); o.done = true; o.doneAt = now(); delivered++; if (silent) break; }
  }
  if (!delivered){ if (!silent){ toast('Tepside bu müşterinin istediği bir şey yok'); SFX.error(); } return false; }
  if (c.order.every(o => o.done)) pay(c); else SFX.serve();
  return true;
}

function pay(c){
  const ratio = c.patience / c.max;
  let base = c.order.reduce((s, o) => s + itemPrice(o.p), 0);
  if (c.special === 'vip') base *= 3;
  if (R.focus) base = Math.round(base * 1.2);   // röportajı reddedip dükkâna odaklanılan gün
  R.combo++; R.comboT = COMBO_TIME;
  if (dirt() >= 4 && Math.random() < 0.3){
    S.rep = Math.max(0, S.rep - 1);
    floatText(SLOTS[c.seat].x, SLOTS[c.seat].y - 185, '🤢 Burası kirli! -1⭐', '#c9e06a', 0.3);
  }
  R.stats.bestCombo = Math.max(R.stats.bestCombo, R.combo);
  S.bestCombo = Math.max(S.bestCombo || 0, R.combo);
  const cm = comboMult(R.combo);
  const tipMult = (1 + 0.1 * lv('dekor')) * (DE().tip || 1) * (CM().tip || 1) * (effect('happy') ? 3 : 1) * cm * (1 + 0.05 * fameLv())
    * (c.reg ? 1 + 0.1 * regLv(c.reg) : 1)    // müdavim: her kalp +%10 bahşiş
    * ((EV() || {}).tip || 1) * (1 + colBonus('tip')) * (WD().tip || 1) * Q().tip;
  let tip = Math.round(base * (0.05 + 0.35 * ratio) * tipMult);
  // Ünlüysen bazı müşteriler imza ister ve fazladan bahşiş bırakır
  const autograph = fameLv() >= 1 && Math.random() < 0.06 * fameLv();
  if (autograph) tip += Math.round(base * 0.3);
  const mat = Math.round(base * Q().cost);   // malzeme gideri
  S.money += base + tip - mat; S.total += base + tip - mat; R.stats.mat += mat;
  addFame(0.25 + (c.special === 'influencer' ? 5 : 0) + (autograph ? 0.5 : 0));
  R.stats.served++; R.stats.earned += base; R.stats.tips += tip; S.served++;
  const ep = evProg();
  if (ep && !ep.done && ++ep.n >= EV().goal) evReward(ep);
  c.order.forEach(o => R.sold[o.p] = (R.sold[o.p] || 0) + 1);
  S.rep = Math.min(100, S.rep + (ratio > 0.5 ? 2 : 1) + (c.special === 'influencer' ? 10 : 0));
  const s = SLOTS[c.seat];
  // Müşteri yorumu: malzeme kalitesine ve servis hızına göre
  const rv = ratio < 0.25 && Math.random() < 0.4 ? 'slow' : Math.random() < Q().bad ? 'bad' : Math.random() < Q().good ? 'good' : null;
  if (rv){
    const good = rv === 'good';
    R.stats[good ? 'good' : 'bad']++;
    S.rep = Math.max(0, Math.min(100, S.rep + (good ? 1 : -2)));
    floatText(s.x, s.y - 215, `${pick(REVIEWS[rv])} ${good ? '+1' : '-2'}⭐`, good ? '#8fe08f' : '#ff8a7a', 0.45);
  }
  // Yeni kombo kademesine geçildiyse kutla
  if (cm > comboMult(R.combo - 1)){ floatText(s.x, s.y - 160, `🔥 KOMBO x${cm}!`, '#ff9d3a', 0.15); SFX.combo(); }
  floatText(s.x, s.y - 100, `+₺${base + tip - mat}`, '#ffc94a');
  if (c.special === 'influencer') floatText(s.x, s.y - 130, '📸 +10⭐', '#e08bff', 0.3);
  else if (autograph) floatText(s.x, s.y - 130, '✍️ İmza istedi!', '#e08bff', 0.3);
  coins(s.x, s.y - 40, Math.min(8, 2 + Math.floor((base + tip) / 20)));
  bump('#money', 'bump');
  SFX.pay();
  if (c.reg) regHappy(c, ratio);
  if (c.special === 'elestirmen'){
    const taste = c.order.reduce((t, o) => t + recLv(o.p), 0) / c.order.length / MAX_RECIPE;
    // Salonun huzuru: bugün kimse kızmadıysa tam puan
    const calm = R.stats.lost === 0 ? 1 : R.stats.lost <= 2 ? 0.5 : 0;
    // 5 yıldız için pahalı ürünlerin tarifleri neredeyse tam olmalı (simülasyonla: iyi oyuncu ~3, ustalaşınca 4-5)
    review(Math.max(1, Math.min(5, 1 + Math.floor(4.4 * (0.35 * ratio + 0.45 * taste + 0.2 * calm)))));
  }
  leave(c, 'happy');
}

// Müdavim mutlu ayrıldı: bağ puanı artar; yeni kalpte söz + hediye
function regHappy(c, ratio){
  const r = REG[c.reg], d = regData(r.id), before = regLv(r.id), s = SLOTS[c.seat];
  d.pts += ratio > 0.5 ? 2 : 1; d.visits++;
  if (!R.regsToday.includes(r.id)) R.regsToday.push(r.id);
  const l = regLv(r.id);
  floatText(s.x, s.y - 130, `💛 ${r.name}`, '#ffb3c6', 0.3);
  if (l > before && l > d.got){
    d.got = l;
    const gift = regGift(l);
    S.money += gift; S.total += gift;
    announce({emoji:r.emoji, name:`${r.name} ${hearts(l)}`, desc:`"${r.lines[l]}" · Hediye +₺${fmt(gift)}`, ach:true}, '💛 Müdavim');
  }
}
function regAngry(c){
  const r = REG[c.reg], d = regData(r.id), s = SLOTS[c.seat];
  d.pts = Math.max(0, d.pts - 3);
  floatText(s.x, s.y - 160, `💔 ${r.name} küstü`, '#ff8a8a', 0.2);
}
// Masaya oturunca selam verir; ilk tanışmada kart çıkar
function regGreet(c){
  const r = REG[c.reg], d = regData(r.id), s = SLOTS[c.seat];
  if (!d.met){
    d.met = true;
    announce({emoji:r.emoji, name:r.name, desc:`"${r.lines[0]}" · Her zamanki: ${regOrder(r).map(p => P[p].emoji).join('')}`}, '💛 Yeni müdavim');
  } else floatText(s.x, s.y - 150, regLv(r.id) ? '💬 Her zamankinden!' : '💬 Merhaba usta!', '#fff3d6');
}

function startDayEvent(){
  if (S.day < 2 || Math.random() > 0.55) return;
  R.dayEvent = pick(DAY_EVENTS);
  const ev = R.dayEvent;
  setTimeout(() => announce(ev, 'Bugün'), 700);
}

function triggerLiveEvent(){
  const free = freeSeats().length;
  const options = LIVE_EVENTS.filter(e => (!e.seats || free >= e.seats) && !effect(e.id)
    && (e.id !== 'elektrik' || Math.random() < 0.35)   // kesinti seyrek olsun
    && (e.id !== 'kundak' || (S.day >= 6 && !R.arson && Math.random() < 0.3)));
  if (!options.length) return;
  // Dubai: VIP müşteriler çok sık gelir
  const vip = CM().vip && Math.random() < 0.5 && options.find(e => e.id === 'vip');
  const ev = vip || pick(options);
  if (ev.dur) R.effects.push({id:ev.id, left:ev.dur, ev});
  if (ev.id === 'vip' || ev.id === 'influencer') spawnCustomer(ev.id);
  if (ev.id === 'kundak') R.arson = {t:ARSON_T, x:rightWall() - 45, y:aisleY()};
  if (ev.id === 'turist') for (let i = 0; i < free; i++) spawnCustomer('turist', i * 40);
  announce(ev);
}

// Kartlar sırayla gösterilir: aynı anda iki olay/başarım gelirse biri kaybolmaz
const cardQ = [];
let cardBusy = false;
function announce(ev, prefix){ cardQ.push([ev, prefix]); if (!cardBusy) nextCard(); }
function nextCard(){
  const it = cardQ.shift();
  if (!it){ cardBusy = false; return; }
  cardBusy = true;
  const [ev, prefix] = it;
  $('#eventCard').innerHTML = `<div class="em">${ev.emoji}</div><div><b>${prefix ? prefix + ': ' : ''}${ev.name}</b><small>${ev.desc}</small></div>`;
  $('#eventCard').classList.add('show');
  ev.id === 'elektrik' ? SFX.blackout() : ev.ach ? SFX.levelUp() : SFX.event();
  setTimeout(() => { $('#eventCard').classList.remove('show'); setTimeout(nextCard, 450); }, 3600);
}

function checkAch(){
  if (!S.owner) return;
  for (const a of ACH){
    if (S.ach[a.id] || a.val() < a.goal) continue;
    S.ach[a.id] = Date.now();
    S.money += a.reward;
    announce({emoji:a.emoji, name:a.name, desc:`${a.desc} · +₺${fmt(a.reward)}`, ach:true}, '🏅 Başarım');
    if (status === 'running') confetti();
    save();
  }
}

// Her gün 3 farklı türde görev; zorluk ve ödül gün sayısıyla büyür
const QUESTS = {
  sell:   {make:d => { const p = pick(sellable()); return {p, n:Math.min(12, 3 + Math.floor(d / 4))}; },
           label:q => `${P[q.p].emoji} ${q.n} ${P[q.p].name} sat`, short:q => `${P[q.p].emoji} ${P[q.p].name}`, prog:q => R.sold[q.p] || 0},
  serve:  {make:d => ({n:Math.min(35, 6 + d)}),                   label:q => `👥 ${q.n} müşteriye servis yap`, short:() => '👥 Servis', prog:() => R.stats.served},
  combo:  {make:d => ({n:Math.min(15, 3 + Math.floor(d / 3))}),   label:q => `🔥 ${q.n} kombo yap`,            short:() => '🔥 Kombo',  prog:() => R.stats.bestCombo},
  tips:   {make:d => ({n:Math.round((40 + d * 18) / 10) * 10}),   label:q => `💰 ₺${fmt(q.n)} bahşiş topla`,    short:() => '💰 Bahşiş', prog:() => R.stats.tips},
  nolose: {make:d => ({n:Math.min(20, 5 + Math.floor(d / 2))}),   label:q => `😊 Kimseyi kızdırmadan ${q.n} servis`, short:() => '😊 Kızdırma',
           prog:() => R.stats.lost ? -1 : R.stats.served}, // -1 = başarısız
};
function ensureQuests(){
  if (S.day < 2 || (S.quests && S.quests.day === S.day)) return;
  const types = Object.keys(QUESTS).sort(() => Math.random() - 0.5).slice(0, 3);
  const reward = Math.round((40 + S.day * 12) * (1 + 0.3 * mainLv()) / 10) * 10;
  S.quests = {day:S.day, bonus:false, list:types.map(t => Object.assign({t, reward, done:false}, QUESTS[t].make(S.day)))};
  save();
}
const questProg = q => q.done ? q.n : status === 'running' ? QUESTS[q.t].prog(q) : 0;
function checkQuests(){
  if (status !== 'running' || !S.quests || S.quests.day !== S.day) return;
  for (const q of S.quests.list){
    if (q.done || questProg(q) < q.n) continue;
    q.done = true; S.money += q.reward; S.questsDone = (S.questsDone || 0) + 1;
    toast(`📋 Görev tamam: ${QUESTS[q.t].label(q)} · +₺${fmt(q.reward)}`); SFX.pay(); bump('#money', 'bump');
    save();
  }
  if (!S.quests.bonus && S.quests.list.every(q => q.done)){
    S.quests.bonus = true;
    const bonus = Math.round(S.quests.list[0].reward * 1.5);
    S.money += bonus; S.rep = Math.min(100, S.rep + 5);
    announce({emoji:'📋', name:'Bugünün tüm görevleri tamam!', desc:`Bonus +₺${fmt(bonus)} · +5⭐`, ach:true});
    confetti(); save();
  }
}
function questsHTML(){
  if (!S.quests || S.quests.day !== S.day) return '';
  const head = status === 'running' ? '' : `<div class="qhead">📋 Bugünün görevleri · her biri +₺${fmt(S.quests.list[0].reward)}</div>`;
  return head + S.quests.list.map(q => {
    const p = questProg(q), failed = p < 0;
    const cls = q.done ? ' done' : failed ? ' fail' : '';
    const val = q.t === 'tips' ? `₺${fmt(Math.max(0, p))}/₺${fmt(q.n)}` : `${Math.max(0, Math.min(p, q.n))}/${q.n}`;
    return `<div class="quest${cls}" title="${QUESTS[q.t].label(q)}"><span>${status === 'running' ? QUESTS[q.t].short(q) : QUESTS[q.t].label(q)}</span><b>${q.done ? '✓' : failed ? '✗' : val}</b>
      <i style="width:${q.done ? 100 : Math.max(0, Math.min(1, p / q.n)) * 100}%"></i></div>`;
  }).join('');
}

function nextStreak(){

// 7 günlük döngü; 7. gün büyük ödül; dükkân büyüdükçe ödül de büyür
const dailyAmount = st => Math.round((20 + 30 * ((st - 1) % 7 + 1) + ((st - 1) % 7 === 6 ? 200 : 0)) * (1 + 0.5 * mainLv()));

// ---------- Oyun döngüsü (mantık) ----------
function tick(dt){
  R.t += dt;
  if (R.t >= DAY_LEN){ endDay(); return; }
  // Etkinliğin ilk günü: tanıtım kartı
  if (!R.evShown){
    R.evShown = true;
    const ep = evProg();
    if (ep && !ep.seen){ ep.seen = true; announce(EV(), '🎉 Etkinlik başladı'); }
  }

  R.spawnIn -= dt;
  if (R.spawnIn <= 0){ spawnCustomer(); R.spawnIn = spawnInterval() * rand(0.6, 1.4); }
  if (R.criticAt != null && R.t >= R.criticAt && freeSeats().length){
    R.criticAt = null; R.review = 0; S.critic = null;
    spawnCustomer('elestirmen'); announce(CRITIC);
  }

  if (S.day >= 2 && DAY_LEN - R.t > 15){
    R.eventIn -= dt;
    if (R.eventIn <= 0){ triggerLiveEvent(); R.eventIn = rand(25, 45); }
  }
  if (lv('temizlikci') && R.stains.length && (R.cleanIn -= dt) <= 0){
    const st = R.stains.shift(); floatText(st.x, st.y - 20, '🧹✨', '#fff');
    R.cleanIn = 9 / lv('temizlikci');
  }
  if (R.arson){
    R.arson.t -= dt;
    const gl = lv('guvenlik');
    if (gl && ARSON_T - R.arson.t >= 3.5 - 0.8 * gl) catchArson('💂 Güvenlik yakaladı!');
    else if (R.arson.t <= 0){
      const loss = Math.min(S.money, 40 * S.day), a = R.arson;
      S.money -= loss; S.rep = Math.max(0, S.rep - 5); R.arson = null;
      R.effects.push({id:'yangin', left:12, ev:FIRE}); announce(FIRE); SFX.error();
      floatText(a.x - 40, a.y - 100, `🔥 -₺${fmt(loss)} -5⭐`, '#ff6b5e');
    }
  }
  if (R.combo && (R.comboT -= dt) <= 0){
    if (R.combo >= 3) floatText(140, 440, `⏱️ Kombo bitti (${R.combo})`, '#c9b39a');
    R.combo = 0;
  }
  R.effects.forEach(e => e.left -= dt);
  R.effects = R.effects.filter(e => e.left > 0);

  // Oyuncunun ocağı
  const busy = new Set(effect('yangin') ? ['ocak', ...UPGRADES.filter(u => u.grp === 'alet').map(u => u.id)] : []);   // yangında pişmez
  for (const x of [...R.queue]){
    const st = P[x.p].tool || 'ocak';
    if (busy.has(st)) continue;
    busy.add(st); x.prog += dt;
    if (x.prog >= prepTime(x.p)){ trayAdd(x.p); R.queue.splice(R.queue.indexOf(x), 1); }
  }

  // Çıraklar
  for (let i = 0; i < lv('cirak'); i++){
    const h = R.helpers[i];
    if (!h){
      if (!hasRoom()) continue;
      const n = needed(); const p = Object.keys(n).find(k => n[k] > 0);
      if (p) R.helpers[i] = {p, prog:0};
    } else {
      h.prog += dt * 0.7 * (1 + 0.2 * lv('cirakhiz'));
      if (h.prog >= prepTime(h.p)){ trayAdd(h.p); R.helpers[i] = null; }
    }
  }

  // Garsonlar: tepsiden alır, masaya yürür, teslim eder, geri döner
  for (const gs of R.garsons){
    if (gs.state === 'idle'){
      const targets = R.customers.filter(seated).sort((a, b) => a.patience - b.patience);
      for (const c of targets){
        const want = {};
        c.order.forEach(o => { if (!o.done) want[o.p] = (want[o.p] || 0) + 1; });
        R.garsons.forEach(o => o.cid === c.id && o.carry && want[o.carry]--);
        const p = Object.keys(want).find(k => want[k] > 0 && R.tray.includes(k));
        if (!p) continue;
        trayRemove(R.tray.indexOf(p));
        const s = SLOTS[c.seat], home = garsonHome(gs.i);
        gs.carry = p; gs.cid = c.id; gs.state = 'go';
        const a = aisleY();
        gs.path = [{x:home.x, y:a}, {x:s.x + 75, y:a}, {x:s.x + 75, y:s.y + 10}, {x:s.x + 42, y:s.y + 10}];
        break;
      }
    } else if (gs.state === 'go'){
      if (moveAlong(gs, dt, garsonSpeed())){
        const c = R.customers.find(c => c.id === gs.cid);
        const o = c && seated(c) && c.order.find(o => !o.done && o.p === gs.carry);
        if (o){
          o.done = true; o.doneAt = now();
          if (c.order.every(o => o.done)) pay(c); else SFX.serve();
        } else if (R.tray.length < trayCap()) { R.tray.push(gs.carry); R.trayT.push(R.t); }
        gs.carry = null; gs.cid = null; gs.state = 'back';
        const home = garsonHome(gs.i), s = {x:gs.x, y:gs.y};
        const a = aisleY();
        gs.path = [{x:s.x + 33, y:s.y}, {x:s.x + 33, y:a}, {x:home.x, y:a}, home];
      }
    } else if (gs.state === 'back'){
      if (moveAlong(gs, dt, garsonSpeed())){ gs.state = 'idle'; gs.flip = false; }
    }
  }

  // Müşteriler
  for (const c of [...R.customers]){
    if (c.state === 'in'){
      if (moveAlong(c, dt, 150)){ c.state = 'seated'; c.flip = false; if (c.reg) regGreet(c); }
    } else if (c.state === 'out'){
      if (moveAlong(c, dt, 150)) R.customers = R.customers.filter(x => x !== c);
    } else {
      c.patience -= dt * (1 + 0.06 * dirt());
      if (c.patience < 2 && !c.calmed && R.calmed < lv('mudur')){
        c.calmed = true; R.calmed++; c.patience += c.max * 0.4;
        floatText(SLOTS[c.seat].x, SLOTS[c.seat].y - 110, '👔 Müdür yatıştırdı', '#9fd8ff');
      }
      if (c.patience <= 0){
        c.patience = 0;
        const penalty = c.special === 'vip' || c.special === 'influencer' || c.special === 'elestirmen' ? 10 : 4;
        const s = SLOTS[c.seat];
        floatText(s.x, s.y - 100, `💢 -${penalty}⭐`, '#ff6b5e');
        if (R.combo >= 3) floatText(s.x, s.y - 130, `Kombo bitti (${R.combo})`, '#c9b39a', 0.2);
        R.combo = 0;
        S.rep = Math.max(0, S.rep - penalty);
        R.stats.lost++;
        bump('#rep', 'shake');
        SFX.angry();
        if (c.reg) regAngry(c);
        if (c.special === 'elestirmen') review(1);
        leave(c, 'angry');
      }
    }
  }
}

function endDay(){
  status = 'closed';
  SFX.dayEnd();
  const rent = Math.round(15 * S.day * (lv('mudur') ? 0.75 : 1));
  S.money = Math.max(0, S.money - rent);
  const st = R.stats, net = st.earned + st.tips - st.mat - rent;
  const passive = S.branches.reduce((s, b, i) => i === S.cur ? s : s + managedIncome(b), 0);
  S.money += passive; S.total += passive;
  const fameInc = (fameLv() >= 2 ? 25 * S.day : 0) + (fameLv() >= 3 ? 5 * R.stats.served : 0);   // reklam + çay markası
  S.money += fameInc; S.total += fameInc;
  const risk = riskDay(R.interview);
  let night = null;
  if (S.day >= 5 && Math.random() < 0.06){
    const n = pick(NIGHT), blocked = n.guard && Math.random() < 0.35 * lv('guvenlik');
    const loss = blocked ? 0 : Math.min(S.money, n.loss());
    S.money -= loss; night = {n, blocked, loss};
  }
  // Günün karnesi: 3 yıldız = kimse kızmadı
  const ratio = st.served / Math.max(1, st.served + st.lost);
  const stars = st.lost === 0 && st.served >= 5 ? 3 : ratio >= 0.8 ? 2 : 1;
  const record = net > S.bestDay && S.day > 1;
  S.bestDay = Math.max(S.bestDay, net);
  const perfect = st.served >= 15 && st.lost === 0;
  if (perfect) S.perfect++;
  // Sıradaki hedef: henüz alınamayan en ucuz şey
  const goals = [];
  const nx = SHOP_LEVELS[lv('dukkan') + 1];
  if (nx && S.day + 1 >= nx.day) goals.push({t:`🏪 ${nx.name}`, c:nx.cost});
  PRODUCTS.filter(p => !S.unlocked.includes(p.id) && !shopLocked(p)).forEach(p => goals.push({t:`${p.emoji} ${p.name}`, c:p.cost}));
  if (canBranch()) goals.push({t:'🏙️ Yeni şube', c:branchCost()});
  if (canBranch('world')) goals.push({t:'🌍 Yurt dışı şubesi', c:branchCost('world')});
  S.unlocked.filter(id => recLv(id) < MAX_RECIPE).forEach(id => goals.push({t:`${P[id].emoji} ${P[id].name} tarifi`, c:recipeCost(id)}));
  UPGRADES.filter(u => lv(u.id) < maxLv(u)).forEach(u => goals.push({t:`${u.emoji} ${u.name}`, c:upCost(u)}));
  const goal = goals.filter(x => x.c > S.money).sort((a, b) => a.c - b.c)[0];
  const buyNow = goals.filter(x => x.c <= S.money).sort((a, b) => a.c - b.c)[0];
  // Yarın eleştirmen gelecek mi? (5. günden sonra %30)
  S.critic = S.day + 1 >= 5 && Math.random() < 0.3 ? S.day + 1 : null;
  const askRate = stars === 3 && rateReady();
  if (askRate){ S.rateAsks = (S.rateAsks || 0) + 1; S.rateNext = S.day + 7; }
  showModal(`
    <h2>🌙 ${S.day}. gün bitti!</h2>
    <div class="stars">${'⭐'.repeat(stars)}<span>${'⭐'.repeat(3 - stars)}</span></div>
    ${record ? '<p class="banner">🎉 Yeni rekor! En kârlı günün!</p>' : ''}
    ${perfect ? '<p class="banner">✨ Kusursuz gün: kimse kızmadı!</p>' : ''}
    ${R.dayEvent ? `<p class="hint">Günün olayı: ${R.dayEvent.emoji} ${R.dayEvent.name}</p>` : ''}
    <p class="hint">📅 Yarın ${WD(S.day + 1).name}${WD(S.day + 1).tip ? ': hafta sonu, dükkân dolar, bahşiş bol!' : WD(S.day + 1).spawn > 1 ? ': haftanın ilk günü, sakin geçer.' : ''}</p>
    ${night ? `<p class="banner${night.blocked ? '' : ' bad'}">🌙 ${night.n.emoji} ${night.blocked ? `${night.n.name} ama güvenlik yakaladı!` : `${night.n.name}: -₺${fmt(night.loss)}`}</p>` : ''}
    ${R.focus ? '<p class="hint">🧹 Odak günü: satışlar %20 fazlaydı</p>' : ''}
    <table>
      <tr><td>Servis edilen müşteri</td><td>${st.served}</td></tr>
      <tr><td>Kızıp giden müşteri</td><td>${st.lost}</td></tr>
      <tr><td>En uzun kombo</td><td>🔥 ${st.bestCombo}</td></tr>
      ${R.regsToday.length ? `<tr><td>Gelen müdavimler</td><td>${R.regsToday.map(id => REG[id].emoji).join(' ')}</td></tr>` : ''}
      ${R.review ? `<tr><td>🧐 Eleştirmen puanı</td><td style="color:#f5c518">${starStr(R.review)}</td></tr>` : ''}
      ${S.quests && S.quests.day === S.day ? `<tr><td>Günlük görevler</td><td>📋 ${S.quests.list.filter(q => q.done).length}/3</td></tr>` : ''}
      <tr><td>Satış</td><td>₺${fmt(st.earned)}</td></tr>
      <tr><td>Bahşiş</td><td>₺${fmt(st.tips)}</td></tr>
      <tr><td>${Q().emoji} Malzeme (${Q().name})</td><td style="color:var(--bad)">-₺${fmt(st.mat)}</td></tr>
      ${st.good + st.bad ? `<tr><td>💬 Müşteri yorumları</td><td>👍 ${st.good} · 👎 ${st.bad}</td></tr>` : ''}
      <tr><td>Kira ve masraflar</td><td style="color:var(--bad)">-₺${fmt(rent)}</td></tr>
      <tr><td><b>Net kâr</b></td><td style="color:${net < 0 ? 'var(--bad)' : 'var(--good)'}">${net < 0 ? '-' : ''}₺${fmt(Math.abs(net))}</td></tr>
      ${fameInc ? `<tr><td>🌟 Reklam ve çay markası</td><td style="color:var(--good)">+₺${fmt(fameInc)}</td></tr>` : ''}
      ${passive ? `<tr><td>🏙️ Diğer şubeler (müdürler)</td><td style="color:var(--good)">+₺${fmt(passive)}</td></tr>` : ''}
    </table>
    ${risk.lost.map(l => `<p class="banner bad">💥 ${l.nm} şubesi battı! Kalan eşyalar satıldı: +₺${fmt(l.refund)}</p>`).join('')}
    ${risk.news.length ? `<div class="news">${risk.news.map(n => `<div>${n}</div>`).join('')}</div>` : ''}
    ${S.critic ? '<p class="banner">🧐 Yarın bir yemek eleştirmeni gelecek! En pahalı ürünlerini isteyecek: tariflerini geliştir, salonda kimseyi kızdırma.</p>' : ''}
    ${buyNow ? `<p class="hint">🛒 Şimdi alabilirsin: <b>${buyNow.t}</b> · ₺${fmt(buyNow.c)}</p>` : ''}
    ${goal ? `<p class="hint">🎯 Sıradaki hedef: <b>${goal.t}</b> · ₺${fmt(S.money)} / ₺${fmt(goal.c)}</p>` : ''}
    ${askRate ? `<div class="banner" id="rateRow">❤️ Çay Ocağı'nı sevdin mi? Bir yorumun oyunu büyütmemize çok yardım eder!
      <div class="btns"><button class="btn2" id="rateYes">⭐ Puan ver</button><button class="btn2" id="rateLater">Sonra</button></div></div>` : ''}
    <button class="big" id="modalOk">Tamam</button>
    <div class="btns"><button class="btn2" id="goShop">🛒 Mağazaya git</button>
      ${troubled() ? '<button class="btn2" id="goSube">🏙️ Şubelere git</button>' : ''}</div>`);
  // Ünlülük: iyi geçen gün ve her şube adını biraz daha duyurur
  // 4 kalpli müdavimler seni herkese anlatır: kişi başı her gün +1 ünlülük
  const family = REGULARS.filter(r => regLv(r.id) >= REG_HEARTS.length - 1).length;
  addFame(stars + (perfect ? 5 : 0) + 2 * trCount() + 5 * worldCount() + family);
  S.day++;
  // Yarın için röportaj isteği (3. günden sonra, %40 ihtimal)
  S.offer = null;
  if (S.day >= 3 && Math.random() < 0.4){
    const fl = fameLv();
    S.offer = {day:S.day, tier:Math.min(OUTLETS.length - 1, Math.max(0, fl - (Math.random() < 0.5 ? 1 : 0)))};
  }
  newDay();
  save();
}

const scene = $('#scene');
const g = scene.getContext('2d');
const EMOJI = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const now = () => performance.now() / 1000;
const tableBorn = {};      // yeni eklenen masanın "belirme" animasyonu
let levelUpAt = -10;       // dükkân büyüyünce parlama
let particles = [];

function fitCanvas(c, ctx, w, h){
  const dpr = Math.min(2, window.devicePixelRatio || 1); // telefonlarda 3x gereksiz yük
  const k = c.clientWidth / w * dpr;
  if (!k) return;
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  ctx.setTransform(k, 0, 0, k, 0, 0);
}
new ResizeObserver(() => fitCanvas(scene, g, W, viewH())).observe(scene);

function rr(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function ell(ctx, x, y, rx, ry){ ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
function line(ctx, x1, y1, x2, y2){ ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function emoji(ctx, ch, x, y, size){
  ctx.font = `${size}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(ch, x, y);
}
function mix(a, b, t){
  const pa = a.match(/\w\w/g).map(h => parseInt(h, 16)), pb = b.match(/\w\w/g).map(h => parseInt(h, 16));
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const easeBack = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

// ---------- Mini insan ----------
// o: {x, y(ayak), look, sit, walk(faz|null), mood, apron, bob, flip, scale, carry(emoji)}
function drawPerson(ctx, o){
  const L = o.look;
  ctx.save();
  ctx.translate(o.x, o.y);
  if (o.scale) ctx.scale(o.scale, o.scale);
  const moving = o.walk != null;
  const sw = moving ? Math.sin(o.walk) * 4 : 0;
  const lift = moving ? -Math.abs(Math.sin(o.walk)) * 2 : (o.bob || 0);
  const base = o.sit ? -6 : -18;        // gövdenin alt kenarı
  const hy = base - 40;                 // kafa merkezi

  if (!o.sit){
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ell(ctx, 0, 0, 14, 4); ctx.fill();
  }
  ctx.translate(0, lift);
  if (o.flip) ctx.scale(-1, 1);

  if (!o.sit){
    ctx.fillStyle = L.suit ? '#1d1d2b' : '#3a3346';
    rr(ctx, -9, -18 - Math.max(0, sw), 7, 18, 3); ctx.fill();
    rr(ctx, 2, -18 - Math.max(0, -sw), 7, 18, 3); ctx.fill();
    ctx.fillStyle = '#1f1a17';
    rr(ctx, -10, -4 - Math.max(0, sw), 9, 5, 2); ctx.fill();

  }

  // uzun saç (arka)
  if (L.style === 1){ ctx.fillStyle = L.hair; rr(ctx, -15, hy - 4, 30, 28, 9); ctx.fill(); }

  // kollar
  const arm = (side, ang) => {
    ctx.save(); ctx.translate(side * 13, base - 25); ctx.rotate(ang);
    ctx.fillStyle = L.shirt; rr(ctx, -3, 0, 6, 17, 3); ctx.fill();
    ctx.fillStyle = L.skin; ell(ctx, 0, 18, 3.5, 3.5); ctx.fill();
    ctx.restore();
  };
  arm(-1, moving ? sw * 0.08 : 0.1);

  if (L.suit){ ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(-6, base - 28); ctx.lineTo(0, base - 18); ctx.lineTo(6, base - 28); ctx.fill();
    ctx.fillStyle = '#e8b923'; ctx.fillRect(-1.5, base - 24, 3, 12); }
  if (o.apron){ ctx.fillStyle = '#fbf6ee'; rr(ctx, -9, base - 20, 18, 22, 3); ctx.fill();
    ctx.strokeStyle = '#fbf6ee'; ctx.lineWidth = 2; line(ctx, -7, base - 20, -9, base - 28); line(ctx, 7, base - 20, 9, base - 28); }
  if (L.prop === 'camera'){ ctx.fillStyle = '#222'; rr(ctx, -6, base - 16, 12, 8, 2); ctx.fill(); ctx.fillStyle = '#6cf'; ell(ctx, 0, base - 12, 2.5, 2.5); ctx.fill(); }

  ctx.fillStyle = L.skin;

  ell(ctx, 0, hy, 14, 14); ctx.fill();
  if (o.mood === 'angry'){ ctx.fillStyle = 'rgba(255,40,40,.18)'; ell(ctx, 0, hy, 14, 14); ctx.fill(); }

  // saç (ön)
  ctx.fillStyle = L.hair;
  const cap = () => { ctx.beginPath(); ctx.arc(0, hy - 1, 15, Math.PI, Math.PI * 2); ctx.fill(); };
  if (L.style === 0) cap();
  if (L.style === 1){ cap(); rr(ctx, -15, hy - 2, 5, 20, 3); ctx.fill(); rr(ctx, 10, hy - 2, 5, 20, 3); ctx.fill(); }
  if (L.style === 2){ ell(ctx, -13, hy - 3, 3, 5); ctx.fill(); ell(ctx, 13, hy - 3, 3, 5); ctx.fill(); }
  if (L.style === 3){ cap(); ell(ctx, 0, hy - 17, 7, 7); ctx.fill(); }
  if (L.style === 4){ for (let a = 0; a <= 6; a++){ const t = Math.PI + a / 6 * Math.PI; ell(ctx, Math.cos(t) * 12, hy - 2 + Math.sin(t) * 12, 6, 6); ctx.fill(); } }

  // yüz
  ctx.fillStyle = '#2a1a12';
  ell(ctx, -5, hy + 2, 2, 2.4); ctx.fill(); ell(ctx, 5, hy + 2, 2, 2.4); ctx.fill();
  ctx.fillStyle = 'rgba(255,120,120,.35)'; ell(ctx, -8.5, hy + 7, 3, 2); ctx.fill(); ell(ctx, 8.5, hy + 7, 3, 2); ctx.fill();
  if (L.beard && L.g !== 'k'){ ctx.fillStyle = L.hair === '#9b9b9b' ? '#777' : L.hair; ell(ctx, 0, hy + 6, 6, 2.2); ctx.fill(); }
  if (L.g === 'k'){   // kirpik ve ruj
    ctx.strokeStyle = '#2a1a12'; ctx.lineWidth = 1.2;
    line(ctx, -7, hy - 0.5, -9, hy - 2.5); line(ctx, 7, hy - 0.5, 9, hy - 2.5);

  if (o.mood === 'angry'){
    ctx.beginPath(); ctx.arc(0, hy + 13, 4, Math.PI * 1.2, Math.PI * 1.8); ctx.stroke();

  } else if (o.mood === 'neutral'){
    line(ctx, -3, hy + 9.5, 3, hy + 9.5);
  } else {
    ctx.beginPath(); ctx.arc(0, hy + 6.5, 4, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
  }

  if (L.glasses){
    ctx.strokeStyle = '#2a1a12'; ctx.lineWidth = 1.3;
    ell(ctx, -5, hy + 2, 4.2, 3.6); ctx.stroke(); ell(ctx, 5, hy + 2, 4.2, 3.6); ctx.stroke(); line(ctx, -1, hy + 1.5, 1, hy + 1.5);

  if (L.hat === 'kasket'){
    ctx.fillStyle = '#5b4a3a'; ell(ctx, 0, hy - 10, 14, 7); ctx.fill(); ell(ctx, 7, hy - 6, 10, 3); ctx.fill();
  }
  if (L.hat === 'bere'){
    ctx.fillStyle = L.prop === 'note' ? '#8b1e2d' : '#2c3e50'; ell(ctx, -2, hy - 11, 15, 6); ctx.fill(); ell(ctx, -1, hy - 17, 2, 2); ctx.fill();
  }
  if (L.hat === 'crown'){
    ctx.fillStyle = '#f5c518';
    ctx.beginPath(); ctx.moveTo(-10, hy - 12); ctx.lineTo(-10, hy - 24); ctx.lineTo(-5, hy - 18); ctx.lineTo(0, hy - 27);
    ctx.lineTo(5, hy - 18); ctx.lineTo(10, hy - 24); ctx.lineTo(10, hy - 12); ctx.closePath(); ctx.fill();
  }
  if (L.hat === 'sun'){
    ctx.fillStyle = '#e3c27a'; ell(ctx, 0, hy - 9, 22, 5); ctx.fill(); ell(ctx, 0, hy - 13, 12, 8); ctx.fill();
    ctx.fillStyle = '#c0392b'; ctx.fillRect(-12, hy - 12, 24, 3);
  }

  // eldeki eşyalar
  if (o.carry){
    ctx.fillStyle = '#cfd3d8'; ell(ctx, 24, base - 41, 13, 3.5); ctx.fill();
    if (o.flip){ ctx.save(); ctx.scale(-1, 1); emoji(ctx, o.carry, -24, base - 52, 16); ctx.restore(); }
    else emoji(ctx, o.carry, 24, base - 52, 16);
  } else if (L.prop === 'phone'){
    ctx.fillStyle = '#222'; rr(ctx, 25, base - 46, 7, 12, 2); ctx.fill();
  } else if (L.prop === 'note'){
    ctx.fillStyle = '#fff8e1'; rr(ctx, 22, base - 46, 11, 14, 1.5); ctx.fill();
    ctx.strokeStyle = '#9a8a70'; ctx.lineWidth = 1; line(ctx, 24, base - 41, 31, base - 41); line(ctx, 24, base - 37, 31, base - 37);

}

function drawRoom(frac){
  const L = lv('dukkan'), RW = rightWall(), D = lv('dekor');

  // Dış alan (henüz kiralanmamış kısım)
  g.fillStyle = '#3b2a21'; g.fillRect(0, 0, W, H);
  if (RW < W){
    g.strokeStyle = '#2a1d16'; g.lineWidth = 2;
    for (let y = 0, r = 0; y < H; y += 22, r++){
      line(g, RW, y, W, y);
      for (let x = RW + (r % 2 ? 0 : 22); x < W; x += 44) line(g, x, y, x, y + 22);
    }
    g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(RW, 0, W - RW, H);
    g.fillStyle = '#c9b39a'; g.font = `bold 15px system-ui, ${EMOJI}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('🔒 Burası henüz senin değil', (RW + W) / 2, 250);
    g.font = '13px system-ui'; g.fillText('Dükkânı büyütünce açılır', (RW + W) / 2, 272);
  }

  // Zemin
  g.save(); g.beginPath(); g.rect(0, FLOOR, RW, H - FLOOR); g.clip();
  if (L === 0){
    g.fillStyle = '#8b5a35'; g.fillRect(0, FLOOR, RW, H);
    g.strokeStyle = '#6e4527'; g.lineWidth = 2;
    for (let y = FLOOR, r = 0; y < H; y += 26, r++){ line(g, 0, y, RW, y); for (let x = (r * 57) % 120; x < RW; x += 120) line(g, x, y, x, y + 26); }
  } else if (L === 1){
    for (let y = FLOOR, r = 0; y < H; y += 40, r++) for (let x = 0, c = 0; x < RW; x += 40, c++){
      g.fillStyle = (r + c) % 2 ? '#3f3a36' : '#ddd3c1'; g.fillRect(x, y, 40, 40);
    }
  } else if (L === 2){
    for (let y = FLOOR, r = 0; y < H; y += 36, r++) for (let x = 0, c = 0; x < RW; x += 36, c++){
      const alt = (r + c) % 2;
      g.fillStyle = alt ? '#9a6538' : '#b07a45'; g.fillRect(x, y, 36, 36);
      g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 1;
      for (let k = 1; k < 3; k++) alt ? line(g, x + k * 12, y, x + k * 12, y + 36) : line(g, x, y + k * 12, x + 36, y + k * 12);
    }
  } else {
    g.fillStyle = '#ece7df'; g.fillRect(0, FLOOR, RW, H);
    g.strokeStyle = 'rgba(140,125,110,.35)'; g.lineWidth = 1.2;
    for (let i = 0; i < 22; i++){
      const x0 = (i * 137) % RW, y0 = FLOOR + (i * 89) % (H - FLOOR);
      g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo(x0 + 30, y0 + 12, x0 + 65, y0 - 6); g.stroke();
    }
    g.strokeStyle = '#cbc2b4'; g.lineWidth = 1.5;
    for (let y = FLOOR; y < H; y += 70) line(g, 0, y, RW, y);
    for (let x = 0; x < RW; x += 70) line(g, x, FLOOR, x, H);
  }
  // Halı
  if (D >= 3){
    // Dikeyde masa ızgarasının altına, genişte masaların altına
    const [x, y, w, h] = portrait ? [36, 372, W - 72, aisleY() - 400] : [320, 268, Math.min(RW - 20, 900) - 320, 238];
    g.fillStyle = '#8e2b2b'; rr(g, x, y, w, h, 6); g.fill();
    g.strokeStyle = '#e6c98f'; g.lineWidth = 3; rr(g, x + 8, y + 8, w - 16, h - 16, 4); g.stroke();
    g.fillStyle = 'rgba(230,201,143,.35)';
    for (let k = x + 30; k < x + w - 20; k += 40){ g.beginPath(); g.moveTo(k, y + 20); g.lineTo(k + 8, y + 28); g.lineTo(k, y + 36); g.lineTo(k - 8, y + 28); g.fill(); }
  }
  const sh = g.createLinearGradient(0, FLOOR, 0, FLOOR + 45);
  sh.addColorStop(0, 'rgba(0,0,0,.3)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = sh; g.fillRect(0, FLOOR, RW, 45);
  g.restore();

  // Duvar
  g.save(); g.beginPath(); g.rect(0, 0, RW, FLOOR); g.clip();
  g.fillStyle = ['#d8c3a0', '#efe3c6', '#7b2f2f', '#22344a'][L]; g.fillRect(0, 0, RW, FLOOR);
  if (L === 0){ g.fillStyle = 'rgba(0,0,0,.05)'; for (let i = 0; i < 8; i++){ ell(g, (i * 173) % RW, 30 + (i * 61) % 120, 18, 10); g.fill(); } }
  if (L === 1){ g.fillStyle = '#3e6b4f'; g.fillRect(0, 135, RW, 65); g.strokeStyle = '#2d5039'; g.lineWidth = 2;
    for (let x = 0; x < RW; x += 60) g.strokeRect(x + 8, 145, 44, 45); }
  if (L === 2){ g.fillStyle = 'rgba(255,210,120,.16)';
    for (let y = 12, r = 0; y < 130; y += 24, r++) for (let x = (r % 2) * 16; x < RW; x += 32){ g.beginPath(); g.moveTo(x, y - 5); g.lineTo(x + 5, y); g.lineTo(x, y + 5); g.lineTo(x - 5, y); g.fill(); }
    g.fillStyle = '#4a2a1a'; g.fillRect(0, 135, RW, 65); }
  if (L === 3){ g.fillStyle = '#1a2838'; g.fillRect(0, 135, RW, 65);
    g.fillStyle = 'rgba(201,161,74,.22)'; for (let x = 20; x < RW; x += 160) g.fillRect(x, 14, 10, 121);
    g.strokeStyle = '#c9a14a'; g.lineWidth = 3; line(g, 0, 14, RW, 14); line(g, 0, 135, RW, 135); }

  // Pencereler (gün ilerledikçe gökyüzü kararır)
  const sky = frac < 0.6 ? '#8fd0f5' : frac < 0.85 ? mix('#8fd0f5', '#f5a15a', (frac - 0.6) / 0.25) : mix('#f5a15a', '#33406a', Math.min(1, (frac - 0.85) / 0.15));
  const x0 = 300, x1 = RW - 190, ww = 100, n = Math.min([1, 2, 3, 3][L], Math.floor((x1 - x0) / (ww + 10)));
  const gap = (x1 - x0 - n * ww) / (n + 1);
  for (let i = 0; i < n; i++){
    const wx = x0 + gap + i * (ww + gap), wy = 28, wh = 85;
    g.fillStyle = '#5a3a22'; g.fillRect(wx - 6, wy - 6, ww + 12, wh + 12);
    g.fillStyle = sky; g.fillRect(wx, wy, ww, wh);
    g.fillStyle = 'rgba(40,40,60,.35)'; g.fillRect(wx, wy + wh - 22, 28, 22); g.fillRect(wx + 34, wy + wh - 32, 30, 32); g.fillRect(wx + 70, wy + wh - 18, 30, 18);
    g.strokeStyle = '#5a3a22'; g.lineWidth = 4; line(g, wx + ww / 2, wy, wx + ww / 2, wy + wh); line(g, wx, wy + wh / 2, wx + ww, wy + wh / 2);
    g.fillStyle = '#6b4428'; g.fillRect(wx - 10, wy + wh + 4, ww + 20, 7);
    if (L >= 2){ g.fillStyle = L === 3 ? '#7a1f2b' : '#b8483a';
      g.beginPath(); g.moveTo(wx - 10, wy - 8); g.lineTo(wx + 18, wy - 8); g.lineTo(wx - 2, wy + wh + 4); g.lineTo(wx - 10, wy + wh + 4); g.fill();
      g.beginPath(); g.moveTo(wx + ww + 10, wy - 8); g.lineTo(wx + ww - 18, wy - 8); g.lineTo(wx + ww + 2, wy + wh + 4); g.lineTo(wx + ww + 10, wy + wh + 4); g.fill(); }
  }

  // Tablo
  if (D >= 2){
    const fx = RW - 172, fy = 36;
    g.fillStyle = '#c9a14a'; g.fillRect(fx - 4, fy - 4, 56, 66);
    g.fillStyle = '#9fd3f5'; g.fillRect(fx, fy, 48, 58);
    g.fillStyle = '#4c8c4a'; g.beginPath(); g.moveTo(fx, fy + 58); g.quadraticCurveTo(fx + 20, fy + 25, fx + 48, fy + 45); g.lineTo(fx + 48, fy + 58); g.fill();
    g.fillStyle = '#fff3b0'; ell(g, fx + 36, fy + 14, 6, 6); g.fill();
  }
  // Duvar saati
  const cx = RW - 70, cy = 72;
  g.fillStyle = '#5a3a22'; ell(g, cx, cy, 30, 30); g.fill();
  g.fillStyle = '#fbf6ee'; ell(g, cx, cy, 25, 25); g.fill();
  const mins = 8 * 60 + frac * 12 * 60;
  g.strokeStyle = '#2a1a12'; g.lineCap = 'round';
  const ha = (mins / 60 % 12) / 12 * Math.PI * 2 - Math.PI / 2, ma = (mins % 60) / 60 * Math.PI * 2 - Math.PI / 2;
  g.lineWidth = 3; line(g, cx, cy, cx + Math.cos(ha) * 12, cy + Math.sin(ha) * 12);
  g.lineWidth = 2; line(g, cx, cy, cx + Math.cos(ma) * 19, cy + Math.sin(ma) * 19);
  // Nazar boncuğu
  if (D >= 5){ [['#1f4fa3', 11], ['#fff', 7], ['#5fb3f0', 4.5], ['#111', 2.2]].forEach(([c, r]) => { g.fillStyle = c; ell(g, RW - 26, 150, r, r); g.fill(); }); }

  // Raf ve bardaklar
  g.fillStyle = '#6b4428'; g.fillRect(28, 112, 244, 7);
  for (let i = 0; i < 8; i++){
    const x = 44 + i * 28;
    g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.moveTo(x - 6, 92); g.lineTo(x + 6, 92); g.lineTo(x + 3, 112); g.lineTo(x - 3, 112); g.fill();
    g.fillStyle = '#b5481c'; g.beginPath(); g.moveTo(x - 5, 98); g.lineTo(x + 5, 98); g.lineTo(x + 3, 111); g.lineTo(x - 3, 111); g.fill();
  }
  if (L >= 2){ g.fillStyle = '#6b4428'; g.fillRect(28, 172, 244, 7);
    ['#d35400', '#7f8c8d', '#27ae60', '#c0392b'].forEach((c, i) => { g.fillStyle = c; rr(g, 44 + i * 60, 148, 26, 24, 5); g.fill(); g.fillStyle = '#ddd'; g.fillRect(44 + i * 60, 145, 26, 5); }); }

  // Koleksiyon rafı: sahip olunan parçalar pencerelerin altında sergilenir (sığdığı kadar, en yeniler)
  const shown = COL_ITEMS.filter(it => owned(it.id));
  if (shown.length){
    const fit = Math.max(1, Math.floor((RW - 430) / 28)), list = shown.slice(-fit), sx0 = 300;
    g.fillStyle = '#6b4428'; g.fillRect(sx0 - 8, 186, list.length * 28 + 16, 6);
    list.forEach((it, i) => emoji(g, it.emoji, sx0 + 14 + i * 28, 173, 20));
  }

  // Tabela
  drawSign();

  // Sarkıt lambalar / avize
  if (D >= 4){
    // Dikeyde masa sütunları tabelanın önüne düşer: lambalar tabela–pencere ve tablo–saat arasındaki boşluklara asılır
    (portrait ? [290, 488] : COLS.filter(x => x < RW - 60)).forEach(x => {

      g.fillStyle = gl; g.fillRect(x - 60, 0, 120, 120);
      g.fillStyle = L === 3 ? '#c9a14a' : '#2d5039'; g.beginPath(); g.moveTo(x - 6, 42); g.lineTo(x + 6, 42); g.lineTo(x + 14, 56); g.lineTo(x - 14, 56); g.fill();
      g.fillStyle = '#ffe9a8'; ell(g, x, 57, 5, 3); g.fill();
    });
  }
  g.restore();

  // Sağ duvar ve kapı
  const doorTop = aisleY() - 85;
  g.fillStyle = '#4a3020'; g.fillRect(RW - 8, 0, 10, doorTop);
  g.fillStyle = '#6b4428'; g.fillRect(RW - 14, doorTop - 6, 22, 8);
  g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(RW + 2, doorTop, 8, H - doorTop);
}

function drawSign(){
  const t = lv('tabela'), name = owner().shopName;
  const x = 24, y = 20, w = 252, h = 62;
  g.fillStyle = '#3a2416'; rr(g, x, y, w, h, 8); g.fill();
  g.strokeStyle = '#c9a14a'; g.lineWidth = 2; rr(g, x + 4, y + 4, w - 8, h - 8, 6); g.stroke();
  let size = S.cur ? 22 : 26;
  g.font = `bold ${size}px Georgia, serif`;
  while (g.measureText(name).width > w - 24 && size > 12){ size--; g.font = `bold ${size}px Georgia, serif`; }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  if (t > 0){
    const col = ['#ffd36b', '#ff6bd6', '#6be3ff', '#7bff8a', '#ff8a5c'][t - 1];
    const flicker = t >= 2 && Math.sin(now() * 7) > 0.97 ? 0.4 : 1;
    g.shadowColor = col; g.shadowBlur = (8 + t * 5) * flicker; g.fillStyle = col;
  } else g.fillStyle = '#f6ead8';
  const sub = S.cur ? city().name.toLocaleUpperCase('tr-TR') : '';
  g.fillText(name, x + w / 2, y + h / 2 + (sub ? -7 : 1));
  g.shadowBlur = 0;
  if (sub){ g.font = 'bold 12px Georgia, serif'; g.fillStyle = '#c9a14a'; g.fillText('— ' + sub + ' —', x + w / 2, y + h - 14); }
  if (t >= 3){
    for (let i = 0; i < 14; i++){
      const on = (Math.floor(now() * 4) + i) % 2;
      g.fillStyle = on ? '#fff3b0' : '#a0884a';
      ell(g, x + 8 + i * (w - 16) / 13, y - 4, 2.5, 2.5); g.fill();
      ell(g, x + 8 + i * (w - 16) / 13, y + h + 4, 2.5, 2.5); g.fill();
    }
  }
}

const CHAIR = ['#6b4428', '#5a3a22', '#4a2a16', '#2a3b4f'];
function drawTable(i, c){
  const s = SLOTS[i], L = lv('dukkan'), t = now();
  let k = 1;
  if (tableBorn[i] != null){ const a = (t - tableBorn[i]) / 0.6; if (a < 1) k = easeBack(Math.max(0.01, a)); else delete tableBorn[i]; }
  g.save(); g.translate(s.x, s.y); g.scale(k, k);
  if (c && canServe(c)){ g.fillStyle = `rgba(108,192,112,${0.25 + Math.sin(t * 6) * 0.1})`; ell(g, 0, 8, 56, 22); g.fill(); }
  // sandalye
  g.fillStyle = CHAIR[L]; rr(g, -17, -60, 34, 44, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.08)'; rr(g, -12, -55, 24, 30, 5); g.fill();
  // oturan müşteri
  if (c && c.state === 'seated'){
    const ratio = c.patience / c.max;
    const mood = c.leaving ? c.leaving.mood : ratio > 0.5 ? 'happy' : ratio > 0.25 ? 'neutral' : 'angry';
    const shake = ratio < 0.25 ? Math.sin(t * 40) * 1.2 : 0;
    drawPerson(g, {x:shake, y:-6, sit:true, look:c.look, mood});
  }
  // masa
  g.fillStyle = '#2a1d16'; g.fillRect(-4, 0, 8, 24); ell(g, 0, 24, 14, 4); g.fill();
  g.fillStyle = 'rgba(0,0,0,.25)'; ell(g, 0, 4, 42, 15); g.fill();
  g.fillStyle = ['#a0703f', '#c0392b', '#f3ead6', '#f4f1ec'][L]; ell(g, 0, 0, 42, 14); g.fill();
  if (L === 1){ g.fillStyle = '#fff'; for (let a = -36; a < 36; a += 12) { ell(g, a + 6, 0, 3, 3); g.fill(); } }
  if (L === 3){ g.strokeStyle = '#c9a14a'; g.lineWidth = 2; ell(g, 0, 0, 42, 14); g.stroke(); }
  if (L === 0){ g.strokeStyle = 'rgba(0,0,0,.2)'; g.lineWidth = 1; ell(g, 0, 0, 30, 9); g.stroke(); }
  // teslim edilenler masada
  if (c && c.state === 'seated'){
    const done = c.order.filter(o => o.done);
    done.forEach((o, j) => {
      const age = t - o.doneAt, kk = age < 0.35 ? easeBack(Math.max(0.01, age / 0.35)) : 1;
      g.save(); g.translate((j - (done.length - 1) / 2) * 20, -3); g.scale(kk, kk); emoji(g, P[o.p].emoji, 0, 0, 15); g.restore();
    });
  }
  g.restore();
}

function drawBubble(c){
  const s = SLOTS[c.seat], rem = c.order.filter(o => !o.done);
  if (!rem.length) return;
  const w = rem.length * 26 + 14, h = 32, x = s.x - w / 2, y = s.y - 118;

}

// Duvarın tepesinde sarkan ip boyunca bayrak/üçgen/emoji dizisi
const ropeY = (x, RW, y0, sag) => { const t = x / RW; return y0 + 4 * sag * t * (1 - t); };
function rope(y0, sag){
  const RW = rightWall();
  g.strokeStyle = '#3a2a20'; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(0, y0); g.quadraticCurveTo(RW / 2, y0 + sag * 2, RW, y0); g.stroke();
}
function bunting(colors, y0 = 6, sag = 9){
  const RW = rightWall(), n = Math.floor(RW / 34);
  rope(y0, sag);
  for (let i = 0; i < n; i++){
    const x = (i + 0.5) * RW / n, y = ropeY(x, RW, y0, sag);
    g.fillStyle = colors[i % colors.length];
    g.beginPath(); g.moveTo(x - 10, y); g.lineTo(x + 10, y); g.lineTo(x, y + 16); g.closePath(); g.fill();
  }
}
function garland(chars, step, size, y0 = 6, sag = 9, sway = 0){
  const RW = rightWall(), t = now();
  rope(y0, sag);
  for (let x = step / 2, i = 0; x < RW; x += step, i++){
    const y = ropeY(x, RW, y0, sag), dx = sway ? Math.sin(t * 1.5 + i) * sway : 0;
    g.strokeStyle = '#3a2a20'; g.lineWidth = 1; line(g, x, y, x + dx, y + 8);
    emoji(g, chars[i % chars.length], x + dx, y + 8 + size / 2, size);
  }
}
function star5(cx, cy, r){
  g.beginPath();
  for (let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, k = i % 2 ? r * 0.42 : r; g.lineTo(cx + Math.cos(a) * k, cy + Math.sin(a) * k); }
  g.closePath(); g.fill();
}
function trFlag(x, y, w){
  const h = w * 2 / 3;
  g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(x + 2, y + 2, w, h);
  g.fillStyle = '#e30a17'; g.fillRect(x, y, w, h);
  g.fillStyle = '#fff'; ell(g, x + w * 0.36, y + h / 2, h * 0.25, h * 0.25); g.fill();
  g.fillStyle = '#e30a17'; ell(g, x + w * 0.41, y + h / 2, h * 0.2, h * 0.2); g.fill();
  g.fillStyle = '#fff'; star5(x + w * 0.58, y + h / 2, h * 0.13);
}
function drawDeco(type){
  const RW = rightWall(), t = now();
  if (type === 'flags'){
    bunting(['#e30a17', '#fff']);
    trFlag(RW - 66, 100, 46);
  } else if (type === 'snow'){
    garland(['🎄', '⭐', '🎁'], 110, 16, 6, 9, 2);
    for (let i = 0; i < 45; i++){
      const x = (i * 97 + Math.sin(t + i) * 12) % RW, y = (t * (14 + i % 5 * 4) + i * 53) % H;
      g.fillStyle = 'rgba(255,255,255,.75)'; ell(g, x, y, 2 + i % 2, 2 + i % 2); g.fill();
    }
  } else if (type === 'hearts'){
    garland(['💕', '❤️', '💗'], 70, 15);
  } else if (type === 'lanterns'){
    // Mahya ışıkları + sallanan fenerler
    for (let x = 12; x < RW; x += 18){ g.fillStyle = `rgba(255,214,120,${0.55 + 0.45 * Math.sin(t * 3 + x)})`; ell(g, x, ropeY(x, RW, 4, 6), 2.5, 2.5); g.fill(); }
    garland(['🏮', '🌙'], 110, 24, 6, 9, 3);
  } else if (type === 'candy'){
    bunting(['#e74c3c', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6']);
  } else if (type === 'balloons'){
    bunting(['#e74c3c', '#f1c40f', '#3498db']);
    const cols = ['#e74c3c', '#f1c40f', '#2ecc71', '#3498db', '#e84393'];
    [[RW - 60, 70], [RW - 38, 84], [RW - 82, 88]].forEach(([x, y], i) => {
      const by = y + Math.sin(t * 1.4 + i) * 4;
      g.strokeStyle = '#555'; g.lineWidth = 1; line(g, x, by + 15, RW - 60, 170);
      g.fillStyle = cols[i]; ell(g, x, by, 12, 15); g.fill();
      g.fillStyle = 'rgba(255,255,255,.4)'; ell(g, x - 4, by - 5, 3, 4); g.fill();
    });
  } else if (type === 'sun'){
    bunting(['#f1c40f', '#3498db', '#fff']);
    emoji(g, '🌞', RW - 50, 80, 30);
  }
}

function drawPlant(x, y, big){
  g.fillStyle = 'rgba(0,0,0,.2)'; ell(g, x, y, 16, 5); g.fill();
  g.fillStyle = '#b5562d'; g.beginPath(); g.moveTo(x - 13, y - 26); g.lineTo(x + 13, y - 26); g.lineTo(x + 9, y); g.lineTo(x - 9, y); g.fill();
  g.fillStyle = '#2f8a4a';
  const leaves = big ? 7 : 5;
  for (let i = 0; i < leaves; i++){
    const a = -Math.PI / 2 + (i - (leaves - 1) / 2) * 0.45 + Math.sin(now() * 1.5 + i) * 0.04;
    g.save(); g.translate(x, y - 26); g.rotate(a); ell(g, 0, -18, 6, 18); g.fill(); g.restore();
  }
}

function floatText(x, y, text, color, delay = 0){
  particles.push({type:'text', x, y, vy:-45, life:1.2, max:1.2, text, color, delay});
}
function coins(x, y, n){
  for (let i = 0; i < n; i++) particles.push({type:'emoji', x, y, vx:rand(-70, 70), vy:rand(-220, -150), g:420, life:0.9, max:0.9, text:'🪙', size:16, delay:i * 0.04});
}
function confetti(){
  for (let i = 0; i < 40; i++) particles.push({type:'emoji', x:rand(80, rightWall() - 40), y:rand(-40, 0), vx:rand(-30, 30), vy:rand(40, 140), g:60, life:2.2, max:2.2,
    text:pick(['🎉', '✨', '🎊', '⭐']), size:rand(14, 22), delay:rand(0, 0.6)});
}
function puff(x, y){ particles.push({type:'puff', x:x + rand(-3, 3), y, vx:rand(-6, 6), vy:-28, life:1.3, max:1.3, r:4}); }

function updateParticles(dt){
  for (const p of particles){
    if (p.delay > 0){ p.delay -= dt; continue; }
    p.life -= dt; p.x += (p.vx || 0) * dt; p.y += p.vy * dt;
    if (p.g) p.vy += p.g * dt;
    if (p.type === 'puff') p.r += dt * 9;
  }
  particles = particles.filter(p => p.life > 0);
}
function drawParticles(){
  for (const p of particles){
    if (p.delay > 0) continue;
    const a = Math.min(1, p.life / p.max * 1.6);
    g.globalAlpha = a;
    if (p.type === 'text'){
      g.font = `900 22px system-ui, ${EMOJI}`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = 4; g.strokeStyle = 'rgba(0,0,0,.7)'; g.strokeText(p.text, p.x, p.y);
      g.fillStyle = p.color; g.fillText(p.text, p.x, p.y);
    } else if (p.type === 'emoji'){
      emoji(g, p.text, p.x, p.y, p.size);
    } else {
      g.globalAlpha = a * 0.5; g.fillStyle = '#fff'; ell(g, p.x, p.y, p.r, p.r); g.fill();
    }
    g.globalAlpha = 1;
  }
}

function bump(sel, cls){

// Sol altta kombo göstergesi: sayı, çarpan ve bir sonraki kademeye ilerleme
const COMBO_STEPS = [3, 6, 10, 15];
function drawCombo(){
  const n = R.combo, cm = comboMult(n), next = COMBO_STEPS.find(k => k > n);
  const prev = [...COMBO_STEPS].reverse().find(k => k <= n) || 0;
  const x = 0, y = 0, w = 236, h = 46, pulse = 1 + Math.sin(now() * 8) * 0.04 * Math.min(1, n / 6);
  g.save(); g.translate(12, Math.min(530, viewH() - 12) - h * 1.25); g.scale(1.25, 1.25); // telefonda okunaklı ama masaya taşmasın
  g.translate(w / 2, h / 2); g.scale(pulse, pulse); g.translate(-w / 2, -h / 2);
  g.fillStyle = 'rgba(20,12,6,.82)'; rr(g, x, y, w, h, 12); g.fill();
  g.strokeStyle = cm > 1 ? '#ff9d3a' : 'rgba(255,255,255,.25)'; g.lineWidth = 2; rr(g, x, y, w, h, 12); g.stroke();
  emoji(g, '🔥', x + 24, y + 22, cm >= 2 ? 26 : 20);
  g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillStyle = '#fff'; g.font = '900 19px system-ui'; g.fillText(`${n} KOMBO`, x + 44, y + 17);
  g.fillStyle = cm > 1 ? '#ffc94a' : '#c9b39a'; g.font = '700 13px system-ui';
  g.fillText(cm > 1 ? `bahşiş x${cm}` : `${next} kombo: bahşiş x${comboMult(next)}`, x + 44, y + 34);
  const tf = Math.max(0, (R.comboT || 0) / COMBO_TIME);   // kalan kombo süresi
  g.fillStyle = tf < 0.3 ? '#ff6b5e' : '#ffc94a'; rr(g, x + 10, y + 3, (w - 20) * tf, 3, 1.5); g.fill();
  if (next){ // ilerleme çubuğu
    const f = (n - prev) / (next - prev);
    g.fillStyle = 'rgba(255,255,255,.15)'; rr(g, x + 170, y + 12, 54, 6, 3); g.fill();
    g.fillStyle = '#ff9d3a'; rr(g, x + 170, y + 12, 54 * f, 6, 3); g.fill();
    g.fillStyle = '#c9b39a'; g.font = '700 11px system-ui'; g.textAlign = 'center'; g.fillText(`→ ${next}`, x + 197, y + 32);
  }
  g.restore();
}

function drawScene(){

  drawRoom(frac);
  if (EV()) drawDeco(EV().deco);
  R.stains.forEach(st => {   // yerdeki kirler (masaların altında kalsın diye önce)

    g.beginPath(); g.ellipse(st.x, st.y, 15 + st.r * 6, 6 + st.r * 2, 0, 0, 7); g.fill();

  });
  if (R.stains.length >= 3){ const st = R.stains[0], t = now(); emoji(g, '🪰', st.x + Math.sin(t * 5) * 14, st.y - 22 + Math.cos(t * 8) * 6, 14); }

  // Derinliğe göre sıralanan nesneler (aşağıdakiler önde)
  const items = [];
  items.push({y:333, draw:drawCounter});
