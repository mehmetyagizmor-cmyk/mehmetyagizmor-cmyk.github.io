// ---------- Toplu sipariş ----------
// Ara sıra gelen çok günlü teklif: kabul edilirse süre içinde bu ürünlerden belli sayıda satılır.
// Süre boyunca müşteriler o ürünleri daha sık ister; tutarsa büyük ödül, tutmazsa itibar düşer
const CLIENTS = [
  {emoji:'💍', name:'Düğün salonu'}, {emoji:'🏫', name:'Okul gezisi'}, {emoji:'🏭', name:'Fabrika çay molası'},
  {emoji:'⚽', name:'Mahalle futbol takımı'}, {emoji:'🏛️', name:'Belediye toplantısı'}, {emoji:'🎓', name:'Mezuniyet töreni'},
];
const CT_FAIL_REP = 5;
// Hedef, oyuncunun bugünkü satışına göre: sipariş süresince bu ürünlerden beklenen satışın %65'i (kayan talep dahil).
// Bot simülasyonunda %80 hedefin yarısı yetişmedi; %65 kusursuz oynayana rahat, müşteri kaçırana zor gelir
function makeContract(day, itemsToday = 0){
  const menu = sellable(), days = Math.random() < 0.5 ? 2 : 3;
  const ids = [...menu].sort(() => Math.random() - 0.5).slice(0, Math.min(2, menu.length));
  const perDay = Math.max(3, Math.round(0.65 * itemsToday * (0.25 / ids.length + 0.75 / menu.length)));
  const need = Object.fromEntries(ids.map(id => [id, perDay * days]));
  const worth = ids.reduce((s, id) => s + basePrice(id) * need[id], 0);
  return {...pick(CLIENTS), day, days, need, got:{}, st:'offer', reward:Math.round(worth * 1.5 / 10) * 10};
}
// Süren siparişte henüz tamamlanmamış ürünler (müşteri seçimi bunlara kayar)
function contractWant(){
  const c = S.contract;
  if (!c || c.st !== 'active' || status !== 'running') return null;
  const ids = Object.keys(c.need).filter(id => (c.got[id] || 0) < c.need[id] && sellable().includes(id));
  return ids.length ? ids : null;
}
function contractSold(order){
  const c = S.contract;
  if (!c || c.st !== 'active') return;
  order.forEach(o => { if (c.need[o.p]) c.got[o.p] = (c.got[o.p] || 0) + 1; });
  if (Object.keys(c.need).some(id => (c.got[id] || 0) < c.need[id])) return;
  S.money += c.reward; S.total += c.reward; S.contracts = (S.contracts || 0) + 1; period().ct++;
  S.contract = null;
  addFame(10);
  announce({emoji:c.emoji, name:L(`${c.name} siparişi tamam!`, `${c.name} order complete!`), desc:`+₺${fmt(c.reward)} · 🌟 +10`, ach:true}, L('📦 Toplu sipariş', '📦 Bulk order'));
  confetti(); SFX.pay(); save();
}
// Gün sonu: süresi biten sipariş başarısız olur, bekleyen teklif düşer, yarına yeni teklif gelebilir. Karne satırını döndürür
function contractDay(){
  const c = S.contract;
  if (c && c.st === 'active'){
    if (S.day < c.until) return `<p class="hint">📦 ${c.emoji} ${L(`${c.name} siparişi: ${c.until - S.day} gün daha var`, `${c.name} order: ${c.until - S.day} more days`)}</p>`;
    S.rep = Math.max(0, S.rep - CT_FAIL_REP); S.contract = null;
    return `<p class="banner bad">📦 ${c.emoji} ${L(`${c.name} siparişi yetişmedi`, `${c.name} order missed`)}: -${CT_FAIL_REP}⭐</p>`;
  }
  S.contract = null;
  if (S.day + 1 < 4 || Math.random() > 0.25) return '';
  S.contract = makeContract(S.day + 1, Object.values(R.sold).reduce((a, b) => a + b, 0));
  return `<p class="banner">📦 ${L(`Yarın ${S.contract.emoji} ${S.contract.name} toplu sipariş teklifi getirecek!`, `Tomorrow ${S.contract.emoji} ${S.contract.name} will bring a bulk order offer!`)}</p>`;
}
function answerContract(yes){
  const c = S.contract;
  if (!c || c.st !== 'offer' || c.day !== S.day || status === 'running') return;
  if (yes){ c.st = 'active'; c.until = S.day + c.days - 1; toast(L(`📦 ${c.name} siparişini aldın: ${c.days} günün var!`, `📦 You took the ${c.name} order: you have ${c.days} days!`)); SFX.buy(); }
  else S.contract = null;
  save();
}
function contractHTML(){
  const c = S.contract;
  if (!c) return '';
  const ids = Object.keys(c.need);
  const list = ids.map(id => `${P[id].emoji} ${c.st === 'active' ? Math.min(c.got[id] || 0, c.need[id]) + '/' : ''}${c.need[id]} ${P[id].name}`).join(' · ');
  if (c.st === 'offer'){
    if (c.day !== S.day || status === 'running') return '';
    return `<b>📦 ${L('Teklif', 'Offer')}: ${c.emoji} ${c.name}</b><small>${L(`${c.days} günde ${list} sat → +₺${fmt(c.reward)} · yetişmezse -${CT_FAIL_REP}⭐ · dükkânı açmadan karar ver`, `Sell ${list} in ${c.days} days → +₺${fmt(c.reward)} · miss it and lose ${CT_FAIL_REP}⭐ · decide before opening`)}</small>
      <div class="btns"><button class="btn2" data-ct="yes">${L('✅ Kabul et', '✅ Accept')}</button><button class="btn2" data-ct="no">${L('Reddet', 'Decline')}</button></div>`;
  }
  const tot = ids.reduce((s, id) => s + c.need[id], 0), got = ids.reduce((s, id) => s + Math.min(c.got[id] || 0, c.need[id]), 0);
  return `<b>📦 ${c.emoji} ${c.name}</b> · ${c.until > S.day ? L(`${c.until - S.day + 1} gün kaldı`, `${c.until - S.day + 1} days left`) : L('son gün!', 'last day!')}<small>${list} · ${L('ödül', 'reward')} ₺${fmt(c.reward)}</small><i style="width:${got / tot * 100}%"></i>`;
}

// ---------- Mahalle ligi ----------
// Her hafta (pazartesi–pazar) dört rakip çay ocağıyla satış yarışı. Ceza yok: kaybeden yalnızca ödülü kaçırır.
// Rakiplerin günlük satışı oyuncunun geçen haftaki ortalamasından türer: her seviyede çekişmeli kalır
const RIVALS = [
  {id:'rifat', emoji:'🧔', name:"Rıfat Usta'nın Yeri", k:1.1},
  {id:'kose',  emoji:'☕', name:'Köşe Kahvesi',        k:0.95},
  {id:'simit', emoji:'🥯', name:'Simitçi Dayı',        k:0.8},
  {id:'nesil', emoji:'🧋', name:'Yeni Nesil Kafe',     k:0.65},
];
const LEAGUE_FROM = 8;   // ikinci haftanın pazartesisi
// Lig yalnızca pazartesi başlar (hafta ortasında başlayan oyuncu haksız geride kalmasın)
function league(){
  if (!S.league && S.day >= LEAGUE_FROM && S.day % 7 === 1){
    const base = S.lgBase || Math.max(100, Math.round(S.bestDay * 0.7));
    S.lgK = S.lgK || Object.fromEntries(RIVALS.map(r => [r.id, r.k]));
    S.league = {week:Math.floor((S.day - 1) / 7) + 1, base, me:0, sc:Object.fromEntries(RIVALS.map(r => [r.id, 0]))};
  }
  return S.league || null;
}
// Bugün dahil sıralama; oyuncunun açık günü de anlık sayılır
function standings(){
  const LG = league();
  if (!LG) return null;
  const live = status === 'running' ? R.stats.earned + R.stats.tips : 0;
  return [{id:'me', emoji:'🍵', name:L('Sen', 'You'), score:LG.me + live}, ...RIVALS.map(r => ({...r, score:LG.sc[r.id]}))].sort((a, b) => b.score - a.score);
}
// Gün sonu: puanları ekler, pazar günü ödülleri dağıtıp ligi kapatır. Karne satırını döndürür
function leagueDay(earned){
  const LG = league();
  if (!LG) return '';
  LG.me += earned;
  // Rakipler yarı yarıya geçen haftanın ortalamasına ve senin bugününe bakar: erken oyunda gelir hızla büyürken geride kalmasınlar
  RIVALS.forEach(r => LG.sc[r.id] += Math.round((LG.base + earned) / 2 * S.lgK[r.id] * rand(0.85, 1.15)));
  const st = standings(), rank = st.findIndex(x => x.id === 'me') + 1, left = 7 - (S.day - 1) % 7 - 1;
  if (left > 0) return `<p class="hint">${L(`🏆 Mahalle ligi: <b>${rank}. sıradasın</b> · lider ${st[0].emoji} ${st[0].id === 'me' ? 'sensin' : st[0].name} · pazara ${left} gün`, `🏆 Neighbourhood league: <b>you are #${rank}</b> · leader ${st[0].emoji} ${st[0].id === 'me' ? 'is you' : st[0].name} · ${left} days to Sunday`)}</p>`;
  // Hafta bitti
  let prize = '';
  if (rank === 1){
    const m = Math.round(LG.base * 2 / 10) * 10;
    S.money += m; S.total += m; addFame(15); S.lgWins = (S.lgWins || 0) + 1; period().lg++;
    prize = L(`🥇 Haftanın birincisi sensin! +₺${fmt(m)} · 🌟 +15 · 🏆 ${S.lgWins}. kupa`, `🥇 You won the week! +₺${fmt(m)} · 🌟 +15 · 🏆 trophy #${S.lgWins}`);
  } else if (rank === 2){
    const m = Math.round(LG.base * 0.7 / 10) * 10;
    S.money += m; S.total += m; addFame(5);
    prize = L(`🥈 Haftayı ikinci bitirdin: +₺${fmt(m)} · 🌟 +5`, `🥈 You finished the week second: +₺${fmt(m)} · 🌟 +5`);
  } else prize = L(`${rank}. oldun. Haftanın lideri ${st[0].emoji} ${st[0].name} oldu, gelecek hafta yakala!`, `You came #${rank}. ${st[0].emoji} ${st[0].name} won the week, catch them next week!`);
  // Kazandıkça rakipler biraz güçlenir, kaybettikçe biraz zayıflar
  RIVALS.forEach(r => S.lgK[r.id] = Math.max(0.5, Math.min(1.6, S.lgK[r.id] * (rank === 1 ? 1.04 : rank > 2 ? 0.97 : 1))));
  S.lgBase = Math.max(100, Math.round(LG.me / 7));
  S.league = null;
  return `<div class="banner">${L(`🏆 Mahalle ligi ${LG.week}. hafta bitti`, `🏆 Neighbourhood league week ${LG.week} is over`)} · ${prize}
    <div class="news" style="text-align:left">${st.map((x, i) => `<div>${i + 1}. ${x.emoji} ${x.id === 'me' ? `<b>${x.name}</b>` : x.name} · ₺${fmt(x.score)}</div>`).join('')}</div></div>`;
}
function leagueHTML(){
  const st = standings();
  if (!st) return S.day >= LEAGUE_FROM - 3 && S.day < LEAGUE_FROM ? L(`🏆 <b>Mahalle ligi</b> ${LEAGUE_FROM}. günde başlıyor<small>Her hafta dört rakip çay ocağıyla satış yarışı: birinciye para, ünlülük ve kupa.</small>`, `🏆 <b>Neighbourhood league</b> starts on day ${LEAGUE_FROM}<small>A weekly sales race against four rival tea houses: the winner gets cash, fame and a trophy.</small>`) : '';
  const rank = st.findIndex(x => x.id === 'me') + 1, left = 7 - (S.day - 1) % 7;
  const row = st.map((x, i) => `${i + 1}. ${x.emoji} ${x.id === 'me' ? `<b>${x.name}</b>` : x.name} ₺${fmt(x.score)}`).join(' · ');
  return `<b>${L(`🏆 Mahalle ligi · ${rank}. sıradasın`, `🏆 Neighbourhood league · you are #${rank}`)}</b> · ${left > 1 ? L(`pazara ${left - 1} gün`, `${left - 1} days to Sunday`) : L('son gün!', 'last day!')}<small>${row}</small>`;
}

// Gün sonu: dönemin sayılarını toplar, tören günüyse ödülleri dağıtır. Karne satırını döndürür
function awardDay(st, perfect){
  if (S.day < 2) return '';
  const y = period();
  y.served += st.served; y.lost += st.lost; y.good += st.good; y.bad += R.voice.bad; y.slow += R.voice.slow;
  y.dirty += R.voice.dirty; y.perfect += perfect ? 1 : 0; y.earn += st.earned + st.tips;
  const left = nextCeremony() - S.day;
  if (S.day % AWARD_EVERY){
    return left <= 3 ? `<p class="hint">${L(`🎖️ Esnaf Ödülleri töreni ${left} gün sonra · Eşyalarım'dan şartlara bak`, `🎖️ Shopkeeper Awards in ${left} days · check the rules in My Stuff`)}</p>` : '';
  }
  if (S.day - y.from < 14) return '';   // eski kayıtta dönem yarıda başladıysa bu tören atlanır, sayılar sürer
  const days = S.day - y.from + 1, won = AWARDS.filter(a => a.ok(y));
  const m = Math.round(y.earn / days * 0.5 / 10) * 10;
  S.awards = S.awards || {};
  won.forEach(a => S.awards[a.id] = (S.awards[a.id] || 0) + 1);
  if (won.length){ S.money += m * won.length; S.total += m * won.length; addFame(10 * won.length + (won.length >= 5 ? 25 : 0)); }
  S.yr = null;
  return `<div class="banner">${L('🎖️ Esnaf Ödülleri töreni', '🎖️ Shopkeeper Awards')} · ${won.length ? `${L(`${won.length} ödül kazandın!`, `you won ${won.length} award${won.length > 1 ? 's' : ''}!`)} +₺${fmt(m * won.length)} · 🌟 +${10 * won.length + (won.length >= 5 ? 25 : 0)}` : L('bu dönem ödül çıkmadı', 'no awards this time')}
    <div class="news" style="text-align:left">${AWARDS.map(a => `<div>${a.ok(y) ? '✅' : '▫️'} ${a.emoji} ${a.name} <small style="color:var(--muted)">· ${a.ok(y) ? a.val(y) : a.need + ' (' + a.val(y) + ')'}</small></div>`).join('')}</div></div>`;
}
function awardsHTML(){
  if (S.day < 2) return '';
  const y = period(), left = nextCeremony() - S.day + 1;
  return `<h3>${L('🎖️ Esnaf Ödülleri', '🎖️ Shopkeeper Awards')}</h3><p class="hint">${L(`Her 4 haftada bir tören: şartı tutan her ödül para, ünlülük ve kupa getirir. Sonraki tören ${left > 1 ? `${left} gün sonra` : 'bugün, gün sonunda'}.`, `A ceremony every 4 weeks: each award you qualify for brings cash, fame and a trophy. Next ceremony ${left > 1 ? `in ${left} days` : 'today, at day end'}.`)}</p>`
    + AWARDS.map(a => {
      const ok = a.ok(y), n = (S.awards || {})[a.id] || 0;
      return `<div class="ach${ok ? ' done' : ''}"><div class="em">${a.emoji}</div><div class="info"><b>${a.name}${n ? ` · 🏆×${n}` : ''}</b><small>${a.need} · ${L('şu an', 'now')} ${a.val(y)}</small></div><span class="rw">${ok ? '✓' : ''}</span></div>`;
    }).join('');
}

function voiceAdvice(k){
  const v = VOICE[k];
  if (v.qual) return S.quality === 'iyi' ? '' : L('Sevkiyatta daha kaliteli malzeme seç', 'Pick better ingredients in Supplies');
  const u = v.ups.map(id => UPGRADES.find(u => u.id === id))
    .filter(u => u && lv(u.id) < maxLv(u) && !(u.need && !lv(u.need))).sort((a, b) => upCost(a) - upCost(b))[0];
  if (u) return L(`${u.emoji} ${u.name} al (₺${fmt(upCost(u))})`, `Buy ${u.emoji} ${u.name} (₺${fmt(upCost(u))})`);
  const next = SHOP_LEVELS[lv('dukkan') + 1];
  return v.grow && next ? L(`🏪 Dükkânı ${next.name} yap`, `🏪 Upgrade to ${next.name}`) : '';
}
function voiceHTML(){
  if (S.day < 2) return '';
  const top = Object.keys(VOICE).filter(k => R.voice[k] > 0).sort((a, b) => R.voice[b] * VOICE[b].w - R.voice[a] * VOICE[a].w)[0];

}

function ensureQuests(){
  if (S.day < 2 || (S.quests && S.quests.day === S.day)) return;
  const types = Object.keys(QUESTS).sort(() => Math.random() - 0.5).slice(0, 3);
  const reward = Math.round((40 + S.day * 12) * (1 + 0.3 * mainLv()) / 10) * 10;
  S.quests = {day:S.day, bonus:false, list:types.map(t => Object.assign({t, reward, done:false}, QUESTS[t].make(S.day)))};
  save();
}
const questProg = q => q.done ? q.n : status === 'running' ? QUESTS[q.t].prog(q) : 0;
function checkQuests(){
  if (status !== 'running' || !S.quests || S.quests.day !== S.day) return;
  for (const q of S.quests.list){
    if (q.done || questProg(q) < q.n) continue;
    q.done = true; S.money += q.reward; S.questsDone = (S.questsDone || 0) + 1;
    toast(`📋 ${L('Görev tamam', 'Quest done')}: ${QUESTS[q.t].label(q)} · +₺${fmt(q.reward)}`); SFX.pay(); bump('#money', 'bump');
    save();
  }
  if (!S.quests.bonus && S.quests.list.every(q => q.done)){
    S.quests.bonus = true;
    const bonus = Math.round(S.quests.list[0].reward * 1.5);
    S.money += bonus; S.rep = Math.min(100, S.rep + 5);
    announce({emoji:'📋', name:L('Bugünün tüm görevleri tamam!', "All of today's quests are done!"), desc:`Bonus +₺${fmt(bonus)} · +5⭐`, ach:true});
    confetti(); save();
  }
}
function questsHTML(){
  if (!S.quests || S.quests.day !== S.day) return '';
  const head = status === 'running' ? '' : `<div class="qhead">${L(`📋 Bugünün görevleri · her biri +₺${fmt(S.quests.list[0].reward)}`, `📋 Today's quests · +₺${fmt(S.quests.list[0].reward)} each`)}</div>`;
  return head + S.quests.list.map(q => {
    const p = questProg(q), failed = p < 0;
    const cls = q.done ? ' done' : failed ? ' fail' : '';
    const val = q.t === 'tips' ? `₺${fmt(Math.max(0, p))}/₺${fmt(q.n)}` : `${Math.max(0, Math.min(p, q.n))}/${q.n}`;
    return `<div class="quest${cls}" title="${QUESTS[q.t].label(q)}"><span>${status === 'running' ? QUESTS[q.t].short(q) : QUESTS[q.t].label(q)}</span><b>${q.done ? '✓' : failed ? '✗' : val}</b>
      <i style="width:${q.done ? 100 : Math.max(0, Math.min(1, p / q.n)) * 100}%"></i></div>`;
  }).join('');
}

// ---------- Oyun döngüsü (mantık) ----------
function tick(dt){
  R.t += dt;
  if (R.t >= DAY_LEN){ endDay(); return; }
  // Etkinliğin ilk günü: tanıtım kartı
  if (!R.evShown){
    R.evShown = true;
    const ep = evProg();
    if (ep && !ep.seen){ ep.seen = true; announce(EV(), L('🎉 Etkinlik başladı', '🎉 Event started')); }
  }

  R.spawnIn -= dt;
  if (R.spawnIn <= 0){
    if (!spawnCustomer()) R.voice.full++;   // masa yok: müşteri kapıdan döndü
    R.spawnIn = spawnInterval() * rand(0.6, 1.4);
  }
  if (R.criticAt != null && R.t >= R.criticAt && freeSeats().length){
    R.criticAt = null; R.review = 0; S.critic = null;
    spawnCustomer('elestirmen'); announce(CRITIC);
  }

  if (S.day >= 2 && DAY_LEN - R.t > 15){
    R.eventIn -= dt;
    if (R.eventIn <= 0){ triggerLiveEvent(); R.eventIn = rand(25, 45); }
  }
  if (lv('temizlikci') && R.stains.length && (R.cleanIn -= dt) <= 0){
    const st = R.stains.shift(); floatText(st.x, st.y - 20, '🧹✨', '#fff');
    R.cleanIn = 9 / lv('temizlikci');
  }
  if (R.arson){
    R.arson.t -= dt;
    const gl = lv('guvenlik');
    if (gl && ARSON_T - R.arson.t >= 3.5 - 0.8 * gl) catchArson(L('💂 Güvenlik yakaladı!', '💂 Security caught them!'));
    else if (R.arson.t <= 0){
      const loss = Math.min(S.money, 40 * S.day), a = R.arson;
      S.money -= loss; R.stats.loss += loss; S.rep = Math.max(0, S.rep - 5); R.arson = null;
      R.effects.push({id:'yangin', left:12, ev:FIRE}); announce(FIRE); SFX.error();
      floatText(a.x - 40, a.y - 100, `🔥 -₺${fmt(loss)} -5⭐`, '#ff6b5e');
    }
  }
  if (R.combo && (R.comboT -= dt) <= 0){
    if (R.combo >= 3) floatText(W - 160, 100, `⏱️ Kombo bitti (${R.combo})`, '#c9b39a');
    R.combo = 0;
  }
  R.effects.forEach(e => e.left -= dt);
  R.effects = R.effects.filter(e => e.left > 0);

  // Oyuncunun ocağı
  const busy = new Set(effect('yangin') ? ['ocak', ...UPGRADES.filter(u => u.grp === 'alet').map(u => u.id)] : []);   // yangında pişmez
  for (const x of [...R.queue]){
    const st = P[x.p].tool || 'ocak';
    if (busy.has(st)) continue;
    busy.add(st); x.prog += dt;
    if (x.prog >= prepTime(x.p)){ trayAdd(x.p); R.queue.splice(R.queue.indexOf(x), 1); }
  }

  // Çıraklar (yangında onlar da çalışamaz)
  for (let i = 0; i < lv('cirak') && !effect('yangin'); i++){
    const h = R.helpers[i];
    if (!h){
      if (!hasRoom()) continue;
      const n = needed(); const p = Object.keys(n).find(k => n[k] > 0);
      if (p) R.helpers[i] = {p, prog:0};
    } else {
      h.prog += dt * 0.7 * (1 + 0.2 * (crewLv('cirak', i) - 1)) * crewSpd('cirak', i);   // çırak kendi seviyesi ve kişiliğiyle
      if (h.prog >= prepTime(h.p)){
        const t = trOf(crewP('cirak', i));
        if (t.burn && Math.random() < t.burn) floatText(CIRAK_X[i] || 100, 250, L('🔥 Çırak yaktı!', '🔥 Burnt it!'), '#ff8a5e');   // sakar çırak
        else trayAdd(h.p);
        R.helpers[i] = null;
      }
    }
  }

  // Garsonlar: tepsiden alır, masaya yürür, teslim eder, geri döner
  for (const gs of R.garsons){
    if (gs.state === 'idle'){
      const targets = R.customers.filter(seated).sort((a, b) => a.patience - b.patience);
      for (const c of targets){
        const want = {};
        c.order.forEach(o => { if (!o.done) want[o.p] = (want[o.p] || 0) + 1; });
        R.garsons.forEach(o => o.cid === c.id && o.carry && want[o.carry]--);
        const p = Object.keys(want).find(k => want[k] > 0 && R.tray.includes(k));
        if (!p) continue;
        trayRemove(R.tray.indexOf(p));
        const s = SLOTS[c.seat], home = garsonHome(gs.i);
        gs.carry = p; gs.cid = c.id; gs.state = 'go';
        const a = aisleY();
        gs.path = [{x:home.x, y:a}, {x:s.x + 75, y:a}, {x:s.x + 75, y:s.y + 10}, {x:s.x + 42, y:s.y + 10}];
        break;
      }
    } else if (gs.state === 'go'){
      if (moveAlong(gs, dt, garsonSpeed(gs.i))){
        const c = R.customers.find(c => c.id === gs.cid);
        const o = c && seated(c) && c.order.find(o => !o.done && o.p === gs.carry);
        if (o){
          o.done = true; o.doneAt = now();
          if (c.order.every(o => o.done)) pay(c); else SFX.serve();
        } else if (R.tray.length < trayCap()) { R.tray.push(gs.carry); R.trayT.push(R.t); }
        gs.carry = null; gs.cid = null; gs.state = 'back';
        const home = garsonHome(gs.i), s = {x:gs.x, y:gs.y};
        const a = aisleY();
        gs.path = [{x:s.x + 33, y:s.y}, {x:s.x + 33, y:a}, {x:home.x, y:a}, home];
      }
    } else if (gs.state === 'back'){
      if (moveAlong(gs, dt, garsonSpeed(gs.i))){ gs.state = 'idle'; gs.flip = false; }
    }
  }

  // Müşteriler
  for (const c of [...R.customers]){
    if (c.state === 'in'){
      if (moveAlong(c, dt, 150)){ c.state = 'seated'; c.flip = false; if (c.reg) regGreet(c); else custGreet(c); }
    } else if (c.state === 'out'){
      if (moveAlong(c, dt, 150)) R.customers = R.customers.filter(x => x !== c);
    } else {
      c.patience -= dt * (1 + 0.06 * dirt());
      if (c.patience < 2 && !c.calmed && R.calmed < lv('mudur')){
        c.calmed = true; R.calmed++; c.patience += c.max * 0.4;
        floatText(SLOTS[c.seat].x, SLOTS[c.seat].y - 110, '👔 Müdür yatıştırdı', '#9fd8ff');
      }
      if (c.patience <= 0){
        c.patience = 0;
        const penalty = c.special === 'vip' || c.special === 'influencer' || c.special === 'elestirmen' ? 10 : 4;
        const s = SLOTS[c.seat];
        floatText(s.x, s.y - 100, `💢 -${penalty}⭐`, '#ff6b5e');
        if (R.combo >= 3) floatText(s.x, s.y - 130, L(`Kombo bitti (${R.combo})`, `Combo over (${R.combo})`), '#c9b39a', 0.2);
        if (c.ct && Math.random() < 0.5) say(s.x, s.y - 160, sayPick('angry'));
        R.combo = 0;
        S.rep = Math.max(0, S.rep - penalty);
        R.stats.lost++; R.voice.lost++;
        bump('#rep', 'shake');
        SFX.angry();
        if (c.reg) regAngry(c);
        if (c.special === 'elestirmen') review(1);
        leave(c, 'angry');
      }
    }
  }
}

function endDay(){
  status = 'closed';
  SFX.dayEnd();
  const rent = Math.min(S.money, Math.round(15 * S.day * (lv('mudur') ? 0.75 : 1)));   // kasada ne varsa o kesilir
  S.money -= rent;
  const st = R.stats, net = st.earned + st.tips - st.mat - rent - (st.loss || 0);
  branch().lastEarn = st.earned + st.tips;   // ekip ağacında dükkânın günlük geliri
  const passive = S.branches.reduce((s, b, i) => i === S.cur ? s : s + managedIncome(b), 0);
  S.money += passive; S.total += passive;
  const fameInc = (fameLv() >= 2 ? 25 * S.day : 0) + (fameLv() >= 3 ? 5 * R.stats.served : 0) + (fameLv() >= 6 ? 500 * S.branches.length : 0);   // reklam + çay markası + müze
  S.money += fameInc; S.total += fameInc;
  const intr = bankInterest(); S.money += intr; S.total += intr;   // Mahalle bankası
  const risk = riskDay(R.interview);
  let night = null;
  if (S.day >= 5 && Math.random() < 0.06){
    const n = pick(NIGHT), blocked = n.guard && Math.random() < 0.35 * lv('guvenlik');
    const loss = blocked ? 0 : Math.min(S.money, n.loss());
    S.money -= loss; night = {n, blocked, loss};
  }
  // Günün karnesi: 3 yıldız = kimse kızmadı
  const ratio = st.served / Math.max(1, st.served + st.lost);
  const stars = st.lost === 0 && st.served >= 5 ? 3 : ratio >= 0.8 ? 2 : 1;
  const record = net > S.bestDay && S.day > 1;
  S.bestDay = Math.max(S.bestDay, net);
  const perfect = st.served >= 15 && st.lost === 0;
  if (perfect) S.perfect++;
  // Sıradaki hedef: henüz alınamayan en ucuz şey
  const goals = [];
  const nx = SHOP_LEVELS[lv('dukkan') + 1];
  if (nx && S.day + 1 >= nx.day) goals.push({t:`🏪 ${nx.name}`, c:nx.cost});
  PRODUCTS.filter(p => !S.unlocked.includes(p.id) && !shopLocked(p)).forEach(p => goals.push({t:`${p.emoji} ${p.name}`, c:p.cost}));
  if (canBranch()) goals.push({t:L('🏙️ Yeni şube', '🏙️ New branch'), c:branchCost()});
  if (canBranch('world')) goals.push({t:L('🌍 Yurt dışı şubesi', '🌍 Branch abroad'), c:branchCost('world')});

const scene = $('#scene');
const g = scene.getContext('2d');
const EMOJI = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const now = () => performance.now() / 1000;
const tableBorn = {};      // yeni eklenen masanın "belirme" animasyonu
let levelUpAt = -10;       // dükkân büyüyünce parlama
let particles = [];

function fitCanvas(c, ctx, w, h){
  const dpr = Math.min(2, window.devicePixelRatio || 1); // telefonlarda 3x gereksiz yük
  const k = c.clientWidth / w * dpr;
  if (!k) return;
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  ctx.setTransform(k, 0, 0, k, 0, 0);
}
new ResizeObserver(() => { fitCanvas(scene, g, W, viewH()); if (use3d()) sahne3d.resize(); }).observe(scene);

function rr(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function ell(ctx, x, y, rx, ry){ ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
function line(ctx, x1, y1, x2, y2){ ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
// Emoji bir kez küçük bir canvas'a çizilip saklanır: her karede yazı tipiyle çizmek (ör. 40 parçalık konfeti) takılma yapar
const EMOJI_CACHE = new Map();
function emoji(ctx, ch, x, y, size){
  const s = Math.max(4, Math.round(size)), key = ch + '|' + s;
  let c = EMOJI_CACHE.get(key);
  if (!c){
    if (EMOJI_CACHE.size > 300) EMOJI_CACHE.clear();
    const k = 3, font = `${s}px ${EMOJI}`;   // 3 kat çözünürlük: büyütülse de net kalsın
    c = document.createElement('canvas');
    let cx = c.getContext('2d'); cx.font = font;
    c.w = Math.ceil(cx.measureText(ch).width) + 4; c.h = Math.ceil(s * 1.4);
    c.width = c.w * k; c.height = c.h * k;
    cx = c.getContext('2d'); cx.scale(k, k); cx.font = font; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText(ch, c.w / 2, c.h / 2);
    EMOJI_CACHE.set(key, c);
  }
  ctx.drawImage(c, x - c.w / 2, y - c.h / 2, c.w, c.h);
}
function mix(a, b, t){
  const pa = a.match(/\w\w/g).map(h => parseInt(h, 16)), pb = b.match(/\w\w/g).map(h => parseInt(h, 16));
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const easeBack = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

// ---------- Mini insan ----------
// o: {x, y(ayak), look, sit, walk(faz|null), mood, apron, bob, flip, scale, carry(emoji)}
function drawPerson(ctx, o){
  const L = o.look;
  ctx.save();
  ctx.translate(o.x, o.y);
  if (o.scale) ctx.scale(o.scale, o.scale);
  const moving = o.walk != null;
  const sw = moving ? Math.sin(o.walk) * 4 : 0;
  const lift = moving ? -Math.abs(Math.sin(o.walk)) * 2 : (o.bob || 0);
  const base = o.sit ? -6 : -18;        // gövdenin alt kenarı
  const hy = base - 40;                 // kafa merkezi

  if (!o.sit){
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ell(ctx, 0, 0, 14, 4); ctx.fill();
  }
  ctx.translate(0, lift);
  if (o.flip) ctx.scale(-1, 1);

  if (!o.sit){
    ctx.fillStyle = L.suit ? '#1d1d2b' : '#3a3346';
    rr(ctx, -9, -18 - Math.max(0, sw), 7, 18, 3); ctx.fill();
    rr(ctx, 2, -18 - Math.max(0, -sw), 7, 18, 3); ctx.fill();
    ctx.fillStyle = '#1f1a17';
    rr(ctx, -10, -4 - Math.max(0, sw), 9, 5, 2); ctx.fill();
    rr(ctx, 1, -4 - Math.max(0, -sw), 9, 5, 2); ctx.fill();
  }

  // uzun saç (arka)
  if (L.style === 1){ ctx.fillStyle = L.hair; rr(ctx, -15, hy - 4, 30, 28, 9); ctx.fill(); }

  // kollar
  const arm = (side, ang) => {
    ctx.save(); ctx.translate(side * 13, base - 25); ctx.rotate(ang);
    ctx.fillStyle = L.shirt; rr(ctx, -3, 0, 6, 17, 3); ctx.fill();
    ctx.fillStyle = L.skin; ell(ctx, 0, 18, 3.5, 3.5); ctx.fill();
    ctx.restore();
  };
  arm(-1, moving ? sw * 0.08 : 0.1);
  if (o.carry || L.prop === 'phone') arm(1, -2.5); else arm(1, moving ? -sw * 0.08 : -0.1);

  // gövde
  ctx.fillStyle = L.shirt; rr(ctx, -12, base - 28, 24, 28, 7); ctx.fill();
  if (L.vest){ ctx.fillStyle = '#26262e'; rr(ctx, -12, base - 26, 7, 26, 4); ctx.fill(); rr(ctx, 5, base - 26, 7, 26, 4); ctx.fill();
    ctx.fillStyle = '#b3202b'; ell(ctx, -3, base - 26, 3, 2); ctx.fill(); ell(ctx, 3, base - 26, 3, 2); ctx.fill(); }
  if (L.suit){ ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(-6, base - 28); ctx.lineTo(0, base - 18); ctx.lineTo(6, base - 28); ctx.fill();
    ctx.fillStyle = '#e8b923'; ctx.fillRect(-1.5, base - 24, 3, 12); }
  if (o.apron){ ctx.fillStyle = '#fbf6ee'; rr(ctx, -9, base - 20, 18, 22, 3); ctx.fill();
    ctx.strokeStyle = '#fbf6ee'; ctx.lineWidth = 2; line(ctx, -7, base - 20, -9, base - 28); line(ctx, 7, base - 20, 9, base - 28); }
  if (L.prop === 'camera'){ ctx.fillStyle = '#222'; rr(ctx, -6, base - 16, 12, 8, 2); ctx.fill(); ctx.fillStyle = '#6cf'; ell(ctx, 0, base - 12, 2.5, 2.5); ctx.fill(); }

  // kafa
  ctx.fillStyle = L.skin;
  ell(ctx, -14, hy + 2, 3, 4); ctx.fill(); ell(ctx, 14, hy + 2, 3, 4); ctx.fill();
  ell(ctx, 0, hy, 14, 14); ctx.fill();
  if (o.mood === 'angry'){ ctx.fillStyle = 'rgba(255,40,40,.18)'; ell(ctx, 0, hy, 14, 14); ctx.fill(); }

  // saç (ön)
  ctx.fillStyle = L.hair;
  const cap = () => { ctx.beginPath(); ctx.arc(0, hy - 1, 15, Math.PI, Math.PI * 2); ctx.fill(); };
  if (L.style === 0) cap();
  if (L.style === 1){ cap(); rr(ctx, -15, hy - 2, 5, 20, 3); ctx.fill(); rr(ctx, 10, hy - 2, 5, 20, 3); ctx.fill(); }
  if (L.style === 2){ ell(ctx, -13, hy - 3, 3, 5); ctx.fill(); ell(ctx, 13, hy - 3, 3, 5); ctx.fill(); }
  if (L.style === 3){ cap(); ell(ctx, 0, hy - 17, 7, 7); ctx.fill(); }
  if (L.style === 4){ for (let a = 0; a <= 6; a++){ const t = Math.PI + a / 6 * Math.PI; ell(ctx, Math.cos(t) * 12, hy - 2 + Math.sin(t) * 12, 6, 6); ctx.fill(); } }

  // yüz
  ctx.fillStyle = '#2a1a12';
  ell(ctx, -5, hy + 2, 2, 2.4); ctx.fill(); ell(ctx, 5, hy + 2, 2, 2.4); ctx.fill();
  ctx.fillStyle = 'rgba(255,120,120,.35)'; ell(ctx, -8.5, hy + 7, 3, 2); ctx.fill(); ell(ctx, 8.5, hy + 7, 3, 2); ctx.fill();
  if (L.beard && L.g !== 'k'){ ctx.fillStyle = L.hair === '#9b9b9b' ? '#777' : L.hair; ell(ctx, 0, hy + 6, 6, 2.2); ctx.fill(); }
  if (L.g === 'k'){   // kirpik ve ruj
    ctx.strokeStyle = '#2a1a12'; ctx.lineWidth = 1.2;
    line(ctx, -7, hy - 0.5, -9, hy - 2.5); line(ctx, 7, hy - 0.5, 9, hy - 2.5);
    ctx.fillStyle = '#c0392b'; ell(ctx, 0, hy + 9, 3, 1.6); ctx.fill();
  }
  ctx.strokeStyle = '#2a1a12'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  if (o.mood === 'angry'){
    ctx.beginPath(); ctx.arc(0, hy + 13, 4, Math.PI * 1.2, Math.PI * 1.8); ctx.stroke();
    line(ctx, -8, hy - 3, -3, hy - 1); line(ctx, 8, hy - 3, 3, hy - 1);
  } else if (o.mood === 'neutral'){
    line(ctx, -3, hy + 9.5, 3, hy + 9.5);
  } else {
    ctx.beginPath(); ctx.arc(0, hy + 6.5, 4, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
  }

  if (L.glasses){
    ctx.strokeStyle = '#2a1a12'; ctx.lineWidth = 1.3;
    ell(ctx, -5, hy + 2, 4.2, 3.6); ctx.stroke(); ell(ctx, 5, hy + 2, 4.2, 3.6); ctx.stroke(); line(ctx, -1, hy + 1.5, 1, hy + 1.5);
  }

  // şapkalar
  if (L.hat === 'kasket'){
    ctx.fillStyle = '#5b4a3a'; ell(ctx, 0, hy - 10, 14, 7); ctx.fill(); ell(ctx, 7, hy - 6, 10, 3); ctx.fill();
  }
  if (L.hat === 'bere'){
    ctx.fillStyle = L.prop === 'note' ? '#8b1e2d' : '#2c3e50'; ell(ctx, -2, hy - 11, 15, 6); ctx.fill(); ell(ctx, -1, hy - 17, 2, 2); ctx.fill();
  }
  if (L.hat === 'crown'){
    ctx.fillStyle = '#f5c518';
    ctx.beginPath(); ctx.moveTo(-10, hy - 12); ctx.lineTo(-10, hy - 24); ctx.lineTo(-5, hy - 18); ctx.lineTo(0, hy - 27);
    ctx.lineTo(5, hy - 18); ctx.lineTo(10, hy - 24); ctx.lineTo(10, hy - 12); ctx.closePath(); ctx.fill();
  }
  if (L.hat === 'sun'){
    ctx.fillStyle = '#e3c27a'; ell(ctx, 0, hy - 9, 22, 5); ctx.fill(); ell(ctx, 0, hy - 13, 12, 8); ctx.fill();
    ctx.fillStyle = '#c0392b'; ctx.fillRect(-12, hy - 12, 24, 3);
  }

  // eldeki eşyalar
  if (o.carry){
    ctx.fillStyle = '#cfd3d8'; ell(ctx, 24, base - 41, 13, 3.5); ctx.fill();
    if (o.flip){ ctx.save(); ctx.scale(-1, 1); emoji(ctx, o.carry, -24, base - 52, 16); ctx.restore(); }
    else emoji(ctx, o.carry, 24, base - 52, 16);
  } else if (L.prop === 'phone'){
    ctx.fillStyle = '#222'; rr(ctx, 25, base - 46, 7, 12, 2); ctx.fill();
  } else if (L.prop === 'note'){
    ctx.fillStyle = '#fff8e1'; rr(ctx, 22, base - 46, 11, 14, 1.5); ctx.fill();
    ctx.strokeStyle = '#9a8a70'; ctx.lineWidth = 1; line(ctx, 24, base - 41, 31, base - 41); line(ctx, 24, base - 37, 31, base - 37);
  }
  ctx.restore();
}

// Odanın sabit kısmı (zemin, duvar, raf, tabela) ara tuvalde tutulur, her karede yalnızca kopyalanır:
// yalnızca dükkân, dekor, yerleşim ya da pencere rengi değişince yeniden çizilir
const roomC = document.createElement('canvas'), roomG = roomC.getContext('2d');
let roomCacheKey = '';
function skyAt(frac){
  return frac < 0.6 ? '#8fd0f5' : frac < 0.85 ? mix('#8fd0f5', '#f5a15a', (frac - 0.6) / 0.25) : mix('#f5a15a', '#33406a', Math.min(1, (frac - 0.85) / 0.15));
}
function drawRoomCached(frac){
  const sky = skyAt(Math.round(frac * 50) / 50), t = lv('tabela');   // gökyüzü 50 adımda değişir, fark edilmez
  const key = [sky, lv('dukkan'), lv('dekor'), t, rightWall(), aisleY(), portrait, scene.width, scene.height, owner().shopName, S.cur, COL_ITEMS.filter(it => owned(it.id)).length].join('|');
  if (key !== roomCacheKey){
    roomCacheKey = key;
    roomC.width = scene.width; roomC.height = scene.height;
    const k = scene.width / W;
    roomG.setTransform(k, 0, 0, k, 0, 0);
    drawRoom(roomG, sky);
  }
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(roomC, 0, 0); g.restore();
  // Her karede değişenler: saatin kolları ve tabelanın titremesi, ampulleri
  const cx = rightWall() - 70, cy = 72, mins = 8 * 60 + frac * 12 * 60;
  g.strokeStyle = '#2a1a12'; g.lineCap = 'round';
  const ha = (mins / 60 % 12) / 12 * Math.PI * 2 - Math.PI / 2, ma = (mins % 60) / 60 * Math.PI * 2 - Math.PI / 2;
  g.lineWidth = 3; line(g, cx, cy, cx + Math.cos(ha) * 12, cy + Math.sin(ha) * 12);
  g.lineWidth = 2; line(g, cx, cy, cx + Math.cos(ma) * 19, cy + Math.sin(ma) * 19);
  if (t >= 2 && Math.sin(now() * 7) > 0.97) drawSign(g, 0.4);
  if (t >= 3) drawSignBulbs();
}
function drawRoom(g, sky){
  const L = lv('dukkan'), RW = rightWall(), D = lv('dekor');

  // Dış alan (henüz kiralanmamış kısım)
  g.fillStyle = '#3b2a21'; g.fillRect(0, 0, W, H);
  if (RW < W){
    g.strokeStyle = '#2a1d16'; g.lineWidth = 2;
    for (let y = 0, r = 0; y < H; y += 22, r++){
      line(g, RW, y, W, y);
      for (let x = RW + (r % 2 ? 0 : 22); x < W; x += 44) line(g, x, y, x, y + 22);

// Duvarın tepesinde sarkan ip boyunca bayrak/üçgen/emoji dizisi
const ropeY = (x, RW, y0, sag) => { const t = x / RW; return y0 + 4 * sag * t * (1 - t); };
function rope(y0, sag){
  const RW = rightWall();
  g.strokeStyle = '#3a2a20'; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(0, y0); g.quadraticCurveTo(RW / 2, y0 + sag * 2, RW, y0); g.stroke();
}
function bunting(colors, y0 = 6, sag = 9){
  const RW = rightWall(), n = Math.floor(RW / 34);
  rope(y0, sag);
  for (let i = 0; i < n; i++){
    const x = (i + 0.5) * RW / n, y = ropeY(x, RW, y0, sag);
    g.fillStyle = colors[i % colors.length];
    g.beginPath(); g.moveTo(x - 10, y); g.lineTo(x + 10, y); g.lineTo(x, y + 16); g.closePath(); g.fill();
  }
}
function garland(chars, step, size, y0 = 6, sag = 9, sway = 0){
  const RW = rightWall(), t = now();
  rope(y0, sag);
  for (let x = step / 2, i = 0; x < RW; x += step, i++){
    const y = ropeY(x, RW, y0, sag), dx = sway ? Math.sin(t * 1.5 + i) * sway : 0;
    g.strokeStyle = '#3a2a20'; g.lineWidth = 1; line(g, x, y, x + dx, y + 8);
    emoji(g, chars[i % chars.length], x + dx, y + 8 + size / 2, size);
  }
}
function star5(cx, cy, r){
  g.beginPath();
  for (let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, k = i % 2 ? r * 0.42 : r; g.lineTo(cx + Math.cos(a) * k, cy + Math.sin(a) * k); }
  g.closePath(); g.fill();
}
function trFlag(x, y, w){
  const h = w * 2 / 3;
  g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(x + 2, y + 2, w, h);
  g.fillStyle = '#e30a17'; g.fillRect(x, y, w, h);
  g.fillStyle = '#fff'; ell(g, x + w * 0.36, y + h / 2, h * 0.25, h * 0.25); g.fill();
  g.fillStyle = '#e30a17'; ell(g, x + w * 0.41, y + h / 2, h * 0.2, h * 0.2); g.fill();
  g.fillStyle = '#fff'; star5(x + w * 0.58, y + h / 2, h * 0.13);
}

function drawPlant(x, y, big){
  g.fillStyle = 'rgba(0,0,0,.2)'; ell(g, x, y, 16, 5); g.fill();
  g.fillStyle = '#b5562d'; g.beginPath(); g.moveTo(x - 13, y - 26); g.lineTo(x + 13, y - 26); g.lineTo(x + 9, y); g.lineTo(x - 9, y); g.fill();
  g.fillStyle = '#2f8a4a';
  const leaves = big ? 7 : 5;
  for (let i = 0; i < leaves; i++){
    const a = -Math.PI / 2 + (i - (leaves - 1) / 2) * 0.45 + Math.sin(now() * 1.5 + i) * 0.04;
    g.save(); g.translate(x, y - 26); g.rotate(a); ell(g, 0, -18, 6, 18); g.fill(); g.restore();
  }
}

function floatText(x, y, text, color, delay = 0){
  particles.push({type:'text', x, y, vy:-45, life:1.2, max:1.2, text, color, delay});
}
function coins(x, y, n){
  for (let i = 0; i < n; i++) particles.push({type:'emoji', x, y, vx:rand(-70, 70), vy:rand(-220, -150), g:420, life:0.9, max:0.9, text:'🪙', size:16, delay:i * 0.04});
}
function confetti(){
  for (let i = 0; i < 40; i++) particles.push({type:'emoji', x:rand(80, rightWall() - 40), y:rand(-40, 0), vx:rand(-30, 30), vy:rand(40, 140), g:60, life:2.2, max:2.2, screen:true,
    text:pick(['🎉', '✨', '🎊', '⭐']), size:rand(14, 22), delay:rand(0, 0.6)});
}
function puff(x, y){ particles.push({type:'puff', x:x + rand(-3, 3), y, vx:rand(-6, 6), vy:-28, life:1.3, max:1.3, r:4}); }

function updateParticles(dt){
  for (const p of particles){
    if (p.delay > 0){ p.delay -= dt; continue; }
    p.life -= dt; p.x += (p.vx || 0) * dt; p.y += p.vy * dt;
    if (p.g) p.vy += p.g * dt;
    if (p.type === 'puff') p.r += dt * 9;
  }
  particles = particles.filter(p => p.life > 0);
}
function drawParticles(map){
  for (const p of particles){
    if (p.delay > 0) continue;
    const a = Math.min(1, p.life / p.max * 1.6), [x, y] = map ? map(p) : [p.x, p.y];
    g.globalAlpha = a;
    if (p.type === 'text'){
      g.font = `900 ${p.small ? 20 : 22}px system-ui, ${EMOJI}`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = 4; g.strokeStyle = 'rgba(0,0,0,.7)'; g.strokeText(p.text, x, y);
      g.fillStyle = p.color; g.fillText(p.text, x, y);
    } else if (p.type === 'emoji'){
      emoji(g, p.text, x, y, p.size);
    } else {
      g.globalAlpha = a * 0.5; g.fillStyle = '#fff'; ell(g, x, y, p.r, p.r); g.fill();
    }
    g.globalAlpha = 1;
  }
}

function bump(sel, cls){
  const el = $(sel); el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
}

function toast(msg){

}

// Sol altta kombo göstergesi: sayı, çarpan ve bir sonraki kademeye ilerleme
const COMBO_STEPS = [3, 6, 10, 15];
function drawCombo(){
  const n = R.combo, cm = comboMult(n), next = COMBO_STEPS.find(k => k > n);
  const prev = [...COMBO_STEPS].reverse().find(k => k <= n) || 0;
  const x = 0, y = 0, w = 236, h = 46, pulse = 1 + Math.sin(now() * 8) * 0.04 * Math.min(1, n / 6);
  g.save(); g.translate(W - 12 - w * 1.25, 12); g.scale(1.25, 1.25); // sağ üstte duvarda: masaları ve kirleri örtmesin
  g.translate(w / 2, h / 2); g.scale(pulse, pulse); g.translate(-w / 2, -h / 2);
  g.fillStyle = 'rgba(20,12,6,.82)'; rr(g, x, y, w, h, 12); g.fill();
  g.strokeStyle = cm > 1 ? '#ff9d3a' : 'rgba(255,255,255,.25)'; g.lineWidth = 2; rr(g, x, y, w, h, 12); g.stroke();
  emoji(g, '🔥', x + 24, y + 22, cm >= 2 ? 26 : 20);
  g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillStyle = '#fff'; g.font = '900 19px system-ui'; g.fillText(`${n} ${L('KOMBO', 'COMBO')}`, x + 44, y + 17);
  g.fillStyle = cm > 1 ? '#ffc94a' : '#c9b39a'; g.font = '700 13px system-ui';
  g.fillText(cm > 1 ? `${L('bahşiş', 'tips')} x${cm}` : L(`${next} kombo: bahşiş x${comboMult(next)}`, `${next} combo: tips x${comboMult(next)}`), x + 44, y + 34);
  const tf = Math.max(0, (R.comboT || 0) / COMBO_TIME);   // kalan kombo süresi
  g.fillStyle = tf < 0.3 ? '#ff6b5e' : '#ffc94a'; rr(g, x + 10, y + 3, (w - 20) * tf, 3, 1.5); g.fill();
  if (next){ // ilerleme çubuğu
    const f = (n - prev) / (next - prev);
    g.fillStyle = 'rgba(255,255,255,.15)'; rr(g, x + 170, y + 12, 54, 6, 3); g.fill();
    g.fillStyle = '#ff9d3a'; rr(g, x + 170, y + 12, 54 * f, 6, 3); g.fill();
    g.fillStyle = '#c9b39a'; g.font = '700 11px system-ui'; g.textAlign = 'center'; g.fillText(`→ ${next}`, x + 197, y + 32);
  }
  g.restore();
}

// scene3d.js yalnızca 3D seçilince yüklenir; 2D canvas üstte saydam katman olarak kalır (balonlar, yazılar, efektler)
let sahne3d = null, want3d = false;
// Varsayılan 3D (izometrik maket). Oyuncu 2D'yi seçtiyse ya da bu cihazda 3D daha önce hata verdiyse 2D açılır
try {
  const pref = localStorage.getItem('cayocagi-sahne');
  want3d = pref === '3d' || (pref == null && !localStorage.getItem('cayocagi-3dhata'));
} catch(e) {}
if (/[?&]3d\b/.test(location.search)) want3d = true;   // test: adrese ?3d eklenince 3D açılır
const use3d = () => want3d && sahne3d;
// Son 3D hatası Ayarlar'da kalıcı görünür (kart birkaç saniyede kaybolur): mesaj + hatanın çıktığı dosya/satır
let err3d = '';
function note3d(err){
  const at = String(err && err.stack || '').split('\n').find(l => /\.js:\d+/.test(l)) || '';
  err3d = (String(err && err.message || err) + ' @ ' + at.replace(/^.*\//, '').replace(/\)$/, '')).slice(0, 220);
  return err3d.slice(0, 140);
}
let loading3d = false;   // yükleme sürerken düğmeye tekrar basılırsa ikinci kez kurulmasın
// remember: yalnızca oyuncu Ayarlar'dan seçince kaydedilir (açılıştaki varsayılan kaydedilmez, hata olursa 2D'ye dönebilsin)
function set3D(on, remember = true){
  want3d = on;
  if (remember) try { localStorage.setItem('cayocagi-sahne', on ? '3d' : '2d'); } catch(e) {}
  $('#scene3d').hidden = !on || !sahne3d;
  if (!on || sahne3d){ if (sahne3d) sahne3d.resize(); return; }
  if (loading3d) return;
  loading3d = true;
  import('./scene3d.js').then(m => {
    sahne3d = m.init($('#scene3d'));
    $('#scene3d').hidden = !want3d; sahne3d.resize();
  }).catch(err => {
    console.error(err); drop3D();
    announce({emoji:'⚠️', name:L('3D sahne açılamadı, 2D kullanılıyor', 'The 3D scene could not start, using 2D'), desc:note3d(err)});
  }).finally(() => { loading3d = false; });
}
// Hata yüzünden 2D'ye dönüş bu oturumluk: oyuncunun tercihi silinmez, sonraki açılışta 3D yine denenir
function drop3D(){
  want3d = false; $('#scene3d').hidden = true;
  try { localStorage.setItem('cayocagi-3dhata', APP_VERSION); } catch(e) {}   // sonraki açılış 2D başlasın (Ayarlar'dan yine açılabilir)
}
function drawScene3D(){

  if (R.stains.length >= 3){ const st = R.stains[0], [fx, fy] = at(st.x, 30, st.y); emoji(g, '🪰', fx + Math.sin(t * 5) * 14, fy + Math.cos(t * 8) * 6, 14); }
  R.tray.forEach((p, i) => {   // tepsideki ürünler tezgâhın üstünde

  });
  R.garsons.forEach(gs => { const tr = gs.carry && S3.anchor('g' + gs.i, 'tray'); if (tr) emoji(g, P[gs.carry].emoji, tr[0], tr[1] - 8, 16); });
  if (R.arson){ const a = R.arson, hd = S3.anchor('arson');

  if (effect('yangin')) for (let i = 0; i < 4; i++){ const [x, y] = at(60 + i * 90, 50 + Math.abs(Math.sin(t * 5 + i)) * 10, 318); emoji(g, '🔥', x + Math.sin(t * 7 + i) * 4, y, 30); }

  drawParticles(S3.from2D);
  if (status === 'running' && R.combo >= 2) drawCombo();

}

  $('#day').textContent = `${L('Gün', 'Day')} ${S.day} · ` + String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');
  $('#day').title = WD().name;
  $('#clockfill').style.width = frac * 100 + '%';
  $('#shopsBtn').hidden = status === 'running' || S.branches.length < 2;
  $('#shopsBtn').title = L('Dükkânlarım', 'My shops') + ' · ' + city().name;
  const where = S.cur ? ` · ${city().name}` : '';
  $('#shopTitle').textContent = '🍵 ' + owner().shopName + where;
  $('#levelName').textContent = (S.cur ? `${city().emoji} ${city().name}${L(' şubesi', ' branch')} · ` : '') + shopLevel().name + L(' kapalı. Hazır olunca aç!', ' is closed. Open when ready!') + (offerPending() ? L(' 📞 Bir röportaj isteği var!', ' 📞 An interview request is waiting!') : '') + (S.critic === S.day ? L(' 🧐 Bugün eleştirmen geliyor!', ' 🧐 A food critic is coming today!') : '');
  $('#closedOverlay').hidden = status === 'running';
  $('#openBtn').textContent = L(`☀️ Dükkânı Aç (Gün ${S.day})`, `☀️ Open Shop (Day ${S.day})`);
  $('#pName').textContent = owner().name;
  $('#pShop').textContent = owner().shopName + where + ' · ' + shopLevel().name + (legacy().n ? ' · 🎖️ ' + legacyTitle() : '');
  const fl = fameLv(), F = FAME_LEVELS[fl], FN = FAME_LEVELS[fl + 1];
  const fp = FN ? (S.fame - F.need) / (FN.need - F.need) : 1;
  setHTML('#pFame', `${F.emoji} ${F.name} · 🌟 ${fmt(S.fame)}${FN ? ' / ' + fmt(FN.need) : ''}<span class="fbar"><i style="width:${Math.round(fp * 100)}%"></i></span>`);

  document.querySelector('.tab[data-tab=magaza]').classList.toggle('has', !!(canGrow() || canUpgrade() || canAntique() || canUnlock()));
  document.querySelector('.tab[data-tab=ekip]').classList.toggle('has', (S.staff || []).some(p => upCls(p)) || S.packs > 0);
  const subeTab = document.querySelector('.tab[data-tab=sube]');
  subeTab.hidden = false;   // Dükkânlarım ağacı baştan açık (şube açmak yine dükkân seviyesi ister)
  subeTab.classList.toggle('has', affordBranch() || troubled() || canHood());
  if (subeTab.hidden && tab === 'sube') setTab('mutfak');

  $('#pauseBtn').hidden = status !== 'running';
  // Yüzen düğmeler: günlük ödül noktası, lig rozeti
  $('#dailyBtn .dot').hidden = !(S.owner && dailyPending());
  const lgs = standings(), lb = $('#lgBadge');
  lb.hidden = !lgs;
  if (lgs){
    const rk = lgs.findIndex(x => x.id === 'me') + 1;
    setHTML('#lgBadge', `<span class="lgc">${ic('trophy')}</span><b>${rk}.</b><small>${L('LİG', 'LEAGUE')}</small>`);
    lb.classList.toggle('lead', rk === 1);
  }
  document.body.classList.toggle('running', status === 'running');
  document.body.classList.toggle('veteran', S.day > 3); // açıklamalar yer kaplamasın

  // Mutfak (+ ilk iki gün için öğretici)
  const co = coach();
  $('#coach').hidden = !co.msg;
  if (co.msg) $('#coach').textContent = co.msg;
  const room = hasRoom() && R.queue.length < 5;
  const menu = kitchenMenu();
  $('#products').classList.toggle('many', menu.length > 6); // telefonda 4 sütun
  $('#products').classList.toggle('lots', menu.length > 10);
  // Dikey telefonda ürünler tek satırı aşarsa sahne o kadar küçülür (yalnızca menü ya da durum değişince ölç)
  const pk = [menu.length, status, tab, portrait].join();
  if (pk !== prodKey){ prodKey = pk; requestAnimationFrame(() =>
    document.body.style.setProperty('--pextra', Math.max(0, $('#products').offsetHeight - 64) + 'px')); }
  setHTML('#products', menu.map((p, i) =>
    `<button class="prod${room ? '' : ' full'}${co.want.includes(p.id) ? ' pulse' : ''}" data-prod="${p.id}"><kbd>${(i + 1) % 10}</kbd><span class="em">${p.emoji}</span>
     <b>${p.name}</b><small><span class="${itemPrice(p.id) > p.price ? 'up' : ''}">₺${itemPrice(p.id)}</span><span class="pt"> · ${prepTime(p.id).toFixed(1)} ${L('sn', 's')}</span></small></button>`).join(''));

  let ev = '';
  if (status === 'running'){
    if (R.dayEvent) ev += `<span class="ev">${R.dayEvent.emoji} <b>${R.dayEvent.name}</b></span>`;
    R.effects.forEach(e => ev += `<span class="ev">${e.ev.emoji} <b>${e.ev.name}</b> <small>${Math.ceil(e.left)} ${L('sn', 's')}</small></span>`);
  }
  if (status === 'running' && fameLv() >= 1 && !R.fansUsed && DAY_LEN - R.t > 20) ev += `<button class="ev fans" data-fans>📣 <b>${L('Hayranlarını çağır', 'Call your fans')}</b></button>`;
  setHTML('#events', ev);
  document.body.classList.toggle('blackout', status === 'running' && effect('elektrik'));

  const chip = (p, prog, who) => `<span class="chip">${P[p].emoji}<span class="who">${who}</span><span class="prog" style="width:${Math.min(1, prog) * 100}%"></span></span>`;
  let q = R.queue.map(x => chip(x.p, x.prog / prepTime(x.p), P[x.p].tool ? UPGRADES.find(u => u.id === P[x.p].tool).emoji : ''));
  R.helpers.forEach(x => { if (x) q.push(chip(x.p, x.prog / prepTime(x.p), '🧒')); });
  setHTML('#queue', q.join('') || `<small class="hint" style="margin:8px">${L('Ocak boş', 'Stove is empty')}</small>`);

  $('#trayTitle').textContent = `${L('Tepsi', 'Tray')} (${R.tray.length}/${trayCap()})`;
  let t = R.tray.map((p, i) => `<span class="item" data-trash="${i}" title="${L('Çöpe at', 'Throw away')}">${P[p].emoji}</span>`).join('');
  for (let i = R.tray.length; i < trayCap(); i++) t += '<span class="slot"></span>';
  setHTML('#tray', t);

  // Yalnızca görünen panel üretilir: geri kalanı saniyede 10 kez boşuna hesaplanmasın
  const side = sidePanel();
  if (side === 'magaza'){
    setHTML('#shopSeg', `<div class="seg">${[['esya', 'shop', L('Eşyalar', 'Items')], ['menu', 'menu', L('Menü', 'Menu')]].map(([id, icn, t]) => `<button class="${shopTab === id ? 'on' : ''}" data-stab="${id}">${ic(icn)}<span>${t}</span></button>`).join('')}</div>`);
    $('#shop').hidden = shopTab === 'menu'; $('#menuList').hidden = shopTab !== 'menu';
    if (shopTab === 'menu') renderMenu(menu); else renderShop();
  }
  else if (side === 'esya') renderInventory();
  else if (side === 'ekip'){ setHTML('#ekipTree', staffTreeHTML()); setHTML('#cardList', cardsHTML()); drawStaffPortraits(); }
  else if (side === 'sube'){
    setHTML('#subeSeg', `<div class="seg">${[['mahalle', 'store', L('Mahalle', 'Town')], ['sube', 'city', L('Şubeler', 'Branches')]].map(([id, icn, t]) => `<button class="${hoodTab === id ? 'on' : ''}" data-htab="${id}">${ic(icn)}<span>${t}</span></button>`).join('')}</div>`);
    $('#hood3dWrap').hidden = hoodTab !== 'mahalle' || hood3dFail;
    $('#hoodView').hidden = hoodTab !== 'mahalle'; $('#branchList').hidden = hoodTab === 'mahalle';
    if (hoodTab === 'mahalle'){ setHTML('#hoodView', hoodHTML()); drawHood3D(); } else { setHTML('#branchList', branchesHTML()); drawStaffPortraits(); }
  }
}

// Mağaza: dükkân büyütme + eşyalar + çalışanlar
function renderShop(){
  let sev = `<h3>${L('🚚 Sevkiyat', '🚚 Supplies')}</h3><p class="hint">${L('Malzeme kalitesini seç. Her satışın bir payı malzemeye gider. Dükkân kapalıyken değiştirilir.', 'Pick your ingredient quality. A share of every sale goes to ingredients. Change it while the shop is closed.')}</p>`;
  Object.entries(QUALITY).forEach(([id, q]) => {
    const on = (S.quality || 'orta') === id;
    sev += `<div class="shop-item"><div class="em">${q.emoji}</div>
      <div class="info"><b>${q.name} <span class="lvl">${L(`%${Math.round(q.cost * 100)} malzeme payı`, `${Math.round(q.cost * 100)}% ingredient share`)}</span></b><small>${q.desc}</small></div>
      <button data-qual="${id}" ${on || status === 'running' ? 'disabled' : ''}>${on ? L('✓ Seçili', '✓ Selected') : L('Seç', 'Select')}</button></div>`;
  });
  let s = '';
  const next = SHOP_LEVELS[lv('dukkan') + 1];
  if (next){
    const locked = S.day < next.day;
    s += `<div class="shop-item hl"><div class="em">🏪</div>
      <div class="info"><b>${L('Büyüt', 'Upgrade')}: ${next.name}</b><small>${locked ? L(`${next.day}. günden itibaren açılır`, `Opens from day ${next.day}`) : L(`${next.tables} masaya kadar yer, yeni görünüm, daha çok müşteri`, `Room for up to ${next.tables} tables, a new look, more customers`)}</small></div>
      <button data-grow ${locked || S.money < next.cost ? 'disabled' : ''}>${locked ? `🔒 ${L('Gün', 'Day')} ${next.day}` : '₺' + fmt(next.cost)}</button></div>`;
  } else {
    s += `<div class="shop-item hl"><div class="em">🏆</div><div class="info"><b>${shopLevel().name}</b><small>${L('Dükkânın en üst seviyede!', 'Your shop is at the top level!')}</small></div></div>`;
    if (S.cur === 0){
      const LG = legacy(), ok = canLegacy();
      s += `<div class="shop-item"><div class="em">🎖️</div><div class="info"><b>${L('Usta Mirası', "Master's Legacy")}</b><small>${ok ? L(`Dükkânı çırağına devret, baştan başla: +${legacyGain()} miras puanı (her puan kalıcı +%5 satış)`, `Hand the shop to your apprentice and start over: +${legacyGain()} legacy points (each is a permanent +5% sales)`)
        : S.day < legacyDay() ? L(`${legacyDay()}. günden itibaren dükkânını çırağına devredip kalıcı bonusla baştan başlayabilirsin`, `From day ${legacyDay()} you can hand the shop to your apprentice and start over with a permanent bonus`) : L('Biraz daha kazan: miras puanı toplam kazancınla büyür', 'Earn a bit more: legacy points grow with your total earnings')}${LG.pts ? L(` · şu an +%${5 * LG.pts}`, ` · now +${5 * LG.pts}%`) : ''}</small></div>
        <button data-legacy ${ok && status !== 'running' ? '' : 'disabled'}>${ok ? L('Devret', 'Hand over') : `🔒 ${L('Gün', 'Day')} ${legacyDay()}`}</button></div>`;
    }
  }
  [['esya', L('Eşyalar', 'Items')], ['alet', L('Mutfak Aletleri', 'Kitchen Tools')], ['ekip', L('Çalışanlar', 'Staff')]].forEach(([grp, title]) => {
    s += `<h3>${title}</h3>`;
    UPGRADES.filter(u => u.grp === grp && !STAFF_UPS.includes(u.id)).forEach(u => {
      const l = lv(u.id), m = maxLv(u), isMax = l >= m, c = upCost(u);
      const need = u.need && !lv(u.need) && UPGRADES.find(x => x.id === u.need);
      const desc = need ? L(`🔒 Önce ${need.name.toLowerCase()} tut`, `🔒 Hire a ${need.name.toLowerCase()} first`) : u.id === 'masa' && isMax && next ? L('Daha fazla masa için dükkânı büyüt', 'Upgrade the shop for more tables') : u.desc;
      s += `<div class="shop-item"><div class="em">${u.emoji}</div>
        <div class="info"><b>${u.name} <span class="lvl">${l}/${u.max || m}</span></b><small>${desc}</small></div>
        <button data-buy="${u.id}" ${need || isMax || S.money < c ? 'disabled' : ''}>${need ? '🔒' : isMax ? 'MAX' : '₺' + fmt(c)}</button></div>`;
    });
  });
  s += sev;
  // Antikacı: koleksiyon parçaları
  s += `<h3>${L('🏺 Antikacı', '🏺 Antique Dealer')}</h3>`;
  if (S.day < ANTIQUE_DAY) s += `<p class="hint">🔒 ${L(`${ANTIQUE_DAY}. günden itibaren mahalleye bir antikacı uğrar.`, `From day ${ANTIQUE_DAY}, an antique dealer visits the neighbourhood.`)}</p>`;
  else {
    const stock = antiqueStock();
    s += `<p class="hint">${L('Vitrin her gün yenilenir. Koleksiyon parçaları kalıcı bonus verir; seti tamamla, büyük bonusu kap!', 'The window changes every day. Collection pieces give permanent bonuses; complete a set for a big bonus!')}</p>`;
    s += stock.length ? stock.map(it => `<div class="shop-item"><div class="em">${it.emoji}</div>
      <div class="info"><b>${it.name}</b><small>${it.set.emoji} ${it.set.name} · +%${Math.round(it.set.per * 100)} ${it.set.what}</small></div>
      <button data-col="${it.id}" ${S.money < it.cost ? 'disabled' : ''}>₺${fmt(it.cost)}</button></div>`).join('')
      : `<p class="hint">${L('🎉 Antikacının sana satacağı bir şey kalmadı!', '🎉 The antique dealer has nothing left to sell you!')}</p>`;
  }
  setHTML('#shop', s);
}

// Menü: tarif geliştirme + açılabilecek ürünler
function renderMenu(menu){
  let m = `<h3>${L('Tarifler', 'Recipes')}</h3><p class="hint">${L('Tarifi geliştirdikçe ürün daha lezzetli olur: her yıldız +%25 satış fiyatı.', 'Better recipes taste better: every star is +25% sale price.')}</p>`;
  menu.filter(p => !p.ev).forEach(p => {
    const l = recLv(p.id), isMax = l >= MAX_RECIPE, c = recipeCost(p.id);
    m += `<div class="shop-item"><div class="em">${p.emoji}</div>
      <div class="info"><b>${p.name} <span class="lvl">${stars5(l)}</span></b><small>${L('Satış', 'Sells for')} ₺${basePrice(p.id)}${isMax ? L(' · Usta tarifi!', " · Master's recipe!") : ` → ₺${Math.round(p.price * (1 + 0.25 * (l + 1)))}`}</small></div>
      <button data-recipe="${p.id}" ${isMax || S.money < c ? 'disabled' : ''}>${isMax ? 'MAX' : '₺' + fmt(c)}</button></div>`;
  });
  const locked = PRODUCTS.filter(p => !S.unlocked.includes(p.id));
  if (locked.length){
    m += `<h3>${L('Yeni Ürünler', 'New Products')}</h3>`;
    locked.forEach(p => {
      const need = shopLocked(p) && lockText(p);
      m += `<div class="shop-item"><div class="em">${p.emoji}</div>
        <div class="info"><b>${p.name}</b><small>${need ? L(`${need} açılır`, `Unlocks ${need}`) : L(`Satış fiyatı ₺${p.price} · ${p.time} sn hazırlama`, `Sells for ₺${p.price} · ${p.time}s to make`)}</small></div>
        <button data-unlock="${p.id}" ${need || S.money < p.cost ? 'disabled' : ''}>${need ? '🔒' : '₺' + fmt(p.cost)}</button></div>`;
    });
  } else m += `<p class="hint" style="margin-top:10px">${L('🎉 Tüm ürünler menüde!', '🎉 Every product is on the menu!')}</p>`;
  setHTML('#menuList', m);
}

// Albüm: setler rozet ızgarasında; dokunulan setin parçaları altta açılır
function albumHTML(){
  const ownN = COL_ITEMS.filter(it => owned(it.id)).length;
  const bon = [['tip', L('bahşiş', 'tips')], ['pat', L('sabır', 'patience')], ['fame', L('ünlülük', 'fame')], ['off', L('sen yokken kasası', 'while-away cash')]]
    .filter(([k]) => colBonus(k) > 0).map(([k, w]) => L(`+%${Math.round(colBonus(k) * 100)} ${w}`, `+${Math.round(colBonus(k) * 100)}% ${w}`));
  let h = `<div class="album-head"><span class="ah-em">🏺</span><div class="ah-txt"><b>${L('Koleksiyon Albümü', 'Collection Album')}</b>
      <small>${bon.length ? L('Bonusun: ', 'Your bonus: ') + bon.join(' · ') : L('Antikacıdan parça al, etkinlik görevlerinden hatıra kazan. Her set kalıcı bonus verir!', 'Buy pieces from the antique dealer and win keepsakes in events. Every set gives a permanent bonus!')}</small>
      ${pbar(ownN, COL_ITEMS.length)}</div></div>`;
  h += '<div class="album">' + COL_SETS.map(st => {
    const n = st.items.filter(it => owned(it.id)).length;

      <span class="ae">${st.emoji}</span><span class="rib">${st.name}</span>${pbar(n, st.items.length)}</button>`;
  }).join('') + '</div>';
  const st = COL_SETS.find(s => s.id === albumSet);
  h += st ? `<div class="aset-detail"><h3>${st.emoji} ${st.name}${setDone(st) ? ' ✅' : ''}</h3>
      <p class="hint">${L(`Parça başı +%${Math.round(st.per * 100)}, set tamamlanınca +%${Math.round(st.full * 100)} ${st.what}`, `+${Math.round(st.per * 100)}% per piece, +${Math.round(st.full * 100)}% ${st.what} for the full set`)}</p><div class="inv">`
      + st.items.map(it => invCard(owned(it.id) ? it.emoji : '❔', it.name, owned(it.id) ? L('Koleksiyonunda', 'In your collection') : st.event ? L('Etkinlik ödülü', 'Event reward') : `₺${fmt(it.cost)}`, '', !owned(it.id))).join('') + '</div></div>'
    : `<p class="hint" style="text-align:center;margin-top:10px">${L('Bir sete dokun, parçalarını gör.', 'Tap a set to see its pieces.')}</p>`;
  return h;
}

const REG_TIERS = [

function ensureStaff(){
  S.staff = S.staff || [];
  let changed = false;
  S.branches.forEach(b => {
    for (const role of ['head', 'cirak', 'garson']){
      const want = role === 'head' ? 1 : (b.lv[role] || 0);
      const have = S.staff.filter(p => p.city === b.city && p.role === role);
      const start = role === 'head' ? 1 : 1 + (b.lv[role + 'hiz'] || 0);
      for (let i = have.length; i < want; i++){ S.staff.push(newPerson(role, b.city, start)); changed = true; }
      if (have.length > want){ const drop = new Set(have.slice(want)); S.staff = S.staff.filter(p => !drop.has(p)); changed = true; }
    }
  });
  const cities = new Set(S.branches.map(b => b.city));   // batan şubenin ekibi gider
  if (S.staff.some(p => !cities.has(p.city))){ S.staff = S.staff.filter(p => cities.has(p.city)); changed = true; }
  if (changed) save();
}

function cardBonus(k){ const c = sagCard(); return c && c.fx[k] ? c.fx[k] * cardLv(c.id) / 100 : 0; }
const packCost = () => Math.round(400 * Math.pow(2, mainLv()) / 10) * 10;
function rollCard(){
  const r = Math.random(), rar = r < RAR.e.p ? 'e' : r < RAR.e.p + RAR.r.p ? 'r' : 'c';

const HICAZ = [293.7, 311.1, 370, 392, 440, 466.2, 523.3, 587.3];
const MELODY = [0,-1,1,2, 3,-1,2,1, 2,-1,3,4, 3,2,1,-1, 4,-1,5,4, 3,-1,4,6, 5,4,3,2, 1,-1,0,-1];  // -1 = es
const BEAT = 0.3;
let musicGain = null, musicStep = 0, musicNext = 0;
function pluck(freq, t, vol, dur){
  const o = actx.createOscillator(), o2 = actx.createOscillator(), gn = actx.createGain();
  o.type = 'triangle'; o.frequency.value = freq;
  o2.type = 'sine'; o2.frequency.value = freq * 2;
  gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + 0.01); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gn); o2.connect(gn); gn.connect(musicGain);
  o.start(t); o2.start(t); o.stop(t + dur); o2.stop(t + dur);
}
function musicTick(){
  const want = musicOn && !muted && userActive() && status === 'running' && !modalOpen() && !document.hidden;
  if (!actx && !want) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (!musicGain){ musicGain = actx.createGain(); musicGain.gain.value = 0; musicGain.connect(actx.destination); }
    musicGain.gain.setTargetAtTime(want ? 1 : 0, actx.currentTime, 0.3);
    if (!want){ musicNext = 0; return; }
    if (actx.state === 'suspended') actx.resume();
    if (musicNext < actx.currentTime) musicNext = actx.currentTime + 0.05;
    while (musicNext < actx.currentTime + 0.6){
      const n = MELODY[musicStep % MELODY.length];
      if (n >= 0) pluck(HICAZ[n], musicNext, 0.03, 0.7);
      if (musicStep % 16 === 0){ pluck(73.4, musicNext, 0.03, 4); pluck(110, musicNext, 0.015, 4); }
      musicStep++; musicNext += BEAT;
    }
  } catch(e) {}
}

// Oyuncu uzaktayken çıraklar dükkânı, müdürler şubeleri işletir. Kasa en fazla OFF.cap saat dolar;
// saatlik gelir bir oyun gününün OFF.share katıdır (8 saat ≈ 4 günlük pasif gelir, ~birkaç dakikalık oyun)
const OFF = {min:10, cap:8, share:0.5};               // dakika, saat, saatlik pay
const shopDaily = () => Math.max(30, Math.round(S.bestDay * (0.15 + 0.05 * (lv('cirak') + lv('garson')))));
const branchDaily = () => S.branches.reduce((s, b, i) => i === S.cur ? s : s + managedIncome(b), 0);
const hm = h => { const m = Math.round(h * 60); return m >= 60 ? `${Math.floor(m / 60)} ${L('sa', 'h')} ${m % 60} ${L('dk', 'min')}` : `${m} ${L('dk', 'min')}`; };
// Kasa kayıtta durur: toplanmadan çıkılsa da kaybolmaz, sonraki yokluk üstüne eklenir (tavan aynı)
function checkOffline(ms){
  if (stale || !S.owner) return false;
  if (S.day >= 2 && ms >= OFF.min * 60000){
    const total = ms + (S.pendingOff ? S.pendingOff.ms : 0), h = Math.min(OFF.cap, total / 3600000);
    const ob = (1 + colBonus('off')) * (fameLv() >= 5 ? 1.25 : 1);   // Uğur Getirenler seti ve ustalık kitabı kasayı büyütür
    const shop = Math.round(shopDaily() * OFF.share * h * ob), br = Math.round(branchDaily() * OFF.share * h * ob);
    S.pendingOff = {ms:total, h, shop, br, full:total / 3600000 >= OFF.cap};
    save();
  }
  if (!S.pendingOff) return false;
  // Karne, kapak gibi açık bir pencerenin üstüne binmez; kapanınca ana döngü gösterir
  if (!modalOpen() || status === 'running' || $('#claimOffline')) showOffline();
  return true;
}

    <p class="hint">💰 ${L('Kasa', 'Till')}: ${hm(h)} / ${OFF.cap} ${L('saat', 'h')}${full ? L(' · <b>doldu!</b>', ' · <b>full!</b>') : ''}</p>

  const q = IV.qs[IV.i], order = Object.keys(q.a).sort(() => Math.random() - 0.5);
  showModal(`

function answer(t){
  IV.picks.push(t); IV.i++;
  SFX.serve();
  if (IV.i < IV.qs.length) return showQuestion();
  const o = OUTLETS[IV.tier];
  let fm = 0, rp = 0;
  const cnt = {};
  IV.picks.forEach(p => { fm += ANS[p].fame; rp += ANS[p].rep; cnt[p] = (cnt[p] || 0) + 1; });
  const top = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
  const gain = Math.round(o.fame * fm / IV.picks.length);
  S.rep = Math.max(0, Math.min(100, S.rep + rp));
  S.interviews = (S.interviews || 0) + 1;
  S.offer.ans = 'yes';
  S.lastCover = {tier:IV.tier, quote:HEADLINES[top], t:top, day:S.day};
  // Baskın tarz ödül verir; üç cevap da aynı tarzdaysa tutarlılık bonusu (+%50 ünlülük)
  const same = cnt[top] === IV.picks.length;
  const bonus = same ? Math.round(gain * 0.5) : 0;
  let money = 0;
  if (top === 'iddiali'){ money = Math.round(o.fame * 40 * (same ? 1.5 : 1)); S.money += money; S.total += money; }
  S.ivBuff = {day:S.day, t:top};
  addFame(gain + bonus);
  const rewardNote = IV_REWARD[top].replace('{m}', fmt(money)) + (same ? L(` · 🎯 Tutarlı duruş: +${bonus} 🌟`, ` · 🎯 Consistent style: +${bonus} 🌟`) : '');
  IV = null;
  save();
  SFX.levelUp();
  showCover(true, `+${gain + bonus} 🌟 ${L('ünlülük', 'fame')} · ${rp >= 0 ? '+' : ''}${rp}⭐ ${L('itibar', 'reputation')}<br>🎁 ${rewardNote}`);
}

const displayName = () => /usta/i.test(owner().name) ? owner().name : owner().name + ' Usta';
function wrapText(ctx, text, x, y, maxW, lh){
  const words = text.split(' ');
  let ln = '';
  for (const w of words){
    if (ln && ctx.measureText(ln + ' ' + w).width > maxW){ ctx.fillText(ln, x, y); ln = w; y += lh; }
    else ln = ln ? ln + ' ' + w : w;
  }
  ctx.fillText(ln, x, y);
}
function drawCover(c, cv){
  const o = OUTLETS[cv.tier], W2 = 600, H2 = 800;
  c.fillStyle = o.color; c.fillRect(0, 0, W2, H2);
  // Arkadaki ışık
  const rg = c.createRadialGradient(300, 380, 40, 300, 380, 330);
  rg.addColorStop(0, 'rgba(255,240,200,.55)'); rg.addColorStop(1, 'rgba(255,240,200,0)');
  c.fillStyle = rg; c.fillRect(0, 0, W2, H2);
  // Başlık (yayın adı)
  c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.fillStyle = '#fff';
  let size = 78;
  c.font = `900 ${size}px Georgia, serif`;
  while (c.measureText(o.name.toLocaleUpperCase('tr-TR')).width > 560 && size > 30){ size--; c.font = `900 ${size}px Georgia, serif`; }
  c.fillText(o.name.toLocaleUpperCase('tr-TR'), 300, 98);
  c.fillRect(30, 118, 540, 3);
  c.font = 'bold 18px system-ui, sans-serif'; c.textAlign = 'left';
  c.fillText(`${L('SAYI', 'ISSUE')} ${cv.day}`, 32, 146);
  c.textAlign = 'right'; c.fillText(o.kind === 'dergi' ? L('AYLIK DERGİ', 'MONTHLY MAGAZINE') : L('GÜNLÜK GAZETE', 'DAILY NEWSPAPER'), 568, 146);
  // Kapak yıldızı
  drawPerson(c, {x:300, y:790, look:owner(), apron:true, mood:'happy', scale:6.6});
  const bg = c.createLinearGradient(0, 470, 0, 800);
  bg.addColorStop(0, 'rgba(0,0,0,0)'); bg.addColorStop(0.45, 'rgba(0,0,0,.72)'); bg.addColorStop(1, 'rgba(0,0,0,.9)');
  c.fillStyle = bg; c.fillRect(0, 470, W2, 330);
  // Etiket + isim + söz
  c.textAlign = 'center';
  const tag = cv.tier >= 3 ? L('ÖZEL RÖPORTAJ', 'EXCLUSIVE INTERVIEW') : L('RÖPORTAJ', 'INTERVIEW');
  c.font = '900 20px system-ui, sans-serif';
  const tw = c.measureText(tag).width + 28;
  c.fillStyle = '#ffc94a'; c.fillRect(300 - tw / 2, 568, tw, 34);
  c.fillStyle = '#2b1d14'; c.fillText(tag, 300, 592);
  c.fillStyle = '#fff';
  size = 52; c.font = `900 ${size}px Georgia, serif`;
  const nm = displayName();
  while (c.measureText(nm).width > 550 && size > 26){ size--; c.font = `900 ${size}px Georgia, serif`; }
  c.fillText(nm, 300, 656);
  c.font = 'italic 28px Georgia, serif'; c.fillStyle = '#ffe7b0';
  wrapText(c, cv.t ? HEADLINES[cv.t] : cv.quote, 300, 700, 540, 34);
  c.font = 'bold 17px system-ui, sans-serif'; c.fillStyle = '#ffffffcc';
  c.fillText(L(`${owner().shopName} · ${S.branches.length} dükkân · ${fmt(S.served)} mutlu müşteri`, `${owner().shopName} · ${S.branches.length} shops · ${fmt(S.served)} happy customers`), 300, 778);
}
async function shareCover(){

    return `<div class="shop-item${here ? ' cur' : b.crisis ? ' crisis' : b.issue ? ' warn' : ''}"><div class="em">${c.emoji}</div>
      <div class="info"><b>${c.name} <span class="lvl">${k.emoji} ${k.name}</span></b>
      <small>${LV.name} · ⭐ ${rep}${here ? '' : ` · ${L('günde', 'per day')} ~₺${fmt(managedIncome(Object.assign({}, b, {rep})))}`}</small>
      <small>${st}${here ? L(' · 📍 Buradasın', ' · 📍 You are here') : gone > 0 ? L(` · ${gone} gündür uğramadın`, ` · not visited for ${gone} days`) : ''}</small></div>
      ${here ? '' : `<button data-switch="${i}">${L('Git', 'Go')}</button>`}</div>`;
  }).join('');
  showModal(`<h2>${L('🏪 Dükkânlarım', '🏪 My Shops')}</h2>${rows}
    <p class="hint">${L('Uzun süre uğramadığın şubelerde sorun çıkma ihtimali artar. Sorunlu şubeye gidip bir gün çalışırsan düzelir.', 'Branches you have not visited for a while are more likely to run into trouble. Work a day at a troubled branch to fix it.')}</p>
    <button class="big" id="modalOk">${L('Kapat', 'Close')}</button>`);
}
$('#shopsBtn').addEventListener('click', () => { if (status !== 'running' && !modalOpen()){ showShops(); SFX.serve(); } });
function goBranch(i){
  if (status === 'running'){ toast(L('Şube değiştirmek için günün bitmesini bekle', 'Wait for the day to end to switch branches')); SFX.error(); return; }
  switchBranch(i);
  SFX.open(); toast(`📍 ${city().emoji} ${S.cur ? L(city().name + ' şubesindesin', 'You are at the ' + city().name + ' branch') : L('Ana dükkândasın', 'You are at the main shop')}`);
  if (!desktopMQ.matches) setTab('mutfak');
  toTop();
  renderUI();
}
function makeProduct(id){
  if (status !== 'running') return;
  if (!hasRoom() || R.queue.length >= 5){ toast(L('Tepsi dolu! Önce servis yap.', 'The tray is full! Serve first.')); SFX.error(); return; }
  R.queue.push({p:id, prog:0});
  SFX.prepStart();
}

scene.addEventListener('pointerdown', e => {
  if (modalOpen() || status !== 'running') return;
  const r = scene.getBoundingClientRect();
  let x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * viewH();
  if (use3d()){
    const h = sahne3d.hit(e.clientX, e.clientY);
    if (h.arson && R.arson){ catchArson(L('🏃 Kundakçıyı kovdun!', '🏃 You chased off the arsonist!')); return; }
    const hc = h.cust && R.customers.find(c => c.id === h.cust && seated(c));
    if (hc){ serve(hc); return; }
    if (!h.ground) return;
    ({x, y} = h.ground);
  }
  if (R.arson && Math.abs(x - R.arson.x) < 50 && y > R.arson.y - 110 && y < R.arson.y + 20){ catchArson(L('🏃 Kundakçıyı kovdun!', '🏃 You chased off the arsonist!')); return; }
  const st = R.stains.find(st => Math.abs(x - st.x) < 32 && Math.abs(y - st.y) < 22);
  if (st){ R.stains = R.stains.filter(o => o !== st); floatText(st.x, st.y - 20, '✨', '#fff'); SFX.trash(); return; }
  // Telefonda parmak küçük kalmasın: geniş alan, en yakın müşteri
  let best = null, bd = 1e9;
  R.customers.filter(seated).forEach(c => {
    const s = SLOTS[c.seat], dx = Math.abs(x - s.x);
    if (dx < 72 && y > s.y - 140 && y < s.y + 40 && dx < bd){ best = c; bd = dx; }
  });
  if (best) serve(best);
});

// Hızlı eylemler (ürün hazırla, çöpe at) parmak değer değmez çalışır
document.addEventListener('pointerdown', e => {
  if (modalOpen()) return;
  const t = e.target.closest('[data-prod],[data-trash]');
  if (!t) return;
  const d = t.dataset;
  if (d.prod) makeProduct(d.prod);
  else { trayRemove(+d.trash); SFX.trash(); }
  renderUI();
});

// Satın almalar "click" ile: listeyi kaydırırken yanlışlıkla bir şey alınmaz
document.addEventListener('click', e => {
  if (modalOpen()) return;
  const t = e.target.closest('[data-unlock],[data-buy],[data-qual],[data-fans],[data-open],[data-grow],[data-recipe],[data-branch],[data-switch],[data-cover],[data-pin],[data-fix],[data-col],[data-legacy],[data-ct],[data-inv],[data-aset],[data-sid],[data-stab],[data-hood],[data-htab],[data-card],[data-pack]');
  if (!t) return;
  const d = t.dataset;
  if (d.fans !== undefined){
    if (status !== 'running' || R.fansUsed) return;
    R.fansUsed = true;
    const fev = {emoji:'📣', name:'Hayranlar geliyor', desc:'25 saniye boyunca müşteriler 2 kat sık gelir!'};
    R.effects.push({id:'fans', left:25, ev:fev}); R.spawnIn = Math.min(R.spawnIn, 1);
    announce(fev); renderUI(); return;
  }
  if (d.qual){
    if (status === 'running') return;
    S.quality = d.qual; toast(L(`${Q().emoji} ${Q().name} sipariş edildi`, `${Q().emoji} ${Q().name} ordered`)); save(); renderUI(); return;
  }
  if (d.open !== undefined){
    if (offerPending()){ showInvite(); SFX.event(); }
    else openShop();
  }
  else if (d.cover !== undefined && S.lastCover) showCover(false);
  else if (d.legacy !== undefined){ if (canLegacy() && status !== 'running') showLegacy(); }
  else if (d.fix) fixBranch(+d.fix);
  else if (d.ct) answerContract(d.ct === 'yes');
  else if (d.inv){ invTab = d.inv; SFX.serve(); }
  else if (d.sid) showStaff(d.sid);
  else if (d.stab){ shopTab = d.stab; SFX.serve(); }
  else if (d.htab){ hoodTab = d.htab; SFX.serve(); }
  else if (d.hood) buyHood(d.hood);
  else if (d.pack) openPack(d.pack === 'buy');
  else if (d.card) showCard(d.card);
  else if (d.aset){ albumSet = albumSet === d.aset ? null : d.aset; SFX.serve(); }
  else if (d.pin){
    // Haritadaki iğne: o şehrin satırına kaydır ve parlat
    const el = $(`#br-${d.pin === 'tr' ? 'ana' : d.pin}`);
    if (el){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  }
  else if (d.unlock){
    const p = P[d.unlock];
    if (S.money >= p.cost && !S.unlocked.includes(p.id) && !shopLocked(p)){ S.money -= p.cost; S.unlocked.push(p.id); toast(L(`${p.emoji} ${p.name} menüye eklendi!`, `${p.emoji} ${p.name} added to the menu!`)); SFX.buy(); save(); }
  } else if (d.recipe){
    const id = d.recipe, c = recipeCost(id);
    if (S.money >= c && recLv(id) < MAX_RECIPE){
      S.money -= c; S.rec = S.rec || {}; S.rec[id] = recLv(id) + 1;
      toast(L(`${P[id].emoji} ${P[id].name} tarifi ${recLv(id)}/${MAX_RECIPE} ⭐ · artık ₺${basePrice(id)}`, `${P[id].emoji} ${P[id].name} recipe ${recLv(id)}/${MAX_RECIPE} ⭐ · now ₺${basePrice(id)}`)); SFX.buy(); save();
    }
  } else if (d.grow !== undefined){
    const next = SHOP_LEVELS[lv('dukkan') + 1];
    if (next && S.day >= next.day && S.money >= next.cost){
      S.money -= next.cost; S.lv.dukkan = lv('dukkan') + 1;
      levelUpAt = now(); confetti(); SFX.build(); setTimeout(SFX.levelUp, 450);
      toast(L(`🏪 Dükkânın artık bir ${next.name}!`, `🏪 Your shop is now a ${next.name}!`)); save();
    }
  } else if (d.branch){
    showConcepts(d.branch);
  } else if (d.switch){
    goBranch(+d.switch);
  } else if (d.col){
    const it = COL[d.col];
    if (it && !owned(it.id) && !it.set.event && S.money >= it.cost && S.day >= ANTIQUE_DAY){
      S.money -= it.cost; colAdd(it.id);
      toast(L(`${it.emoji} ${it.name} koleksiyonuna eklendi!`, `${it.emoji} ${it.name} added to your collection!`)); SFX.buy(); save();
    }
  } else if (d.buy){
    const u = UPGRADES.find(u => u.id === d.buy), c = upCost(u);
    if (S.money >= c && lv(u.id) < maxLv(u)){
      S.money -= c; S.lv[u.id] = lv(u.id) + 1;
      if (u.id === 'masa'){ tableBorn[numTables() - 1] = now(); SFX.build(); }
      else if (u.id === 'garson'){ R.garsons.push(newGarson(R.garsons.length)); SFX.buy(); }
      else SFX.buy();
      toast(L(`${u.emoji} ${u.name} seviye ${lv(u.id)}!`, `${u.emoji} ${u.name} level ${lv(u.id)}!`)); save();
      if (u.id === 'cirak' || u.id === 'garson') hireChoice(u.id);   // R-4: aday seçimi
    }
  }
  renderUI();
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (modalOpen()){ if (e.key === 'Escape' && $('#modalOk')) hideModal(); return; }
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P'){ pauseGame(); return; }
  const n = parseInt(e.key);
  if (n >= 0 && n <= 9){
    const list = kitchenMenu();
    const i = n === 0 ? 9 : n - 1; // 0 tuşu = 10. ürün
    if (list[i]) makeProduct(list[i].id);
  }
});

$('#pauseBtn').addEventListener('click', pauseGame);
$('#settingsBtn').addEventListener('click', () => { if (!modalOpen()) showSettings(); });
$('#dailyBtn').addEventListener('click', () => {
  if (modalOpen()) return;
  if (dailyPending() && status !== 'running') showDaily();
  else toast(dailyPending() ? L('🎁 Günlük ödülünü dükkânı kapatınca alabilirsin', '🎁 You can claim your daily reward once the shop is closed') : L(`🎁 Bugünün ödülünü aldın (${S.streak} günlük seri). Yarın yine gel!`, `🎁 You already claimed today's reward (${S.streak}-day streak). Come back tomorrow!`));
});
$('#lgBadge').addEventListener('click', () => {
  const st = standings();
  if (!st || modalOpen()) return;
  const left = 7 - (S.day - 1) % 7;
  showModal(`<h2>${L(`🏆 Mahalle ligi · ${S.league.week}. hafta`, `🏆 Neighbourhood league · week ${S.league.week}`)}</h2>
    <p class="hint">${L('Bu hafta satış ve bahşiş toplamı. Pazar günü birinciye para, ünlülük ve kupa.', "This week's sales plus tips. On Sunday the winner gets cash, fame and a trophy.")} ${left > 1 ? L(`Pazara ${left - 1} gün var.`, `${left - 1} days to Sunday.`) : L('Bugün son gün!', 'Today is the last day!')}</p>
    <table>${st.map((x, i) => `<tr><td>${['🥇', '🥈', '🥉'][i] || (i + 1) + '.'} ${x.emoji} ${x.id === 'me' ? `<b>${x.name}</b>` : x.name}</td><td>₺${fmt(x.score)}</td></tr>`).join('')}</table>
    <p class="hint">${L('🏆 Toplam kupa', '🏆 Total trophies')}: ${S.lgWins || 0}</p>
    <button class="big" id="modalOk">${L('Tamam', 'OK')}</button>`);
});
// Telefon kilitlenince / başka uygulamaya geçince: duraklat ve kaydet
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ pauseGame(); save(); hiddenAt = Date.now(); appNotify(); return; }
  appNotifyCancel();
  const away = hiddenAt ? Date.now() - hiddenAt : 0;
  hiddenAt = 0;
  // Uzun süre arka planda kaldıysa kasayı göster (günlük ödül ondan sonra gelir)
  if (checkOffline(away)) return;
  // Uygulama gece yarısını geçip açık kaldıysa, dönüşte günlük ödülü göster
  if (S.owner && status === 'closed' && !modalOpen() && dailyPending()) showDaily();
});
window.addEventListener('pagehide', save);
// Oyun başka sekmede de açıksa son açılan kazanır: bu pencere durur, eski kayıtla üstüne yazmaz
// (storage olayı değil: yenilenirken kapanan sayfanın son kaydı yeni sayfayı yanlışlıkla kilitlerdi)
try {
  const tabs = new BroadcastChannel('cayocagi');
  tabs.onmessage = () => {
    if (stale) return;
    stale = true; status = 'closed';
    showModal(`<h2>${L('🍵 Oyun başka pencerede açık', '🍵 The game is open in another window')}</h2>
      <p>${L('İlerlemen karışmasın diye bu pencere durduruldu.', 'This window was paused so your progress does not get mixed up.')}</p>
      <button class="big" onclick="location.reload()">${L('Yeniden yükle', 'Reload')}</button>`);
  };
  tabs.postMessage('acildi');
} catch(e) {}
$('#editOwner').addEventListener('click', () => { if (!modalOpen()) openOwnerEditor(false); });
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (!b) return;
  setTab(b.dataset.tab);
  if (!desktopMQ.matches) toTop();
});

// ---------- Ana döngü ----------
let last = performance.now(), lastDraw = 0, steamIn = 0, frameErr = '';
// Tek bir karedeki hata oyunu dondurmasın: döngü sürer, oyuncu sebebi bir kez görür
function frame(ts){
  try { step(ts); }
  catch (err){
    console.error(err);
    const msg = String(err && err.message || err);
    if (msg !== frameErr){ frameErr = msg; announce({emoji:'⚠️', name:L('Bir hata oluştu', 'Something went wrong'), desc:msg.slice(0, 140)}); }
  }
  requestAnimationFrame(frame);
}
function step(ts){
  const dt = Math.min(0.1, (ts - last) / 1000); last = ts;
  // Dükkân büyüyünce / şube değişince / ekran dönünce sahnenin oranı değişir
  const vh = viewH(), view = W + '/' + vh;
  if (view !== sceneView){
    sceneView = view; const box = scene.parentElement;
    box.style.aspectRatio = `${W} / ${vh}`; box.style.setProperty('--ar', W / vh); fitCanvas(scene, g, W, vh);
  }
  if (S.pendingOff && !stale && !modalOpen()) showOffline();
  if (status === 'running' && !modalOpen()){
    tick(dt);
    steamIn -= dt;
    if (steamIn <= 0 && inProgress() && R.steamTop){ puff(245, R.steamTop); steamIn = 0.12; }
  }
  updateParticles(dt);
  // Oyun akmıyorsa ve efekt yoksa sahne saniyede 15 kez çizilir: menüde, karnede, duraklamada pil harcamasın
  const t = now(), still = (status !== 'running' || modalOpen()) && !particles.length && t - levelUpAt > 1 && !Object.values(tableBorn).some(b => t - b < 0.7);
  if (still && ts - lastDraw < 66) return;
  lastDraw = ts;
  if (use3d()){
    // 3D'de bir hata çizim döngüsünü durdurmasın: 2D'ye dön ve sebebini göster
    try { drawScene3D(); }
    catch (err){ console.error(err); drop3D(); announce({emoji:'⚠️', name:L("3D sahne hatası, 2D'ye dönüldü", '3D scene error, switched to 2D'), desc:note3d(err)}); drawScene(); }
  } else drawScene();
  drawPreview();
  drawAvatar();
}
fitCanvas(scene, g, W, H);
requestAnimationFrame(frame);
if (want3d) set3D(true, false);
// Arayüz: oyun akarken saniyede 10, durgunken 2,5 kez yenilenir (her tıklama zaten hemen yeniler)
let uiTick = 0;
setInterval(() => { if (!document.hidden && ((status === 'running' && !modalOpen()) || ++uiTick % 4 === 0)) renderUI(); }, 100);
renderUI();

if (!S.owner) openOwnerEditor(true);
else { const resumed = resumeDay(); if (!checkOffline(awayMs) && !resumed && dailyPending()) showDaily(); }
if (restored) toast(L('💾 Kayıt bozulmuştu, son yedekten geri yüklendi', '💾 Your save was damaged and was restored from the last backup'));
startSaveGuard();
</script>
</body>
