<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e140d">
<meta name="description" content="Mahalle çay ocağını devral, şehrin en ünlü mekânına dönüştür! Türk usulü dükkân işletme oyunu.">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Çay Ocağı">
<title>Çay Ocağı Tycoon</title>
<style>
/* Fredoka (SIL OFL, fonts/OFL.txt): oyunla birlikte gelir, çevrimdışı çalışır, dışarıya istek gitmez */
@font-face{font-family:Fredoka;font-style:normal;font-display:swap;font-weight:300 700;src:url(fonts/fredoka-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Fredoka;font-style:normal;font-display:swap;font-weight:300 700;src:url(fonts/fredoka-latin-ext.woff2) format('woff2');
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
/* Tema: sıcak çay renkleri, kalın koyu kontur (--ink), basılabilir düğmeler */
:root{--bg:#fbecd3;--panel:#fffaf1;--panel2:#f8e8cf;--text:#3a2214;--muted:#8b6a52;--accent:#e8672c;--good:#3aa64c;--bad:#d9423a;--line:#3a2214;
  --ink:#3a2214;--band:#f2a65a;--tea:#b8322a;--cream:#fff6e6;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  --hud:52px;--nav:60px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
button{touch-action:manipulation;font:inherit;color:inherit}

/* ---------- Üst bilgi çubuğu ---------- */
.hud{position:sticky;top:0;z-index:30;display:flex;gap:6px;align-items:center;justify-content:flex-end;
  min-height:calc(var(--hud) + var(--st));padding:calc(6px + var(--st)) calc(10px + var(--sr)) 8px calc(10px + var(--sl));
  background:#1e140d;border-bottom:2px solid var(--line)}
.brand{margin:0 auto 0 0;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stat{background:var(--panel);padding:6px 11px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap;border:0;font-variant-numeric:tabular-nums}
.stat.money{color:var(--accent)}
.icon-btn{background:var(--panel);border:0;border-radius:50%;width:36px;height:36px;font-size:17px;cursor:pointer;flex:none;padding:0}
.icon-btn:hover{background:var(--panel2)}
.daybar{position:absolute;left:0;right:0;bottom:-2px;height:4px;background:#0006}
.daybar>div{height:100%;background:var(--accent);transition:width .1s linear}
@media(max-width:620px){.brand{display:none}.stat.money{margin-right:auto}.stat{font-size:13px;padding:6px 9px}}
.stat.bump{animation:bumpA .4s}
@keyframes bumpA{40%{transform:scale(1.2);color:#fff}}
.stat.shake{animation:shakeA .4s}
/* R-3: büyük kombo yazısı ve sahne sarsıntısı */
#comboPop{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.4);pointer-events:none;z-index:6;opacity:0;white-space:nowrap;text-align:center;
  font:700 clamp(34px,10vw,68px)/1 Fredoka,system-ui,sans-serif;color:#ffd36b;-webkit-text-stroke:3px #3a2214;paint-order:stroke fill;text-shadow:0 5px 0 #3a2214}
#comboPop small{display:block;margin-top:4px;font-size:.38em;color:#fff6e6;-webkit-text-stroke:2px #3a2214}
#comboPop.go{animation:comboA 1.15s ease-out}
@keyframes comboA{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}30%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.scene.quake{animation:quakeA .35s}
@keyframes quakeA{20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}
@media (prefers-reduced-motion:reduce){.scene.quake{animation:none}}
@keyframes shakeA{25%{transform:translateX(-4px);color:var(--bad)}75%{transform:translateX(4px);color:var(--bad)}}

/* ---------- Yerleşim (telefon: tek sütun, sahne sabit, alt menü) ---------- */
main{padding-bottom:calc(var(--nav) + var(--sb) + 12px);transition:filter .6s}
.left,.right{display:contents}
.scene-sec{position:sticky;top:calc(var(--hud) + var(--st));z-index:20;background:var(--bg);padding:8px calc(8px + var(--sr)) 8px calc(8px + var(--sl))}
.scene{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#1a110b}
#scene{position:relative;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
#scene3d{position:absolute;inset:0;width:100%;height:100%;display:block}
#scene3d[hidden]{display:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0009;text-align:center;color:var(--muted);padding:10px}
.overlay[hidden]{display:none}
@media(max-width:999px){.overlay{gap:6px;font-size:14px}.overlay .big{padding:10px 20px;font-size:16px}}
#events{position:absolute;bottom:6px;left:6px;right:6px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;pointer-events:none}
.ev{background:#000a;border:1px solid var(--accent);border-radius:999px;padding:3px 9px;font-size:12px}
.ev small{color:var(--muted)}
.news{margin:0 0 10px;padding-left:2px;list-style:none;line-height:1.7}
.ev.fans{pointer-events:auto;cursor:pointer;color:#fff;font:inherit;font-size:13px;padding:6px 12px;background:#7a3fb8e6;border-color:#e08bff;animation:pulseA 1.2s infinite}
.panel{display:none;background:var(--panel);border-radius:14px;padding:14px;border:1px solid var(--line);margin:0 calc(8px + var(--sr)) 8px calc(8px + var(--sl))}
.panel.active{display:block}

#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#1e140d;border-top:2px solid var(--line);padding:0 var(--sr) var(--sb) var(--sl)}
.tab{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:var(--nav);
  background:none;border:0;font-size:22px;color:var(--muted);cursor:pointer;padding:0}
.tab span{font-size:11px;font-weight:700}
.tab.on{color:var(--accent)}
.tab.on::before{content:"";position:absolute;top:-2px;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{display:none;position:absolute;top:7px;left:calc(50% + 9px);width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid #1e140d}
.tab.has .badge{display:block}

/* Dikey telefon: sayfa değil içerik kayar (itch.io gibi scrolling="no" çerçevelerde de çalışsın) */
@media(max-width:999px) and (orientation:portrait){
  html,body{height:100%;overflow:hidden}
  body{display:flex;flex-direction:column}
  .hud{flex:none}
  main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .scene-sec{top:0}
  /* Sahne ekranın en fazla yarısı: ocak ve tepsi oyun sırasında görünür kalsın (--ar = genişlik/yükseklik) */
  .scene{max-width:calc(max(36dvh, 50dvh - var(--pextra, 0px)) * var(--ar, 1.78));margin:0 auto}
  body.running #p-mutfak h2{display:none}
  /* Oyun sırasında mutfak sıkışık: ürünler tek satırda, ocak ve tepsi sahnenin hemen altında */
  body.running #p-mutfak{padding:10px}
  /* 5 sütun; ürünler ilk satırdan uzunsa fazlası sahnenin sınırından düşülür (--pextra, renderUI) */
  body.running .products{grid-template-columns:repeat(5,1fr);gap:5px}
  body.running .prod{padding:5px 1px;gap:0}
  body.running .prod .em{font-size:22px}
  body.running .prod b{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  body.running .prod small{font-size:10px}
  body.running .products.many .prod small{display:none}
  /* 10'dan fazla ürün (geç oyun, şube ürünleri): yalnızca emoji, 7 sütun */
  body.running .products.lots{grid-template-columns:repeat(7,1fr);gap:4px}
  body.running .products.lots .prod{padding:6px 0}
  body.running .products.lots .prod b{display:none}
  body.running .quests{margin-bottom:6px}
  body.running .quest{padding:3px 6px 5px}
  body.running #p-mutfak .row{margin-top:8px}
}

/* Yatay telefon: sahne solda, panel sağda */
@media(max-width:999px) and (orientation:landscape) and (max-height:560px){
  :root{--hud:44px;--nav:46px}
  main{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:100%;padding:0;
    height:calc(100dvh - var(--hud) - var(--st) - var(--nav) - var(--sb))}
  .scene-sec{position:static;grid-column:1;grid-row:1;width:min(58vw,calc((100dvh - var(--hud) - var(--st) - var(--nav) - var(--sb) - 16px) * 16 / 9 + 16px))}
  .panel{grid-column:2;grid-row:1;margin:8px calc(8px + var(--sr)) 8px 0;overflow-y:auto}
  .panel .hint{display:none}
  .tab{flex-direction:row;gap:6px;font-size:18px}
  .tab span{font-size:13px}
  .badge{top:6px;left:calc(50% - 4px)}
}

/* Bilgisayar / tablet: iki sütun, mutfak hep görünür */
@media(min-width:1000px){
  /* Burada da sayfa değil içerik kayar: itch.io'nun scrolling="no" çerçevesinde fare tekerleği çalışsın */
  html,body{height:100%;overflow:hidden}
  body{display:flex;flex-direction:column}
  .hud{flex:none}
  main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
    display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px max(16px, calc((100% - 1268px) / 2));align-items:start}
  .left,.right{display:flex;flex-direction:column;gap:16px;min-width:0}
  .scene-sec{position:static;background:var(--panel);border-radius:14px;padding:14px;border:1px solid var(--line)}
  .panel{margin:0}
  #tabs{position:static;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:4px;gap:4px}
  .tab{height:auto;padding:9px 4px;flex-direction:row;gap:6px;font-size:18px;border-radius:10px}
  .tab span{font-size:14px}
  .tab.on{background:var(--panel2)}
  .tab.on::before{display:none}
  .tab[data-tab=mutfak]{display:none}
  .badge{position:static;margin-left:2px}
}

/* ---------- Ortak parçalar ---------- */
h2{margin:0 0 10px;font-size:16px;color:var(--accent)}
h2 small{color:var(--muted);font-weight:500}
h3{margin:14px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hint{color:var(--muted);font-size:13px;margin:-4px 0 10px}
.big{background:var(--accent);color:#2b1d14;border:0;border-radius:12px;padding:14px 26px;font-size:18px;font-weight:800;cursor:pointer}
.big:hover{filter:brightness(1.1)}
.btn2{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:700}
.btn2:hover{border-color:var(--accent)}
.btn2.danger{color:var(--bad)}
.item{font-size:22px;background:#0003;border-radius:8px;padding:2px 5px;display:inline-block}

/* Mutfak */
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
@media(max-width:999px){
  .products{grid-template-columns:repeat(3,1fr);gap:6px}
  .prod{padding:6px 2px;gap:0}
  .prod .em{font-size:24px}
  .prod b{font-size:13px}
  #p-mutfak{padding:10px 12px}
  #p-mutfak h2{display:none}  /* alt menüde zaten yazıyor */
  #p-mutfak .row{margin-top:8px}
  #p-mutfak h3{margin:4px 0 6px}
  .products.many{grid-template-columns:repeat(4,1fr);gap:5px}
  .products.many .prod{padding:5px 1px;border-radius:10px}
  .products.many .em{font-size:22px}
  .products.many b{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .products.many .pt{display:none}
}
.prod{position:relative;background:var(--panel2);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit}
.prod:hover{border-color:var(--accent)}
.prod:active{transform:scale(.94)}
.prod.full{opacity:.45}
.prod .em{font-size:30px;line-height:1.1}
.prod b{font-size:14px}
.prod small{color:var(--muted);font-size:12px}
.prod .up{color:var(--good);font-weight:700}
.prod kbd{position:absolute;top:4px;left:6px;font-size:11px;color:var(--muted)}
@media(hover:none){.prod kbd{display:none}}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.row>div{flex:1;min-width:140px}
.slots{display:flex;gap:6px;flex-wrap:wrap;min-height:46px;background:#0002;border-radius:10px;padding:6px}
.chip{position:relative;background:var(--panel2);border-radius:8px;padding:4px 8px;font-size:22px;overflow:hidden}
.chip .who{font-size:12px;position:absolute;top:0;right:2px}
.chip .prog{position:absolute;left:0;bottom:0;height:4px;background:var(--accent)}
.tray .item{cursor:pointer}
.tray .slot{width:38px;height:36px;border:2px dashed var(--line);border-radius:8px}

/* Mağaza & Menü */
.shop-item{display:flex;align-items:center;gap:10px;padding:8px;background:var(--panel2);border-radius:10px;margin-bottom:6px;border:2px solid transparent}
.shop-item.hl{border-color:var(--accent)}
.shop-item .em{font-size:26px;width:34px;text-align:center;flex:none}
.shop-item .info{flex:1;min-width:0}
.shop-item small{display:block;color:var(--muted);font-size:12px}
.lvl{color:var(--accent);font-size:12px}
.rs{color:#ffc94a;letter-spacing:1px}
.rs i{font-style:normal;color:#ffffff26}
.shop-item button{background:var(--accent);color:#2b1d14;border:0;border-radius:8px;padding:10px 10px;cursor:pointer;min-width:76px;font:inherit;font-weight:800;flex:none}
.shop-item button:disabled{background:#0004;color:var(--muted);cursor:not-allowed}
.shop-item .tag{color:var(--good);font-weight:800;font-size:13px;flex:none}
.shop-item.cur{border-color:var(--good)}
.tab[hidden]{display:none}

/* Şubeler */
.net{background:#0002;border-radius:10px;padding:10px 12px;margin-bottom:6px}
.net b{color:var(--accent)}
.net .pbar{height:6px;background:#0004;border-radius:3px;margin-top:6px;overflow:hidden}
.net .pbar div{height:100%;background:var(--accent)}
.shop-item .loc{color:var(--good);font-weight:700}
.shop-item.flash{animation:flashA 1.2s}
.shop-item.warn{border-color:var(--accent)}
.shop-item.crisis{border-color:var(--bad);animation:crisisA 1.4s infinite}
@keyframes crisisA{50%{box-shadow:0 0 0 3px #e05a4f55}}
.hbar{display:block;height:5px;background:#0004;border-radius:3px;margin-top:5px;overflow:hidden;max-width:180px}
.hbar i{display:block;height:100%;background:var(--good)}
.hbar.mid i{background:var(--accent)}
.hbar.low i{background:var(--bad)}
.shop-item:has(.trouble){flex-wrap:wrap}
.trouble{flex-basis:100%;display:flex;align-items:center;gap:8px;background:#0003;border-radius:8px;padding:6px 8px;font-size:13px;color:var(--text)}
.trouble span{flex:1;min-width:0}
.shop-item .trouble .fix{padding:8px 10px;min-width:0;font-size:13px}
.shop-item.crisis .fix:not(:disabled){background:var(--bad);color:#fff}
.banner.bad{background:#e05a4f22;border-color:var(--bad)}
.news{background:#0002;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13px;line-height:1.6}
.wmap .own.bad circle:not(.hit){fill:var(--bad);animation:pinA 1s infinite}
@keyframes flashA{30%{border-color:var(--accent);background:#e8a23a33}}
.wmap{display:block;width:100%;height:auto;background:#1a2a36;border-radius:12px;margin:8px 0 2px;border:1px solid var(--line)}
.wmap .land path{fill:#4d3a2a;stroke:#4d3a2a;stroke-width:4;stroke-linejoin:round}
.wmap .arc{fill:none;stroke:var(--accent);stroke-width:1.2;stroke-dasharray:3 2;opacity:.85}
.wmap .pin{cursor:pointer}
.wmap .pin .hit{fill:transparent}
.wmap .pin circle:not(.hit){stroke:#1a2a36;stroke-width:1.2}
.wmap .pin text{font:700 7px system-ui,sans-serif;fill:#f6ead8;text-anchor:middle;paint-order:stroke;stroke:#1a2a36;stroke-width:2px}
.wmap .own circle:not(.hit){fill:var(--accent)}
.wmap .can circle:not(.hit){fill:var(--good);animation:pinA 1.2s infinite}
.wmap .lock circle:not(.hit){fill:#7d6a5a}
.wmap .lock text{fill:#a8957f}
/* K-1: Usta kartları */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px;margin-top:10px}
.cards.one{grid-template-columns:minmax(0,170px);justify-content:center}
.ucard{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 4px 8px;text-align:center;background:var(--cream);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.ucard.r{background:linear-gradient(#d4e8ff,#f3f9ff)}
.ucard.e{background:linear-gradient(#ffd770,#fff6d6)}
.ucard .urar{position:absolute;top:-10px;left:50%;transform:translateX(-50%);padding:0 7px;font-size:10px;font-weight:700;color:#fff;background:#8a6a4a;border:2px solid var(--ink);border-radius:999px;white-space:nowrap}
.ucard.r .urar{background:#2e6fa8}
.ucard.e .urar{background:#d38a00}
.uem{font-size:34px;line-height:1.15}
.ucard b{font-size:12px;line-height:1.15}
.ust{color:#f2a01e;font-size:11px;letter-spacing:1px}
.ust i{font-style:normal;color:#3a221430}
.ucard small{font-size:10.5px;color:var(--muted);line-height:1.2}
.ucard.off{opacity:.5;filter:grayscale(1);cursor:default}
.ucard.on{outline:3px solid var(--good);outline-offset:2px}
.utag{position:absolute;top:6px;right:4px;padding:0 5px;font-size:9px;font-weight:700;color:#fff;background:var(--bad);border-radius:6px}
.cards.pack{margin-bottom:14px}
.cards.pack .ucard{animation:cardIn .5s both}
@keyframes cardIn{from{transform:rotateY(90deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.packrow{display:flex;gap:8px;margin:6px 0 4px}
.packrow>*{flex:1;margin:0}
/* H-1: kişili harita balonları */
.mapw{position:relative}
.mapw .wmap{margin:8px 0 2px}
.trmap .pin text{font-size:9px}
.mb{position:absolute;transform:translate(-50%,-22px);display:flex;flex-direction:column;align-items:center;gap:1px;padding:0;background:none;border:0;font:inherit;cursor:pointer;z-index:1}
.mb.here{z-index:2}
.mbp{position:relative;width:40px;height:40px;border-radius:50%;background:#fff3d9;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);overflow:visible}
.mbp canvas{width:100%;height:100%;border-radius:50%;pointer-events:none;display:block}
.mbp .tlv{position:absolute;right:-7px;top:-6px;min-width:17px;height:17px;padding:0 3px;font-size:10px;line-height:13px;font-weight:700;color:#fff;background:var(--tea);border:2px solid var(--ink);border-radius:999px}
.mb.here .mbp{background:#ffd36b}
.mb.bad .mbp{border-color:var(--bad);animation:pinA 1s infinite}
.mba{position:absolute;left:-6px;top:-6px;width:17px;height:17px;border-radius:50%;background:var(--bad);color:#fff;font:700 12px/17px system-ui;font-style:normal;border:2px solid var(--ink)}
.mbt{margin-top:2px;padding:0 6px;font-size:10.5px;font-weight:700;white-space:nowrap;color:var(--ink);background:#ffd36b;border:2px solid var(--ink);border-radius:6px}
.mbi{font-size:9.5px;font-weight:700;white-space:nowrap;color:#d8f5c8;text-shadow:0 1px 0 #1a2a36,0 0 3px #1a2a36}
@keyframes pinA{50%{opacity:.35}}

/* Ünlülük & röportaj */
#pFame{font-size:12px;color:#e8c6ff;margin-top:3px;font-weight:700}
#pFame .fbar{display:block;height:5px;background:#0004;border-radius:3px;margin-top:3px;overflow:hidden}
#pFame .fbar i{display:block;height:100%;background:linear-gradient(90deg,#b36bff,#ffc94a)}
.iv-q{font-size:18px;font-weight:700;margin:6px 0 14px}
.ans{display:block;width:100%;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:15px;line-height:1.35}
.ans:hover,.ans:active{border-color:var(--accent)}
.choice{background:var(--panel2);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.choice small{display:block;color:var(--muted);font-size:13px}
.cover{display:block;width:100%;max-width:300px;margin:0 auto 10px;border-radius:6px;box-shadow:0 8px 24px #000a}

/* Eşyalarım */
.profile{display:flex;align-items:center;gap:12px;background:var(--panel2);border-radius:12px;padding:8px 12px}
#avatar{width:64px;height:80px;border-radius:10px;background:#d8c3a0;flex:none}
.profile .info{flex:1;min-width:0}
.profile small{display:block;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.kv div{background:#0002;border-radius:10px;padding:8px 10px}
.kv small{display:block;color:var(--muted);font-size:12px}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.inv-card{background:var(--panel2);border-radius:12px;padding:10px 6px;text-align:center;border:1px solid var(--line)}
.inv-card .em{font-size:28px}
.inv-card b{display:block;font-size:13px}
.inv-card small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.inv-card .dots{color:var(--accent);font-size:10px;letter-spacing:1px}
.inv-card.off{opacity:.4}

/* Öğretici & ayarlar */
.coach{background:#e8a23a22;border:1px dashed var(--accent);border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:14px;font-weight:600}
.coach[hidden]{display:none}
.prod.pulse{border-color:var(--good);animation:pulseA 1s infinite}
.quests{display:flex;gap:6px;margin-bottom:10px}
.quests:empty{display:none}
.quest{position:relative;flex:1;min-width:0;background:#0003;border:1px solid var(--line);border-radius:10px;padding:5px 8px 7px;overflow:hidden;font-size:12px}
.quest span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quest b{font-size:14px;font-variant-numeric:tabular-nums}
.quest i{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .3s}
.quest.done{border-color:var(--good);background:#6cc07022}
.quest.done b{color:var(--good)}
.quest.done i{background:var(--good)}
.quest.fail{opacity:.5}
.evbar{position:relative;background:linear-gradient(90deg,#c0392b33,#e8a33a22);border:1px solid #e8a33a66;border-radius:10px;padding:6px 10px 8px;margin-bottom:10px;font-size:13px;overflow:hidden}
.evbar:empty{display:none}
.evbar small{display:block;color:var(--muted);font-size:12px}
.evbar i{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .3s}
.evbar.soon{background:#0003;border-color:var(--line)}
.quest.fail b{color:var(--bad)}
/* Dükkân kapalıyken görevler tam metinle, alt alta */
body:not(.running) .quests{flex-direction:column;gap:4px}
body:not(.running) .quest span{white-space:normal;color:var(--text)}
body:not(.running) .quest b{display:none}
body:not(.running) .quest.done b{display:inline}
.qhead{font-weight:800;color:var(--accent);font-size:13px}
@keyframes pulseA{50%{box-shadow:0 0 0 5px #6cc07055}}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row .btn2{min-width:96px}
.icon-btn[hidden]{display:none}
body.veteran .newbie{display:none}

/* Gün sonu, günlük ödül, başarımlar */
.stars{font-size:34px;text-align:center;letter-spacing:4px;margin:-4px 0 6px}
.stars span{filter:grayscale(1);opacity:.3}
.banner{background:#e8a23a22;border:1px solid var(--accent);border-radius:10px;padding:8px 10px;text-align:center;font-weight:700;margin:6px 0}
.streak{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0}
.streak div{background:var(--panel2);border-radius:8px;padding:6px 0;text-align:center;font-size:11px;color:var(--muted);border:2px solid transparent}
.streak div b{display:block;font-size:18px}
.streak .got{background:#6cc07033;color:var(--text)}
.streak .today{border-color:var(--accent);color:var(--text);animation:pulseA 1s infinite}
.reward{text-align:center;font-size:30px;font-weight:900;color:var(--accent);margin:4px 0 12px}
.ach{display:flex;gap:10px;align-items:center;padding:8px 10px;background:var(--panel2);border-radius:10px;margin-bottom:6px;border:1px solid transparent}
.ach.done{border-color:var(--good)}
.ach .em{font-size:24px;width:30px;text-align:center;flex:none}
.ach .info{flex:1;min-width:0}
.ach small{display:block;color:var(--muted);font-size:12px}
.ach .pbar{height:5px;background:#0004;border-radius:3px;margin-top:5px;overflow:hidden}
.ach .pbar div{height:100%;background:var(--accent)}
.ach.done .pbar div{background:var(--good)}
.ach .rw{font-weight:800;font-size:13px;color:var(--accent);flex:none}
.ach.done .rw{color:var(--good)}

/* ---------- Bildirimler & pencereler ---------- */
#toast{position:fixed;bottom:calc(var(--nav) + var(--sb) + 14px);left:50%;transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:calc(100vw - 32px);text-align:center}
@media(min-width:1000px){#toast{bottom:24px}}
#toast.show{opacity:1}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;
  padding:calc(16px + var(--st)) calc(16px + var(--sr)) calc(16px + var(--sb)) calc(16px + var(--sl));z-index:40;overflow:auto}
.modal.show{display:flex}
.modal .box{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:20px;max-width:440px;width:100%;margin:auto}
.modal .box.wide{max-width:600px}
.modal h2{font-size:22px}
.modal table{width:100%;border-collapse:collapse;margin:10px 0 16px}
.modal td{padding:5px 0;border-bottom:1px solid var(--line)}
.modal td:last-child{text-align:right;font-weight:700}
.modal ol{padding-left:20px;line-height:1.6}
.modal .big{width:100%}
.btns{display:flex;gap:8px;margin-top:10px}
.btns>*{flex:1}
.editor{display:grid;grid-template-columns:170px 1fr;gap:18px;margin-bottom:16px}
@media(max-width:540px){.editor{grid-template-columns:1fr;justify-items:center}}
#preview{width:170px;height:212px;border-radius:12px;background:var(--panel2)}
.field{margin-bottom:10px;width:100%}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;font-size:16px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:32px;height:32px;border-radius:50%;border:2px solid #0006;cursor:pointer;padding:0}
.sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.sw button.txt{width:auto;border-radius:8px;padding:0 10px;background:var(--panel2);color:var(--text);font:inherit;font-size:13px}
#eventCard{position:fixed;top:calc(var(--hud) + var(--st) + 10px);left:50%;transform:translate(-50%,-340px);background:var(--panel);border:2px solid var(--accent);border-radius:14px;padding:12px 18px;z-index:55;display:flex;gap:12px;align-items:center;width:max-content;max-width:min(420px,calc(100vw - 32px));box-shadow:0 8px 30px #000a;transition:transform .45s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
#eventCard.show{transform:translate(-50%,0)}
#eventCard .em{font-size:40px}
#eventCard small{display:block;color:var(--muted);margin-top:2px}
body.blackout main{filter:brightness(.55) saturate(.7)}

/* =====================================================================
   TEMA KATMANI (UI-1): açık sıcak zemin, koyu kalın kontur, alt gölgeli "basılabilir" parçalar.
   Yukarıdaki yerleşim kuralları aynen kalır; burada yalnızca görünüm ezilir.
   ===================================================================== */
body{font-family:Fredoka,"Segoe UI Rounded",system-ui,sans-serif;font-weight:500;background:var(--bg)}
b,strong,h1,h2,h3,button{font-weight:700}
h2{color:var(--tea)}
h3{color:var(--muted)}

/* Üst çubuk: turuncu bant, altında kalın koyu çizgi */
.hud{background:var(--band);border-bottom:4px solid var(--ink);box-shadow:0 3px 0 #0002;gap:8px}
.brand{color:#fff;text-shadow:0 2px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink),0 -1px 0 var(--ink)}
.daybar{bottom:-4px;height:4px;background:#0003}
.daybar>div{background:#fff3c4}
/* Kaynak kutuları: koyu hap, solda taşan ikon, altında küçük etiket */
.res{position:relative;display:flex;flex-direction:column;justify-content:center;min-width:0;height:34px;padding:0 10px 0 26px;margin-left:14px;
  background:var(--ink);color:#fff;border:2.5px solid var(--ink);border-radius:999px;box-shadow:inset 0 -3px 0 #0006;white-space:nowrap}
.res b{font-size:14px;line-height:1;font-variant-numeric:tabular-nums}
.res small{font-size:9.5px;color:#ffd36b;line-height:1.1}
.res small:empty{display:none}
.res .ri{position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:32px;height:32px;display:grid;place-items:center;font-size:17px;
  background:var(--cream);border:2.5px solid var(--ink);border-radius:50%;box-shadow:0 2px 0 var(--ink)}
.res.money b{color:#ffe08a}
.res .rbar{display:block;height:5px;margin-top:3px;background:#ffffff33;border-radius:3px;overflow:hidden;width:40px}
.res .rbar i{display:block;height:100%;background:var(--good);border-radius:3px}
.res .bump{animation:bumpA .4s}
.res .shake{animation:shakeA .4s}
.icon-btn{background:var(--cream);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);width:36px;height:36px}
.icon-btn:hover{background:#fff}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
@media(max-width:620px){.res{padding:0 8px 0 22px;margin-left:12px}.res b{font-size:13px}.res .ri{width:28px;height:28px;font-size:15px;left:-12px}
  .hud{gap:4px;justify-content:space-between}.res .rbar{width:32px}}

/* ---------- UI-2: sahnede yüzen düğmeler ve lig rozeti ---------- */
.fabs{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:8px;z-index:3}
.fab{position:relative;width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:20px;cursor:pointer;
  background:var(--cream);border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink)}
.fab[hidden]{display:none}
.fab:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.fab .dot{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--bad);border:2.5px solid var(--ink)}
.fab .dot[hidden]{display:none}
.lgbadge{position:absolute;left:8px;bottom:8px;z-index:3;display:flex;align-items:center;gap:4px;padding:3px 10px 3px 4px;cursor:pointer;
  background:linear-gradient(#ffd36b,#f2a65a);border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);color:var(--ink)}
.lgbadge[hidden]{display:none}
.lgbadge .lgc{font-size:20px}
.lgbadge b{font-size:16px}
.lgbadge small{font-size:10px;font-weight:700;letter-spacing:.05em}
.lgbadge.lead{background:linear-gradient(#fff3a0,#ffc94a)}
.lgbadge:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
/* Kapalı dükkân katmanı düğmelerin altında kalmasın diye düğmeler üstte, katman ortada */
.overlay{z-index:2}
#events{z-index:3;left:auto;right:58px}
@media(max-width:999px){.fab{width:38px;height:38px;font-size:18px}.fabs{gap:6px;top:6px;right:6px}#events{right:50px}}

/* ---------- UI-2: alt menü, ortada büyük Dükkân düğmesi ---------- */
@media(max-width:999px) and (orientation:portrait){
  :root{--nav:64px}
  #tabs{align-items:flex-end;overflow:visible}
  .tab{font-size:24px;height:var(--nav);border-radius:0}
  .tab span{font-size:11px;margin-top:2px}
  .tab.on{background:#ffe2c2}
  .tab.on::before{display:none}
  /* Ortadaki düğme menünün üstüne taşar */
  .tab.hub{flex:1.2;overflow:visible;justify-content:flex-end;padding-bottom:6px;background:none}
  .tab.hub .hubc{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:66px;height:66px;display:grid;place-items:center;
    font-size:34px;background:radial-gradient(circle at 50% 35%,#ff9b5e,var(--accent));border:4px solid var(--ink);border-radius:50%;box-shadow:0 5px 0 var(--ink)}
  .tab.hub span{position:relative;z-index:1;font-size:12px;color:#fff;text-shadow:0 1.5px 0 var(--ink),1.5px 0 0 var(--ink),-1.5px 0 0 var(--ink),0 -1.5px 0 var(--ink)}
  .tab.hub.on .hubc{background:radial-gradient(circle at 50% 35%,#ffc28f,#ff7a3d);box-shadow:0 5px 0 var(--ink),0 0 0 4px #ffd36b88}
  .tab.hub:active .hubc{transform:translate(-50%,3px);box-shadow:0 2px 0 var(--ink)}
  /* Sahne düğme ve menü için biraz yer bıraksın */
  main{padding-bottom:calc(var(--nav) + var(--sb) + 20px)}
}
/* ---------- UI-3: Eşyalarım alt sekmeleri, albüm, müdavim kartları, kupa rafı ---------- */
.seg{display:flex;gap:6px;margin:4px 0 12px}
.seg button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;font-size:20px;cursor:pointer;
  background:var(--cream);border:2.5px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);color:var(--muted)}
.seg button span{font-size:11px}
.seg button.on{background:var(--accent);color:#fff;text-shadow:0 1px 0 var(--ink)}
.seg button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
/* İlerleme hapı: koyu zemin, yeşil dolgu, ortada yazı */
.pb{position:relative;display:block;height:16px;background:var(--ink);border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.pb i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#7fd36f,var(--good));border-radius:999px}
.pb em{position:relative;display:block;font-style:normal;font-size:10.5px;font-weight:700;line-height:12px;color:#fff;text-align:center;text-shadow:0 1px 0 #0008}
.album-head,.rhead{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:10px;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);
  background:linear-gradient(135deg,#ffcf8a,#f2a65a)}
.album-head .ah-em{font-size:40px}
.album-head .ah-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.album-head small{color:var(--ink);font-size:12px}
.rhead{justify-content:space-between;font-size:16px}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.aset{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 8px;cursor:pointer;font:inherit;color:var(--ink);
  background:var(--cream);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink)}
.aset .ae{font-size:38px;line-height:1.1}
.aset .rib{margin-top:-4px;padding:2px 6px;font-size:11.5px;font-weight:700;background:#ffd36b;border:2px solid var(--ink);border-radius:6px;line-height:1.2;text-align:center}
.aset .pb{width:100%}
.aset.done{background:#e3f4dc}
.aset.sel{outline:3px solid var(--accent);outline-offset:2px}
.aset:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.aset-detail{margin-top:12px}
.rfeat{display:flex;gap:12px;align-items:center;padding:10px;margin-bottom:10px;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);background:var(--cream)}
.rfeat .port{width:84px;flex:none}
.rf-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.rf-info .tag{align-self:flex-start;padding:1px 8px;font-size:10px;font-weight:700;color:#fff;background:var(--tea);border:2px solid var(--ink);border-radius:6px}
.rf-info small{color:var(--muted);font-size:12px}
.tier-h{display:inline-block;margin:10px 0 8px;padding:3px 14px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 0 var(--ink);
  border:2.5px solid var(--ink);border-radius:8px;box-shadow:0 3px 0 var(--ink);transform:skew(-8deg)}
.tier-h.t1,.rcard.t1 .rname{background:#3aa64c}
.tier-h.t2,.rcard.t2 .rname{background:#2e86c1}
.tier-h.t3,.rcard.t3 .rname{background:#8e44ad}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 5px 6px;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink)}
.rcard.t1,.rfeat.t1{background:#cdeec3}
.rcard.t2,.rfeat.t2{background:#cfe5f6}
.rcard.t3,.rfeat.t3{background:#e6d3f1}
.port{display:block;width:100%;aspect-ratio:64/80;border-radius:10px;background:#fff8ec;border:2px solid var(--ink)}
.rcard .rname{width:calc(100% + 6px);margin-top:-12px;padding:1px 2px;font-size:10.5px;font-weight:700;color:#fff;text-align:center;text-shadow:0 1px 0 var(--ink);
  border:2px solid var(--ink);border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .pb{width:100%;height:14px}
.rcard .pb em{font-size:9.5px;line-height:10px}
.rcard small{font-size:9.5px;color:var(--muted);text-align:center;line-height:1.2}
.rcard.locked{filter:saturate(.5)}
.rcard .lock{position:absolute;top:-8px;right:-6px;font-size:18px;filter:drop-shadow(0 2px 0 var(--ink))}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;margin-bottom:10px;border:3px solid var(--ink);border-radius:16px;
  background:linear-gradient(#8a5a35 0 6px,#fff6e6 6px);box-shadow:0 4px 0 var(--ink)}
.cup{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;text-align:center}
.cup .ce{font-size:30px;filter:drop-shadow(0 3px 0 #3a221455)}
.cup i{position:absolute;top:0;right:4px;font-style:normal;font-size:11px;font-weight:700;color:#fff;background:var(--tea);border:2px solid var(--ink);border-radius:999px;padding:0 5px}
.cup small{font-size:10px;line-height:1.15;color:var(--ink)}
.cup.off{opacity:.35;filter:grayscale(1)}
@media(min-width:1000px){.rgrid{grid-template-columns:repeat(4,1fr)}}

/* ---------- UI-5: vektör ikonlar (svg <use>) ---------- */
.ic{width:1.15em;height:1.15em;display:inline-block;vertical-align:middle;flex:none;overflow:visible}
.res .ri .ic{width:22px;height:22px}
.fab .ic{width:27px;height:27px}
.tab .ic{width:28px;height:28px;filter:drop-shadow(0 2px 0 #3a221433)}
.tab:not(.on):not(.hub) .ic{opacity:.85}
.tab.hub .hubc .ic{width:42px;height:42px}
.seg .ic{width:24px;height:24px}
.lgbadge .lgc .ic{width:24px;height:24px}
@media(max-width:620px){.res .ri .ic{width:19px;height:19px}}
@media(min-width:1000px){.tab .ic{width:22px;height:22px}}

/* ---------- E-1: Dükkânlarım ekip ağacı ---------- */
.treewrap{overflow-x:auto;margin:0 -6px 14px;padding:8px 6px 12px;-webkit-overflow-scrolling:touch}
.tree{display:inline-block;min-width:100%}
.tree ul{display:flex;justify-content:center;margin:0;padding:18px 0 0;position:relative}
.tree>ul{padding-top:0}
.tree li{list-style:none;position:relative;padding:18px 3px 0;display:flex;flex-direction:column;align-items:center}
.tree>ul>li{padding-top:0}
.tree li::before,.tree li::after{content:'';position:absolute;top:0;right:50%;width:50%;height:18px;border-top:3px solid var(--ink)}
.tree li::after{right:auto;left:50%;border-left:3px solid var(--ink)}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:3px solid var(--ink);border-radius:0 10px 0 0}
.tree li:first-child::after{border-radius:10px 0 0 0}
.tree li:only-child::before{display:none}
.tree li:only-child::after{border-top:0;border-radius:0}
.tree ul ul::before{content:'';position:absolute;top:0;left:50%;height:18px;border-left:3px solid var(--ink);margin-left:-1.5px}
.tree>ul>li::before,.tree>ul>li::after{display:none}
.toprow{position:relative}
.tn{position:relative;display:flex;flex-direction:column;align-items:center;width:72px;cursor:pointer;text-align:center}
.tn .sport{width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);background:#fff8ec}
.tn:active .sport{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tn.usta .sport{width:68px;height:68px;background:#ffe9b0}
.tn.head .sport{background:#ffd9c7}
.tn.cirak .sport{background:#d6f2e2}
.tn.garson .sport{background:#d5e8fa}
.tn.sag{position:absolute;left:100%;top:8px;margin-left:6px}
.tn.sag .sport{background:#e6d3f1;border-style:dashed}
.tn .tlv{position:absolute;top:-6px;left:6px;z-index:1;min-width:20px;padding:0 5px;font-size:11px;font-weight:700;color:#fff;background:var(--tea);border:2px solid var(--ink);border-radius:999px}
.tn b{font-size:12px;line-height:1.1;margin-top:4px;white-space:nowrap;max-width:78px;overflow:hidden;text-overflow:ellipsis}
.tn small{font-size:10px;color:var(--muted);line-height:1.15}
.tn i{font-style:normal;font-size:10.5px;font-weight:700;color:var(--good);line-height:1.2}

/* E-2: geliştirilebilir kişi işareti ve kapalı ana düğme */
.tn.can::after{content:'⬆';position:absolute;top:-6px;right:6px;width:20px;height:20px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--good);border:2px solid var(--ink);border-radius:50%}
.big:disabled{background:#e8dcc9;color:#9a8270;text-shadow:none;box-shadow:0 2px 0 #3a221455;cursor:not-allowed;transform:none}

/* E-3: Ekip açıkken (dükkân kapalı) telefonda sahne gizlenir, ağaç tam ekran; orta düğme rozeti */
@media(max-width:999px){body.tab-ekip:not(.running) .scene-sec{display:none}}
.tab.hub .badge{top:-30px;left:calc(50% + 20px);z-index:2}

/* M-1: Mahalle binaları */
.hood{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.hb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;text-align:center;background:var(--cream);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink)}
.hb .he{font-size:42px;line-height:1.1}
.hb .rib{margin-top:-6px;padding:2px 10px;font-size:13px;font-weight:700;background:#ffd36b;border:2px solid var(--ink);border-radius:6px}
.hb .hstars{color:#f2a01e;letter-spacing:1px;font-size:14px}
.hb .hstars i{font-style:normal;color:#3a221430}
.hb small{font-size:11.5px;color:var(--muted);line-height:1.25;min-height:2.5em}
.hb button{width:100%;padding:8px 6px;border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);background:var(--good);color:#fff;font:inherit;font-weight:700;text-shadow:0 1px 0 var(--ink);cursor:pointer}
.hb button:disabled{background:#e8dcc9;color:#9a8270;text-shadow:none;box-shadow:0 2px 0 #3a221455;border-color:#3a221466;cursor:not-allowed}
.hb button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.hb.built{background:#e3f4dc}
.hb.locked .he{filter:grayscale(1);opacity:.45}
.lockb{padding:5px 10px;font-size:11.5px;font-weight:700;color:#fff;background:var(--ink);border-radius:999px}
.lockb.max{background:var(--good)}

/* M-2: 3D mahalle maketi */
.hood3d{position:relative;height:250px;margin:0 0 12px;border:3px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 4px 0 var(--ink);background:#bfe3f2}
#hood3d{display:block;width:100%;height:100%;cursor:pointer;touch-action:manipulation}
.hb.flash{animation:flashA 1.2s}

/* Yatay telefon ve bilgisayar: orta düğme sıradan sekme gibi */
@media not all and (max-width:999px) and (orientation:portrait){
  .tab.hub .hubc{font-size:inherit;font-weight:400}
}

/* Paneller ve pencereler: beyaz kart, kalın kontur, alt gölge */
.panel{background:var(--panel);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink)}
.scene{border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink)}
.scene-sec{background:var(--bg)}
.modal{background:#3a2214b3}
.modal .box{background:var(--panel);border:4px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink)}
.modal td{border-bottom:2px dashed #3a221426}
@media(min-width:1000px){.scene-sec{background:var(--panel);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)}}

/* Düğmeler: renkli, koyu kontur, alt gölge; basınca çöker */
.big,.shop-item button,.btn2,.ans,.sw button.txt{border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.big{background:var(--accent);color:#fff;text-shadow:0 2px 0 var(--ink);border-radius:16px}
.big:active,.shop-item button:active,.btn2:active,.ans:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn2{background:var(--cream);color:var(--text);border-radius:12px}
.btn2:hover{border-color:var(--ink);background:#fff}
.btn2.danger{background:#ffe1dc;color:var(--bad)}
.shop-item button{background:var(--good);color:#fff;text-shadow:0 1px 0 var(--ink);border-radius:12px}
.shop-item button:disabled{background:#e8dcc9;color:#9a8270;text-shadow:none;box-shadow:0 2px 0 #3a221455;border-color:#3a221466;transform:none}
.ans{background:var(--cream)}
.ans:hover{border-color:var(--accent)}

/* Kartlar ve kutular */
.shop-item,.ach,.inv-card,.choice,.net,.kv div,.profile{background:var(--cream);border:2.5px solid var(--ink);border-radius:14px}
.shop-item{box-shadow:0 3px 0 #3a221433}
.shop-item.hl,.shop-item.warn{border-color:var(--accent);box-shadow:0 3px 0 var(--accent)}
.shop-item.cur,.ach.done{border-color:var(--good);box-shadow:0 3px 0 var(--good)}
.inv-card.off{opacity:.5}
.prod{background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:14px}
.prod:hover{border-color:var(--ink);background:#fffdf7}
.prod:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.prod.pulse{border-color:var(--good)}
.slots{background:#3a221414;border:2px dashed #3a221440}
.chip{background:#fff;border:2px solid var(--ink)}
.tray .slot{border-color:#3a221455}
.quest,.evbar{border:2.5px solid var(--ink);border-radius:12px;background:var(--cream)}
.evbar{background:linear-gradient(90deg,#ffe2c2,#fff3dc)}
.evbar.soon{background:var(--cream)}
.quest.done{background:#e3f4dc;border-color:var(--good)}
.coach{background:#fff1c9;border:2.5px dashed var(--accent)}
.banner{background:#fff1c9;border:2.5px solid var(--ink);border-radius:12px}
.banner.bad{background:#ffe1dc;border-color:var(--bad)}
.news{background:#3a22140f}
.field input{background:#fff;border:2.5px solid var(--ink);color:var(--text)}
.rs i{color:#3a221430}
#pFame{color:#7a3fb8}
#pFame .fbar,.ach .pbar,.net .pbar,.hbar{background:#3a22141f}
.streak div{background:var(--cream);border:2.5px solid #3a221440}
.streak .today{border-color:var(--accent)}

/* Sahnenin üstündeki yazılar koyu zemin üzerinde kalır */
.overlay{color:#fff3e0;background:#2a1a10a6}
.overlay .big{font-size:19px}
.ev{color:#fff;border:2px solid #fff;background:#3a2214d9}
#toast{color:#fff;background:#3a2214f0;border:2.5px solid #fff3e0;font-weight:600}
#eventCard{border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink)}

/* Alt menü (UI-2'de yeniden tasarlanacak): krem zemin, koyu üst çizgi */
#tabs{background:var(--cream);border-top:4px solid var(--ink)}
.tab{color:var(--muted)}
.tab.on{color:var(--tea)}
.tab.on::before{background:var(--tea)}
.badge{border-color:var(--cream)}
@media(min-width:1000px){#tabs{border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)}.tab.on{background:#ffe2c2}}
</style>
</head>

const ANTIQUE_DAY = 3;
const owned = id => !!(S.col || {})[id];
const setDone = s => s.items.every(it => owned(it.id));
// Bonus türleri: tip (bahşiş), pat (sabır), fame (ünlülük), off (sen yokken kasası)
const colBonus = type => COL_SETS.filter(s => s.bonus === type)
  .reduce((b, s) => b + s.items.filter(it => owned(it.id)).length * s.per + (setDone(s) ? s.full : 0), 0);
// Antikacı vitrini: her oyun günü 3 parça; henüz alınmamış en ucuz 6 parçadan güne göre seçilir
function antiqueStock(){
  const pool = COL_ITEMS.filter(it => !it.set.event && !owned(it.id)).sort((a, b) => a.cost - b.cost).slice(0, 6);
  let seed = S.day * 9973 + 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  return pool.map(it => [rnd(), it]).sort((a, b) => a[0] - b[0]).slice(0, 3).map(x => x[1]).sort((a, b) => a.cost - b.cost);
}
const canAntique = () => S.day >= ANTIQUE_DAY && antiqueStock().some(it => S.money >= it.cost);
// Parça eklendi: set tamamlandıysa kutla
function colAdd(id){
  const it = COL[id], was = setDone(it.set);
  S.col = S.col || {}; S.col[id] = true;
  if (!was && setDone(it.set)){
    announce({emoji:it.set.emoji, name:`${it.set.name} tamamlandı!`, desc:`Set bonusu: +%${Math.round(it.set.full * 100)} ${it.set.what}`, ach:true}, L('🏺 Koleksiyon', '🏺 Collection'));
    if (status === 'running') confetti();
  }
}

// Yerel testte adres çubuğuna ?tarih=2026-10-29 yazılabilir (yayında çalışmaz, etkinlik ödülleri tekrar alınmasın)
// Açık gün boyunca tarih donar: gece yarısı biten etkinliğin ürünü salondaki müşteriye yine yapılabilsin
let dayDate = null;
const today = () => {
  if (status === 'running' && dayDate) return dayDate;
  const q = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && new URLSearchParams(location.search).get('tarih');
  return q ? new Date(q + 'T12:00') : new Date();
};
const DAY_MS = 86400000;
function eventOn(d){
  for (const ev of EVENTS) for (const y of [d.getFullYear() - 1, d.getFullYear()]){
    const r = ev.at(y);
    if (r && d >= r[0] && d < +r[1] + DAY_MS) return {ev, key:`${ev.id}-${r[0].getFullYear()}`, left:Math.ceil((+r[1] + DAY_MS - d) / DAY_MS)};
  }
  return null;
}
// Bugünün etkinliği ve 14 gün içindeki ilk etkinlik; tarih değişmedikçe yeniden hesaplanmaz
let evCache = {};
function calendar(){
  const d = today(), k = d.toDateString();
  if (evCache.k !== k){
    const cur = eventOn(d);
    let next = null;
    for (let i = 1; i <= 14 && !next; i++){ const e = eventOn(new Date(+d + i * DAY_MS)); if (e && (!cur || e.ev !== cur.ev)) next = {ev:e.ev, days:i}; }
    evCache = {k, cur, next};
  }
  return evCache;
}
const EV = () => (calendar().cur || {}).ev || null;
const evProduct = () => EV() && EV_PRODUCTS.find(p => p.ev === EV().id);
const evProg = () => { const c = calendar().cur; if (!c) return null; S.evp = S.evp || {}; return S.evp[c.key] = S.evp[c.key] || {n:0, done:false, seen:false}; };
function evReward(ep){
  const ev = EV(), gift = Math.round(600 * (1 + mainLv()) * (1 + 0.5 * worldCount()));
  ep.done = true;
  const dup = owned(ev.col.id);
  colAdd(ev.col.id);
  S.money += gift; S.total += gift;
  announce({emoji:ev.col.emoji, name:`${ev.name} görevi tamam!`, desc:`${dup ? '' : `Koleksiyonuna ${ev.col.name} eklendi · `}+₺${fmt(gift)}`, ach:true}, L('🎉 Etkinlik', '🎉 Event'));
  if (status === 'running') confetti();
  save();
}

const SAVE_KEY = 'cayocagi', BAK_KEY = 'cayocagi.bak';
function parseSave(raw){
  try {
    const d = JSON.parse(raw);
    return d && typeof d === 'object' && (d.money != null || d.day != null) ? d : null;
  } catch(e) { return null; }
}
let restored = false;   // bozuk kayıt yedekten geri geldi
function load(){
  try {
    const raw = localStorage.getItem(SAVE_KEY), bak = parseSave(localStorage.getItem(BAK_KEY));
    let d = parseSave(raw);
    // Son sağlam kayıt yedeklenir; bozuk kayıt silinmez, incelenebilsin diye ayrı anahtarda kalır
    if (d && Number.isFinite(d.money)) localStorage.setItem(BAK_KEY, raw);
    else if (raw) localStorage.setItem('cayocagi.bozuk', raw);
    if (!d && bak){ d = bak; restored = true; }
    if (d){
      // Bozulmuş sayılar (JSON'da null olur) yedekten, yoksa başlangıç değerinden gelir
      const f = fresh(), base = bak || f;
      for (const k in f) if (typeof f[k] === 'number' && !Number.isFinite(d[k])) d[k] = Number.isFinite(base[k]) ? base[k] : f[k];
      // 2.10 öncesi kayıt: yenilikleri bir kez göster, eski miras günü kalsın, şubelerin ihmal sayacı bugünden başlasın
      if (!d.ver){ d.ver = '2.10'; d.news = true; d.oldLegacy = true; (d.branches || []).forEach(b => b.seen = d.day); }
      return link(Object.assign(f, d));
    }
  } catch(e) {}
  return link(fresh());
}

const isApp = () => !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());

let nativeTimer = 0, nativeJson = null;
function nativeFlush(){
  clearTimeout(nativeTimer); nativeTimer = 0;
  const P = nativePref();
  if (P && nativeJson){ P.set({key:SAVE_KEY, value:nativeJson}).catch(() => {}); nativeJson = null; }
}
function nativeSave(json){
  if (!nativePref()) return;
  nativeJson = json;
  // Oyun sık kaydeder: arka plana geçerken hemen, oynarken en çok 2 saniyede bir yazılır
  if (document.visibilityState === 'hidden') nativeFlush();
  else if (!nativeTimer) nativeTimer = setTimeout(nativeFlush, 2000);
}
async function nativeRestore(){
  const P = nativePref();
  if (!P) return;
  try {
    const {value} = await P.get({key:SAVE_KEY}), d = parseSave(value);
    if (!d) { save(); return; }   // uygulamanın ilk açılışı: mevcut kaydı hemen kopyala
    const newer = !S.owner || (d.lastSeen || 0) > (S.lastSeen || 0) + 1000;
    if (newer && value !== localStorage.getItem(SAVE_KEY)){
      stale = true;   // kapanırken eski kayıt geri gelenin üstüne yazılmasın
      localStorage.setItem(SAVE_KEY, value);
      location.reload();
    }
  } catch(e) { console.error(e); }
}

// Şubeye ödenen açılış parası (eski kayıtlarda yoksa o bölgenin ilk fiyatı)

function branchIncome(b){
  const L = b.lv, ups = UPGRADES.reduce((s, u) => s + (L[u.id] || 0), 0);
  return Math.round((paidOf(b) * 0.03 + 150 * (L.dukkan || 0) + 25 * ups + 10 * S.unlocked.length) * (0.5 + b.rep / 100));
}
function openBranch(id, concept){
  const c = CITY[id], r = c && regionOf(id);
  if (!c || r === 'home' || hasCity(id) || !canBranch(r) || S.money < branchCost(r)) return false;
  S.money -= branchCost(r);
  S.branches.push({city:id, lv:{}, rep:50, day:S.day, paid:branchCost(r), health:100, concept:concept || 'klasik'});
  if (r === 'world') S.riskOn = true;   // yurt dışına açılınca batma riski başlar
  const p = PRODUCTS.find(p => p.city === id);
  if (p && !S.unlocked.includes(p.id)) S.unlocked.push(p.id);

}

// Yurt dışına açılınca başlar. Ana dükkân asla batmaz. Sorun çıkan şube: uyarı → kriz → batma.

const ISSUES = {
  hijyen:  {emoji:'🧽', name:'Hijyen denetimi',      desc:'Müfettiş kapıda, temizlik ekibi lazım'},
  maas:    {emoji:'💸', name:'Personel zam istiyor', desc:'Çalışanlar mutsuz, işi yavaşlattılar'},

  sikayet: {emoji:'😠', name:'Şikâyetler arttı',     desc:'Müşteriler hizmetten memnun değil'},
};
const RISK = {chance:0.15, drain:15, crisis:30, heal:10, visit:40, refund:0.3};
const bHealth = b => b.health == null ? 100 : b.health;
const fixCost = b => Math.max(300, Math.round(paidOf(b) * 0.08));
const rescueCost = b => fixCost(b) * 3;
const riskActive = () => S.riskOn || S.branches.length > 1;

// Gün sonunda şubeleri günceller; karnede gösterilecek haberleri döndürür
function riskDay(interviewDay){
  const out = {news:[], lost:[]};
  const cur = branch();
  cur.seen = S.day;
  if (!riskActive()) return out;
  for (const b of [...S.branches]){
    if (b.city === 'ana') continue;
    const nm = CITY[b.city].name;
    if (b === cur){
      if (b.issue || b.crisis) out.news.push(L(`✅ ${nm}: bizzat ilgilendin, sorun çözüldü`, `✅ ${nm}: you stepped in yourself and fixed it`));
      b.issue = null; b.crisis = false; b.health = Math.min(100, bHealth(b) + RISK.visit);
      continue;
    }
    if (b.issue){
      b.health = bHealth(b) - RISK.drain;
      if (b.health <= 0){
        const refund = Math.round(paidOf(b) * RISK.refund);
        S.money += refund;
        S.branches.splice(S.branches.indexOf(b), 1);
        S.lostBranches = (S.lostBranches || 0) + 1;
        out.lost.push({nm, refund});
        continue;
      }
      if (b.health <= RISK.crisis && !b.crisis){ b.crisis = true; out.news.push(L(`🚨 ${nm}: KRİZ! Kurtarmazsan batacak`, `🚨 ${nm}: CRISIS! It will go bust unless you rescue it`)); }
      else if (b.crisis) out.news.push(L(`🚨 ${nm}: kriz sürüyor${b.health <= RISK.drain ? ', yarın batabilir!' : ''}`, `🚨 ${nm}: the crisis goes on${b.health <= RISK.drain ? ', it may go bust tomorrow!' : ''}`));
      else out.news.push(L(`📉 ${nm}: ${ISSUES[b.issue.t].emoji} ${ISSUES[b.issue.t].name} hâlâ çözülmedi`, `📉 ${nm}: ${ISSUES[b.issue.t].emoji} ${ISSUES[b.issue.t].name}, still not solved`));
    } else {
      b.health = Math.min(100, bHealth(b) + RISK.heal);
      // Röportaj günü şubeler daha çok ihmal edilir
      // Uğramadıkça sorun ihtimali artar; yurt dışına açılmadan yarısı kadar
      // Çarpan en fazla 3: 10 şubeyi aynı anda gezmek imkânsız, sorunlar geliri eritmesin
      if (Math.random() < RISK.chance * (interviewDay ? 2 : 1) * (S.riskOn ? 1 : 0.5) * Math.min(3, 1 + Math.max(0, S.day - (b.seen ?? b.day ?? S.day)) / 7)){
        const t = pick(Object.keys(ISSUES));
        b.issue = {t, day:S.day};
        out.news.push(`⚠️ ${nm}: ${ISSUES[t].emoji} ${ISSUES[t].name}`);
      }
    }
  }
  S.cur = S.branches.indexOf(cur);   // batan şube listeden çıktıysa sıra kayar
  return out;
}
function fixBranch(i){
  const b = S.branches[i];
  if (!b || !(b.issue || b.crisis)) return;
  const crisis = b.crisis, cost = crisis ? rescueCost(b) : fixCost(b);
  if (S.money < cost){ toast(L('Yeterli paran yok', 'Not enough money')); SFX.error(); return; }
  S.money -= cost;
  if (crisis) S.rescues = (S.rescues || 0) + 1;
  b.issue = null; b.crisis = false; b.health = Math.max(bHealth(b), 60); b.seen = S.day;   // parayla ilgilenmek de ilgilenmektir
  toast(L(`${crisis ? '🛟' : '🔧'} ${CITY[b.city].name} şubesi ${crisis ? 'krizden kurtarıldı' : 'rahatladı'}!`, `${crisis ? '🛟' : '🔧'} The ${CITY[b.city].name} branch ${crisis ? 'was rescued' : 'is back on track'}!`));
  SFX.buy(); save();
}

}

function moveAlong(e, dt, sp){
  if (!e.path.length) return true;
  const t = e.path[0], dx = t.x - e.x, dy = t.y - e.y, d = Math.hypot(dx, dy), step = sp * dt;
  if (d <= step){ e.x = t.x; e.y = t.y; e.path.shift(); }
  else { e.x += dx / d * step; e.y += dy / d * step; }
  if (Math.abs(dx) > 1) e.flip = dx < 0;
  e.walk = (e.walk || 0) + dt * 13;
  return !e.path.length;
}

    * (1 + colBonus('pat')) * hoodPat() * (1 + cardBonus('pat'));
}

// "Veresiye yaz abi!": 3. günden sonra günde en çok bir kez, emekli ya da esnaf parasız çıkar
let verC = null;
function maybeVeresiye(c){
  if (c.payMul != null || c.reg || c.special || !(c.ct === 'emekli' || c.ct === 'esnaf') || S.day < 3 || R.verToday || Math.random() > 0.12) return false;
  R.verToday = true; verC = c;
  c.vName = pick(NAMES[Math.random() < 0.5 ? 'e' : 'k']);
  c.vAmt = c.order.reduce((s, o) => s + itemPrice(o.p), 0);
  showModal(`<h2>${L('📒 "Veresiye yaz abi!"', '📒 "Put it on my tab!"')}</h2>
    <p>${CTYPES[c.ct].emoji} <b>${c.vName}</b>: ${L(`"Cüzdanı evde unuttum. ₺${fmt(c.vAmt)} deftere yazar mısın? Yarın getiririm, söz!"`, `"I left my wallet at home. Can you put ₺${fmt(c.vAmt)} on my tab? I'll bring it tomorrow, promise!"`)}</p>
    <button class="ans" data-ver="yaz">${L('📒 <b>Deftere yaz</b><br><small>Çoğu kişi birkaç gün içinde öder, üstüne hayır duası da ekler</small>', '📒 <b>Put it on the tab</b><br><small>Most people pay within a few days, with a little extra for your kindness</small>')}</button>
    <button class="ans" data-ver="ikram">${L('🎁 <b>İkram et</b><br><small>Para yok ama mahalle duyar: +3⭐</small>', '🎁 <b>On the house</b><br><small>No money, but the neighbourhood hears about it: +3⭐</small>')}</button>
    <button class="ans" data-ver="hayir">${L('🙅 <b>Olmaz</b><br><small>Cebindekini verir (yarısı), -2⭐</small>', '🙅 <b>No way</b><br><small>They pay what they have (half), -2⭐</small>')}</button>`);
  return true;
}
function answerVeresiye(k){
  const c = verC; verC = null;
  hideModal();
  if (!c) return;
  if (k === 'yaz'){
    c.payMul = 0;
    S.veresiye = S.veresiye || [];
    S.veresiye.push({n:c.vName, amt:c.vAmt, due:S.day + 1 + Math.floor(Math.random() * 3)});
  } else if (k === 'ikram'){ c.payMul = 0; S.rep = Math.min(100, S.rep + 3); }
  else { c.payMul = 0.5; S.rep = Math.max(0, S.rep - 2); }
  pay(c);
}
// Gün sonu: vadesi gelen veresiyeler: çoğu %25 fazlasıyla öder, bazıları unutur
function veresiyeDay(){
  if (!S.veresiye || !S.veresiye.length) return '';
  const out = [];
  S.veresiye = S.veresiye.filter(v => {
    if (v.due > S.day) return true;
    if (Math.random() < 0.8){
      const m = Math.round(v.amt * 1.25);
      S.money += m; S.total += m; S.rep = Math.min(100, S.rep + 2);
      out.push(L(`📒 ${v.n} veresiyeyi ödedi: +₺${fmt(m)} (hayır duasıyla) · +2⭐`, `📒 ${v.n} paid off the tab: +₺${fmt(m)} (with thanks) · +2⭐`));
    } else out.push(L(`📒 ${v.n} borcunu unuttu: ₺${fmt(v.amt)} defterde kaldı`, `📒 ${v.n} forgot the tab: ₺${fmt(v.amt)} stays in the book`));
    return false;
  });
  return out.map(t => `<p class="hint">${t}</p>`).join('');
}

// special: 'vip' | 'influencer' | 'turist' | undefined
function spawnCustomer(special, delayPx = 0){
  const free = freeSeats();
  if (!free.length) return null;
  // Sıradan bir müşteri yerine bazen bugünün müdavimlerinden biri gelir (gün bitmeden)
  // Tanışma günü: yeni müdavim 3. müşteriden sonra kesin gelir
  const meet = R.regs.length && !(S.regs[R.regs[0]] || {}).met;
  const reg = !special && R.regs.length && R.t < DAY_LEN * 0.8 && (meet ? R.nextId >= 3 : Math.random() < 0.3) ? REG[R.regs.shift()] : null;
  const ct = !special && !reg ? pickType() : null, CT = ct && CTYPES[ct];
  const maxItems = Math.min(CT && CT.few ? 2 : 4, 2 + Math.floor(S.day / 4));
  let count = 1 + Math.floor(Math.random() * maxItems);
  // Öğrenci menünün ucuz yarısından ister
  const pool = CT && CT.cheap ? [...sellable()].sort((a, b) => P[a].price - P[b].price).slice(0, Math.max(1, Math.ceil(sellable().length / 2))) : sellable();
  if (special === 'vip') count = Math.min(4, Math.max(3, sellable().length));
  const fav = (DE().fav || []).filter(p => sellable().includes(p));
  const evp = evProduct(), cw = contractWant();
  let order = [];
  for (let i = 0; i < count; i++){
    const p = cw && Math.random() < 0.25 ? pick(cw) : evp && Math.random() < 0.3 ? evp.id : fav.length && Math.random() < 0.55 ? pick(fav) : pick(pool);
    order.push({p, done:false});
  }
  // Eleştirmen menünün en pahalı 5 ürününden 3-4 parça ister
  if (special === 'elestirmen'){
    const top = sellable().sort((a, b) => P[b].price - P[a].price).slice(0, 5);
    order = Array.from({length:S.day >= 15 ? 4 : 3}, () => ({p:pick(top), done:false}));
  }
  if (reg) order = regOrder(reg).map(p => ({p, done:false}));
  let max = patienceFor(order.length);
  if (special === 'vip') max *= 0.9;
  if (special === 'elestirmen') max *= 0.8;
  if (reg) max *= 1 + 0.08 * regLv(reg.id);   // eski dost biraz daha sabırlıdır
  if (CT) max *= CT.pat;
  const look = reg ? {...reg.look} : {...randomLook(), ...(CT && CT.look || {})};
  if (special === 'vip'){ look.shirt = '#1d1d2b'; look.suit = true; look.hat = 'crown'; }
  if (special === 'influencer'){ look.shirt = '#ff6fae'; look.prop = 'phone'; }
  if (special === 'turist'){ look.shirt = '#21b3a5'; look.hat = 'sun'; look.prop = 'camera'; }
  if (special === 'elestirmen'){ look.shirt = '#3d3d46'; look.glasses = true; look.hat = 'bere'; look.prop = 'note'; }
  const seat = pick(free);
  const c = {id:R.nextId++, seat, look, order, patience:max, max, special, reg:reg && reg.id, ct,
             state:'in', x:rightWall() + 40 + delayPx, y:aisleY(), path:pathIn(seat), walk:0};
  R.customers.push(c);
  SFX.arrive();
  return c;
}

function catchArson(msg){
  const a = R.arson; R.arson = null;
  S.rep = Math.min(100, S.rep + 3);
  floatText(a.x - 30, a.y - 100, msg + ' +3⭐', '#8fe08f'); SFX.combo();
}
function leave(c, mood){
  c.leaving = {mood};
  if (c.seat != null && R.stains.length < MAX_STAINS && Math.random() < 0.3){
    const sl = SLOTS[c.seat];
    R.stains.push({x:sl.x + rand(-50, 50), y:Math.min(sl.y + rand(44, 56), viewH() - 18), r:Math.random()});
    if (!S.stainTip){ S.stainTip = 1; announce({emoji:'🧽', name:L('Dükkân kirleniyor', 'The shop is getting dirty'), desc:L('Müşteriler kalkınca masaların önü kirlenir. Kire dokunup temizle ya da Mağaza’dan temizlikçi tut. Kirli dükkânda müşteri çabuk sabırsızlanır ve daha az gelir.', 'When customers leave, the floor by the tables gets dirty. Tap the dirt to clean it or hire a cleaner in the Shop. In a dirty shop customers lose patience fast and come less often.')}); }
  }
  c.state = 'out';
  c.path = pathOut(c.seat);
}

function serve(c, silent){
  if (!seated(c)) return false;
  let delivered = 0;
  for (const o of c.order){
    if (o.done) continue;
    const i = R.tray.indexOf(o.p);
    if (i >= 0){ trayRemove(i); o.done = true; o.doneAt = now(); delivered++; if (silent) break; }
  }
  if (!delivered){ if (!silent){ toast(L('Tepside bu müşterinin istediği bir şey yok', 'Nothing on the tray matches this order')); SFX.error(); } return false; }
  if (c.order.every(o => o.done)) pay(c); else SFX.serve();
  return true;
}

function pay(c){
  if (maybeVeresiye(c)) return;   // R-1: müşteri parasız çıktı, karar bekleniyor
  const ratio = c.patience / c.max;
  let base = c.order.reduce((s, o) => s + itemPrice(o.p), 0);
  if (c.payMul != null) base = Math.round(base * c.payMul);
  if (c.special === 'vip') base *= c.vipPrep ? 3.5 : 3;
  if (R.focus) base = Math.round(base * 1.2);   // röportajı reddedip dükkâna odaklanılan gün
  R.combo++; R.comboT = COMBO_TIME;
  if (dirt() >= 4 && Math.random() < 0.3){
    S.rep = Math.max(0, S.rep - 1);
    floatText(SLOTS[c.seat].x, SLOTS[c.seat].y - 185, L('🤢 Burası kirli! -1⭐', '🤢 This place is dirty! -1⭐'), '#c9e06a', 0.3);
    R.voice.dirty++;
  }
  R.stats.bestCombo = Math.max(R.stats.bestCombo, R.combo);
  S.bestCombo = Math.max(S.bestCombo || 0, R.combo);
  const cm = comboMult(R.combo);
  const tipMult = (1 + 0.1 * lv('dekor')) * (DE().tip || 1) * (CM().tip || 1) * (effect('happy') ? 3 : 1) * cm * (1 + 0.05 * fameTier()) * headTip() * sagTip() * hoodTip() * proTip()
    * (c.reg ? 1 + 0.1 * regLv(c.reg) : 1)    // müdavim: her kalp +%10 bahşiş
    * ((EV() || {}).tip || 1) * (1 + colBonus('tip')) * (WD().tip || 1) * Q().tip * (c.ct ? CTYPES[c.ct].tip : 1);
  let tip = Math.round(base * (0.05 + 0.35 * ratio) * tipMult);
  // Ünlüysen bazı müşteriler imza ister ve fazladan bahşiş bırakır
  const autograph = fameLv() >= 1 && Math.random() < 0.06 * fameTier();
  if (autograph) tip += Math.round(base * 0.3);
  const mat = Math.round(base * Q().cost * hoodMat() * (1 - cardBonus('mat')));   // malzeme gideri
  S.money += base + tip - mat; S.total += base + tip - mat; R.stats.mat += mat;
  addFame(0.25 + (c.special === 'influencer' ? 5 : 0) + (autograph ? 0.5 : 0));
  R.stats.served++; R.stats.earned += base; R.stats.tips += tip; S.served++;
  const ep = evProg();
  if (ep && !ep.done && ++ep.n >= EV().goal) evReward(ep);
  c.order.forEach(o => R.sold[o.p] = (R.sold[o.p] || 0) + 1);
  S.cayN = (S.cayN || 0) + c.order.filter(o => o.p === 'cay' || o.p === 'rizecay').length;
  if (c.special === 'vip') S.vipN = (S.vipN || 0) + 1;
  contractSold(c.order);
  S.rep = Math.min(100, S.rep + (ratio > 0.5 ? 2 : 1) + (c.special === 'influencer' ? 10 : 0));
  const s = SLOTS[c.seat];
  // Müşteri yorumu: malzeme kalitesine ve servis hızına göre
  const rv = ratio < 0.25 && Math.random() < 0.4 ? 'slow' : Math.random() < Q().bad ? 'bad' : Math.random() < Q().good ? 'good' : null;
  if (rv){
    const good = rv === 'good';
    R.stats[good ? 'good' : 'bad']++;
    if (!good) R.voice[rv]++;
    S.rep = Math.max(0, Math.min(100, S.rep + (good ? 1 : -2)));
    floatText(s.x, s.y - 215, `${pick(REVIEWS[rv])} ${good ? '+1' : '-2'}⭐`, good ? '#8fe08f' : '#ff8a7a', 0.45);
  }
  // Yeni kombo kademesine geçildiyse kutla
  if (cm > comboMult(R.combo - 1) || (R.combo >= 20 && R.combo % 5 === 0)){ comboPop(R.combo, cm); SFX.combo(); }
  floatText(s.x, s.y - 100, `+₺${base + tip - mat}`, '#ffc94a');
  if (c.special === 'influencer'){
    floatText(s.x, s.y - 130, c.infl === 'ikram' ? '📸 +15⭐ · +5 🌟' : '📸 +10⭐', '#e08bff', 0.3);
    if (c.infl === 'ikram'){ S.rep = Math.min(100, S.rep + 5); addFame(5); }
  }
  else if (autograph) floatText(s.x, s.y - 130, L('✍️ İmza istedi!', '✍️ Asked for an autograph!'), '#e08bff', 0.3);
  else if (c.ct && c.payMul == null && Math.random() < 0.15) say(s.x, s.y - 150, sayPick('happy'));
  coins(s.x, s.y - 40, Math.min(14, 2 + Math.floor((base + tip) / 20) + Math.floor(R.combo / 3)));   // kombo büyüdükçe daha çok para saçılır
  bump('#money', 'bump');
  SFX.pay();
  if (c.reg) regHappy(c, ratio);
  if (c.special === 'elestirmen'){
    const taste = c.order.reduce((t, o) => t + recLv(o.p), 0) / c.order.length / MAX_RECIPE;
    // Salonun huzuru: bugün kimse kızmadıysa tam puan
    const calm = R.stats.lost === 0 ? 1 : R.stats.lost <= 2 ? 0.5 : 0;
    // 5 yıldız için pahalı ürünlerin tarifleri neredeyse tam olmalı (simülasyonla: iyi oyuncu ~3, ustalaşınca 4-5)
    review(Math.max(1, Math.min(5, 1 + Math.floor(4.4 * (0.35 * ratio + 0.45 * taste + 0.2 * calm)))));
  }
  leave(c, 'happy');
}

// Müdavim mutlu ayrıldı: bağ puanı artar; yeni kalpte söz + hediye
function regHappy(c, ratio){
  const r = REG[c.reg], d = regData(r.id), before = regLv(r.id), s = SLOTS[c.seat];
  d.pts += ratio > 0.5 ? 2 : 1; d.visits++;
  if (!R.regsToday.includes(r.id)) R.regsToday.push(r.id);
  const l = regLv(r.id);
  floatText(s.x, s.y - 130, `💛 ${r.name}`, '#ffb3c6', 0.3);
  if (l > before && l > d.got){
    d.got = l;
    const gift = regGift(l);
    S.money += gift; S.total += gift;
    announce({emoji:r.emoji, name:`${r.name} ${hearts(l)}`, desc:`"${r.lines[l]}" · ${L('Hediye', 'Gift')} +₺${fmt(gift)}`, ach:true}, L('💛 Müdavim', '💛 Regular'));
  }
}
function regAngry(c){
  const r = REG[c.reg], d = regData(r.id), s = SLOTS[c.seat];
  d.pts = Math.max(0, d.pts - 3);
  floatText(s.x, s.y - 160, `💔 ${r.name} küstü`, '#ff8a8a', 0.2);
}
// Masaya oturunca selam verir; ilk tanışmada kart çıkar
function regGreet(c){
  const r = REG[c.reg], d = regData(r.id), s = SLOTS[c.seat];
  if (!d.met){
    d.met = true;
    announce({emoji:r.emoji, name:r.name, desc:`"${r.lines[0]}" · ${L('Her zamanki', 'The usual')}: ${regOrder(r).map(p => P[p].emoji).join('')}`}, L('💛 Yeni müdavim', '💛 New regular'));
  } else floatText(s.x, s.y - 150, regLv(r.id) ? L('💬 Her zamankinden!', '💬 The usual!') : L('💬 Merhaba usta!', '💬 Hello, master!'), '#fff3d6');
}

let choiceCb = null;
function showChoice(title, text, opts, cb){
  choiceCb = cb;

function startDayEvent(){
  if (S.day < 2 || Math.random() > 0.55) return;
  R.dayEvent = pick(DAY_EVENTS);
  const ev = R.dayEvent;
  setTimeout(() => {
    if (ev.id !== 'mac' || modalOpen() || status !== 'running') return announce(ev, L('Bugün', 'Today'));
    // Maç Günü: dev ekran kiralarsan daha kalabalık ve bahşiş bol
    const cost = Math.max(150, 20 * S.day);
    showChoice(`${ev.emoji} ${ev.name}`, ev.desc, [
      {k:'ekran', off:S.money < cost, html:L(`📺 <b>Dev ekran kirala · ₺${fmt(cost)}</b><br><small>Müşteriler daha da sık gelir, bahşişler %30 fazla</small>`, `📺 <b>Rent a big screen · ₺${fmt(cost)}</b><br><small>Even more customers, tips +30%</small>`)},
      {k:'normal', html:L('🍵 <b>Normal devam</b><br><small>Ekstra masraf yok</small>', '🍵 <b>Carry on as usual</b><br><small>No extra cost</small>')},
    ], k => {
      if (k === 'ekran' && S.money >= cost){
        S.money -= cost; R.stats.mat += cost;
        R.dayEvent = {...ev, spawn:0.38, tip:1.3, name:ev.name + ' 📺'};
        toast(L(`📺 Dev ekran kuruldu: -₺${fmt(cost)}`, `📺 Big screen set up: -₺${fmt(cost)}`)); SFX.build();
      }
    });
  }, 700);
}

    {k:'masa', off:S.money < cost, html:L(`👑 <b>Özel masa hazırla · ₺${fmt(cost)}</b><br><small>Daha sabırlı bekler ve 3,5 kat öder</small>`, `👑 <b>Prepare a special table · ₺${fmt(cost)}</b><br><small>They wait longer and pay 3.5×</small>`)},
    {k:'normal', html:L('🙂 <b>Normal karşıla</b><br><small>Ekstra masraf yok</small>', '🙂 <b>Welcome them as usual</b><br><small>No extra cost</small>')},
  ], k => {
    if (k === 'masa' && S.money >= cost){ S.money -= cost; R.stats.mat += cost; c.vipPrep = true; c.max *= 1.4; c.patience = c.max; SFX.build(); }

}

function triggerLiveEvent(){
  const free = freeSeats().length;
  const options = LIVE_EVENTS.filter(e => (!e.seats || free >= e.seats) && !effect(e.id)
    && (e.id !== 'elektrik' || Math.random() < 0.35)   // kesinti seyrek olsun
    && (e.id !== 'kundak' || (S.day >= 6 && !R.arson && Math.random() < 0.3)));
  if (!options.length) return;
  // Dubai: VIP müşteriler çok sık gelir
  const vip = CM().vip && Math.random() < 0.5 && options.find(e => e.id === 'vip');
  const ev = vip || pick(options);
  if (ev.dur) R.effects.push({id:ev.id, left:ev.dur, ev});
  if (ev.id === 'vip' || ev.id === 'influencer'){
    const c = spawnCustomer(ev.id);
    if (ev.id === 'vip' ? vipChoice(c) : influencerChoice(c)) return;   // R-2: kart yerine karar
  }
  if (ev.id === 'kundak') R.arson = {t:ARSON_T, x:rightWall() - 45, y:aisleY()};
  if (ev.id === 'turist') for (let i = 0; i < free; i++) spawnCustomer('turist', i * 40);
  announce(ev);
}

// Kartlar sırayla gösterilir: aynı anda iki olay/başarım gelirse biri kaybolmaz
const cardQ = [];
let cardBusy = false;
function announce(ev, prefix){ cardQ.push([ev, prefix]); if (!cardBusy) nextCard(); }
function nextCard(){
  const it = cardQ.shift();
  if (!it){ cardBusy = false; return; }
  cardBusy = true;
  const [ev, prefix] = it;
  $('#eventCard').innerHTML = `<div class="em">${ev.emoji}</div><div><b>${prefix ? prefix + ': ' : ''}${ev.name}</b><small>${ev.desc}</small></div>`;
  $('#eventCard').classList.add('show');
  ev.id === 'elektrik' ? SFX.blackout() : ev.ach ? SFX.levelUp() : SFX.event();
  setTimeout(() => { $('#eventCard').classList.remove('show'); setTimeout(nextCard, 450); }, 3600);
}
