  R.customers.forEach(c => {
    if (c.state === 'seated') return;
    const mood = c.leaving ? c.leaving.mood : 'happy';
    items.push({y:c.y, draw:() => {
      drawPerson(g, {x:c.x, y:c.y, look:c.look, walk:c.walk, flip:c.flip, mood});
      if (c.leaving) emoji(g, c.leaving.mood === 'happy' ? '😋' : '💢', c.x + 16, c.y - 82, 16);
    }});
  });
  if (R.arson){ const a = R.arson; items.push({y:a.y, draw:() => {
    const p = 1 + Math.sin(now() * 10) * 0.12;
    g.strokeStyle = '#ff4d3a'; g.lineWidth = 3; g.beginPath(); g.ellipse(a.x, a.y - 2, 30 * p, 10 * p, 0, 0, 7); g.stroke();
    drawPerson(g, {x:a.x, y:a.y, look:ARSON_LOOK, mood:'angry'});
    emoji(g, '🔥', a.x - 20, a.y - 36, 18);
    g.fillStyle = '#ff4d3a'; g.font = '900 20px system-ui'; g.textAlign = 'center'; g.fillText(`❗ ${Math.ceil(a.t)}`, a.x, a.y - 92);
  }}); }
  R.garsons.forEach(gs => items.push({y:gs.y, draw:() =>
    drawPerson(g, {x:gs.x, y:gs.y, look:GARSON_LOOKS[gs.i], walk:gs.state === 'idle' ? null : gs.walk, flip:gs.flip, mood:'happy',
                   carry:gs.carry ? P[gs.carry].emoji : null})}));
  const D = lv('dekor');
  if (D >= 1) items.push({y:236, draw:() => drawPlant(rightWall() - 34, 236, D >= 3)});
  if (D >= 5) items.push({y:530, draw:() => drawPlant(36, 530, true)});
  items.sort((a, b) => a.y - b.y).forEach(it => it.draw());

  if (effect('yangin')) for (let i = 0; i < 4; i++) emoji(g, '🔥', 60 + i * 90 + Math.sin(now() * 7 + i) * 4, 300 - Math.abs(Math.sin(now() * 5 + i)) * 10, 30);
  R.customers.filter(seated).forEach(drawBubble);
  drawParticles();
  if (status === 'running' && R.combo >= 2) drawCombo();

  // Dükkân büyüyünce parlama
  const lu = now() - levelUpAt;
  if (lu < 0.8){ g.fillStyle = `rgba(255,240,200,${(1 - lu / 0.8) * 0.7})`; g.fillRect(0, 0, W, H); }
  if (status !== 'running'){ g.fillStyle = 'rgba(10,14,30,.35)'; g.fillRect(0, 0, W, H); }
}

function coach(){
  const none = {msg:'', want:[]};
  if (S.day > 2) return none;
  if (status !== 'running') return {msg:'☀️ Hazırsan yukarıdaki "Dükkânı Aç" düğmesine dokun.', want:[]};
  if (R.customers.some(canServe)) return {msg:'👆 Yeşil balonlu müşteriye dokun, siparişini servis et!', want:[]};
  const n = needed(), want = Object.keys(n).filter(k => n[k] > 0);
  if (want.length){
    if (!hasRoom()) return {msg:'🍽️ Tepsi dolu! İstenmeyen ürüne dokunup çöpe atabilirsin.', want:[]};
    return {msg:`👇 Sipariş var: ${want.map(k => P[k].emoji + ' ' + P[k].name).join(', ')}. Yanıp sönen ürüne dokun!`, want};
  }
  if (inProgress()) return {msg:'⏳ Ocakta hazırlanıyor, birazdan tepsiye düşecek…', want:[]};
  return {msg:'🚶 Müşteri bekleniyor… Geldiğinde balonunda siparişini göreceksin.', want:[]};
}

  if (locked.length){
    m += '<h3>Yeni Ürünler</h3>';

      const need = shopLocked(p) && lockText(p);

    <div><small>Gün</small><b>${S.day}</b></div><div><small>Toplam kazanç</small><b>₺${fmt(S.total)}</b></div>
    <div><small>Mutlu müşteri</small><b>${fmt(S.served)}</b></div><div><small>En kârlı gün</small><b>₺${fmt(S.bestDay)}</b></div>
    <div><small>Kusursuz gün</small><b>${S.perfect}</b></div><div><small>Giriş serisi</small><b>📅 ${S.streak} gün</b></div>

  const metN = REGULARS.filter(r => (S.regs[r.id] || {}).met).length;
  v += `<h3>💛 Müdavimler (${metN}/${REGULARS.length})</h3><p class="hint">Mahallenin sakinleri yalnızca ana dükkâna uğrar. Mutlu ettikçe kalp kazanırlar: her kalp +%10 bahşiş ve bir hediye. 4 kalpli müdavim seni herkese anlatır (her gün +1 🌟).</p>`;

  const ownN = COL_ITEMS.filter(it => owned(it.id)).length;
  const bon = [['tip', 'bahşiş'], ['pat', 'sabır'], ['fame', 'ünlülük'], ['off', 'sen yokken kasası']]
    .filter(([k]) => colBonus(k) > 0).map(([k, w]) => `+%${Math.round(colBonus(k) * 100)} ${w}`);
  v += `<h3>🏺 Koleksiyon (${ownN}/${COL_ITEMS.length})</h3>
    <p class="hint">${bon.length ? 'Toplam bonus: ' + bon.join(' · ') : 'Mağazadaki antikacıdan parça al, etkinlik görevlerinden hatıra kazan.'}</p>`;
  COL_SETS.forEach(st => {
    v += `<p class="hint" style="margin:8px 0 4px"><b>${st.emoji} ${st.name}</b> · parça başı +%${Math.round(st.per * 100)}, set +%${Math.round(st.full * 100)} ${st.what}${setDone(st) ? ' ✅' : ''}</p><div class="inv">`
      + st.items.map(it => card(owned(it.id) ? it.emoji : '❔', it.name, owned(it.id) ? 'Koleksiyonunda' : st.event ? 'Etkinlik ödülü' : `₺${fmt(it.cost)}`, '', !owned(it.id))).join('') + '</div>';
  });
  const done = ACH.filter(a => S.ach[a.id]).length;
  v += `<h3>🏅 Başarımlar (${done}/${ACH.length})</h3>`;
  // Tamamlanmamışlar önce, en çok ilerleyen en üstte
  const prog = a => S.ach[a.id] ? 1 : Math.min(1, a.val() / a.goal);
  [...ACH].sort((a, b) => (!!S.ach[a.id] - !!S.ach[b.id]) || prog(b) - prog(a)).forEach(a => {
    const ok = !!S.ach[a.id], p = prog(a);
    v += `<div class="ach${ok ? ' done' : ''}"><div class="em">${ok ? a.emoji : '🔒'}</div>
      <div class="info"><b>${a.name}</b><small>${a.desc}${ok ? '' : ` · ${fmt(Math.min(a.val(), a.goal))}/${fmt(a.goal)}`}</small>
      <div class="pbar"><div style="width:${Math.round(p * 100)}%"></div></div></div>
      <span class="rw">${ok ? '✓' : '₺' + fmt(a.reward)}</span></div>`;
  });
  v += '<h3>Dükkân</h3><div class="inv">' + SHOP_LEVELS.map((L, i) => card(i === 3 ? '🏆' : '🏪', L.name,
    i < lv('dukkan') ? 'Geride kaldı' : i === lv('dukkan') ? 'Şu anki dükkânın' : `Gün ${L.day}+ · ₺${fmt(L.cost)}`, '', i > lv('dukkan'))).join('') + '</div>';
  [['esya', 'Eşyalar'], ['alet', 'Mutfak Aletleri'], ['ekip', 'Çalışanlar']].forEach(([grp, title]) => {
    v += `<h3>${title}</h3><div class="inv">` + UPGRADES.filter(u => u.grp === grp).map(u => {
      const l = lv(u.id);
      return card(u.emoji, u.name, l ? UP_FX[u.id](l) : 'Mağazada', dots(l, u.id === 'masa' ? SHOP_LEVELS[SHOP_LEVELS.length - 1].tables - 2 : u.max), !l);
    }).join('') + '</div>';
  });
  v += '<h3>🌟 Şöhret Ayrıcalıkları</h3><div class="inv">' + FAME_PERKS.map(p => card(p.emoji, p.name,
    fameLv() >= p.lv ? p.desc : `🔒 ${FAME_LEVELS[p.lv].emoji} ${FAME_LEVELS[p.lv].name}`, '', fameLv() < p.lv)).join('') + '</div>';
  v += '<h3>Menü</h3><div class="inv">' + PRODUCTS.map(p => card(p.emoji, p.name, S.unlocked.includes(p.id) ? `₺${basePrice(p.id)}` : shopLocked(p) ? (p.city ? CITY[p.city].name : p.tool ? UPGRADES.find(u => u.id === p.tool).name : SHOP_LEVELS[p.shop].name) : 'Kilitli', S.unlocked.includes(p.id) ? stars5(recLv(p.id)) : '', !S.unlocked.includes(p.id))).join('') + '</div>';
  setHTML('#inventory', v);

  // Şubeler
  setHTML('#branchList', branchesHTML());
}

  [[-10,36],[-9,43],[-5,48],[5,52],[10,57],[5,62],[15,69],[28,71],[40,67],[60,70],[100,77],[140,72],[170,66],[160,58],[140,52],
   [130,42],[122,30],[110,20],[105,10],[100,2],[95,15],[80,8],[72,20],[60,25],[57,22],[52,16],[44,12],[36,30],[36,36],[27,37],[26,41],[20,39],[12,44],[5,43]],
  [[-17,21],[-6,35],[10,37],[32,31],[43,12],[51,11],[40,-15],[32,-28],[20,-35],[13,-20],[9,4],[-8,5],[-17,14]],
  [[114,-22],[130,-12],[143,-11],[153,-27],[146,-38],[135,-34],[115,-34]],
  [[-5,50],[1,51],[-1,55],[-3,58],[-6,56]],                          // Britanya
  [[130,31],[136,34],[141,38],[142,44],[139,40],[135,35]],              // Japonya
];
const mapXY = ([lon, lat]) => [lon + 180, 80 - lat];
// Etiketler birbirine binmesin: [dx, dy, hizalama]
const MAP_LABEL = {londra:[-6, 2.5, 'end'], berlin:[0, -7, 'middle'], dubai:[6, 3, 'start'], tr:[7, 3, 'start']};
function mapLabel(id, x, y, text){
  const [dx, dy, a] = MAP_LABEL[id] || [0, 11, 'middle'];
  return `<text x="${x + dx}" y="${y + dy}" style="text-anchor:${a}">${text}</text>`;
}
function worldMapSVG(){
  const land = CONTINENTS.map(pts => `<path d="M${pts.map(p => mapXY(p).join(',')).join('L')}Z"/>`).join('');
  const [tx, ty] = mapXY(TR_PIN);
  let arcs = '', pins = '';
  CITIES.filter(c => c.region === 'world').forEach(c => {
    const [x, y] = mapXY(c.pin), own = hasCity(c.id);
    const b = own && S.branches.find(b => b.city === c.id);
    const st = own ? (b.crisis || b.issue ? 'own bad' : 'own') : canBranch('world') ? 'can' : 'lock';
    if (own) arcs += `<path class="arc" d="M${tx},${ty} Q${(tx + x) / 2},${Math.min(ty, y) - 22} ${x},${y}"/>`;
    pins += `<g class="pin ${st}" data-pin="${c.id}"><circle cx="${x}" cy="${y}" r="9" class="hit"/><circle cx="${x}" cy="${y}" r="${own ? 4.5 : 3.5}"/>
      ${mapLabel(c.id, x, y, c.name)}</g>`;
  });
  const trBad = S.branches.some(b => regionOf(b.city) === 'tr' && (b.issue || b.crisis));
  pins += `<g class="pin own home${trBad ? ' bad' : ''}" data-pin="tr"><circle cx="${tx}" cy="${ty}" r="9" class="hit"/><circle cx="${tx}" cy="${ty}" r="5"/>
    ${mapLabel('tr', tx, ty, `Türkiye ${trCount()}/${TR_GOAL}`)}</g>`;
  return `<svg class="wmap" viewBox="0 0 360 136" role="img" aria-label="Şube haritası"><g class="land">${land}</g>${arcs}${pins}</svg>`;
}

function branchesHTML(){
  const n = trCount(), w = worldCount(), wo = worldOpen();
  let h = wo

const canVibrate = 'vibrate' in navigator;
// Tarayıcılar ilk dokunuştan önce ses/titreşime izin vermez; boşuna denemeyelim
const userActive = () => !navigator.userActivation || navigator.userActivation.hasBeenActive;
function buzz(pattern){ if (vibOn && canVibrate && userActive()) try { navigator.vibrate(pattern); } catch(e) {} }
function tone(freq, dur, {type = 'sine', vol = 0.08, delay = 0, to = null} = {}){
  if (muted || !userActive()) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), gn = actx.createGain();
    const t0 = actx.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    gn.gain.setValueAtTime(vol, t0); gn.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(gn).connect(actx.destination); o.start(t0); o.stop(t0 + dur);
  } catch(e) {}
}

// Kodla üretilen hafif saz döngüsü: Re hicaz notaları + alçak dem. Yalnızca dükkân açıkken ve duraklatılmamışken çalar
let musicOn = true;
try { musicOn = localStorage.getItem('cayocagi-muzik') !== 'kapali'; } catch(e) {}
const HICAZ = [293.7, 311.1, 370, 392, 440, 466.2, 523.3, 587.3];
const MELODY = [0,-1,1,2, 3,-1,2,1, 2,-1,3,4, 3,2,1,-1, 4,-1,5,4, 3,-1,4,6, 5,4,3,2, 1,-1,0,-1];  // -1 = es
const BEAT = 0.3;
let musicGain = null, musicStep = 0, musicNext = 0;
function pluck(freq, t, vol, dur){
  const o = actx.createOscillator(), o2 = actx.createOscillator(), gn = actx.createGain();
  o.type = 'triangle'; o.frequency.value = freq;
  o2.type = 'sine'; o2.frequency.value = freq * 2;
  gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + 0.01); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gn); o2.connect(gn); gn.connect(musicGain);
  o.start(t); o2.start(t); o.stop(t + dur); o2.stop(t + dur);
}
function musicTick(){
  const want = musicOn && !muted && userActive() && status === 'running' && !modalOpen() && !document.hidden;
  if (!actx && !want) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (!musicGain){ musicGain = actx.createGain(); musicGain.gain.value = 0; musicGain.connect(actx.destination); }
    musicGain.gain.setTargetAtTime(want ? 1 : 0, actx.currentTime, 0.3);
    if (!want){ musicNext = 0; return; }
    if (actx.state === 'suspended') actx.resume();
    if (musicNext < actx.currentTime) musicNext = actx.currentTime + 0.05;
    while (musicNext < actx.currentTime + 0.6){
      const n = MELODY[musicStep % MELODY.length];
      if (n >= 0) pluck(HICAZ[n], musicNext, 0.03, 0.7);
      if (musicStep % 16 === 0){ pluck(73.4, musicNext, 0.03, 4); pluck(110, musicNext, 0.015, 4); }
      musicStep++; musicNext += BEAT;
    }
  } catch(e) {}
}
setInterval(musicTick, 200);

function startInterview(){
  IV = {tier:S.offer.tier, i:0, picks:[], qs:[...IV_QS].sort(() => Math.random() - 0.5).slice(0, 3)};

function showQuestion(){
  const q = IV.qs[IV.i], order = Object.keys(q.a).sort(() => Math.random() - 0.5);
  showModal(`
    <h2>🎤 ${OUTLETS[IV.tier].name} <small>· Soru ${IV.i + 1}/3</small></h2>
    <p class="iv-q">“${q.q}”</p>

function answer(t){
  IV.picks.push(t); IV.i++;
  SFX.serve();
  if (IV.i < IV.qs.length) return showQuestion();
  const o = OUTLETS[IV.tier];
  let fm = 0, rp = 0;
  const cnt = {};
  IV.picks.forEach(p => { fm += ANS[p].fame; rp += ANS[p].rep; cnt[p] = (cnt[p] || 0) + 1; });
  const top = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
  const gain = Math.round(o.fame * fm / IV.picks.length);
  S.rep = Math.max(0, Math.min(100, S.rep + rp));
  S.interviews = (S.interviews || 0) + 1;
  S.offer.ans = 'yes';
  S.lastCover = {tier:IV.tier, quote:HEADLINES[top], day:S.day};
  // Baskın tarz ödül verir; üç cevap da aynı tarzdaysa tutarlılık bonusu (+%50 ünlülük)
  const same = cnt[top] === IV.picks.length;
  const bonus = same ? Math.round(gain * 0.5) : 0;
  let money = 0;
  if (top === 'iddiali'){ money = Math.round(o.fame * 40 * (same ? 1.5 : 1)); S.money += money; S.total += money; }
  S.ivBuff = {day:S.day, t:top};
  addFame(gain + bonus);
  const rewardNote = IV_REWARD[top].replace('{m}', fmt(money)) + (same ? ` · 🎯 Tutarlı duruş: +${bonus} 🌟` : '');
  IV = null;
  save();
  SFX.levelUp();
  showCover(true, `+${gain + bonus} 🌟 ünlülük · ${rp >= 0 ? '+' : ''}${rp}⭐ itibar<br>🎁 ${rewardNote}`);
}

function wrapText(ctx, text, x, y, maxW, lh){
  const words = text.split(' ');
  let ln = '';
  for (const w of words){
    if (ln && ctx.measureText(ln + ' ' + w).width > maxW){ ctx.fillText(ln, x, y); ln = w; y += lh; }
    else ln = ln ? ln + ' ' + w : w;
  }
  ctx.fillText(ln, x, y);
}

    if (S.money >= c && recLv(id) < MAX_RECIPE){
      S.money -= c; S.rec = S.rec || {}; S.rec[id] = recLv(id) + 1;
      toast(`${P[id].emoji} ${P[id].name} tarifi ${recLv(id)}/${MAX_RECIPE} ⭐ · artık ₺${basePrice(id)}`); SFX.buy(); save();
    }
  } else if (d.grow !== undefined){
    const next = SHOP_LEVELS[lv('dukkan') + 1];
    if (next && S.day >= next.day && S.money >= next.cost){
      S.money -= next.cost; S.lv.dukkan = lv('dukkan') + 1;
      levelUpAt = now(); confetti(); SFX.build(); setTimeout(SFX.levelUp, 450);
      toast(`🏪 Dükkânın artık bir ${next.name}!`); save();
    }
  } else if (d.branch){
    showConcepts(d.branch);
  } else if (d.switch){
    goBranch(+d.switch);
  } else if (d.col){
    const it = COL[d.col];
    if (it && !owned(it.id) && !it.set.event && S.money >= it.cost && S.day >= ANTIQUE_DAY){
      S.money -= it.cost; colAdd(it.id);
      toast(`${it.emoji} ${it.name} koleksiyonuna eklendi!`); SFX.buy(); save();
    }
  } else if (d.buy){
    const u = UPGRADES.find(u => u.id === d.buy), c = upCost(u);
    if (S.money >= c && lv(u.id) < maxLv(u)){
      S.money -= c; S.lv[u.id] = lv(u.id) + 1;
      if (u.id === 'masa'){ tableBorn[numTables() - 1] = now(); SFX.build(); }
      else if (u.id === 'garson'){ R.garsons.push(newGarson(R.garsons.length)); SFX.buy(); }
      else SFX.buy();
      toast(`${u.emoji} ${u.name} seviye ${lv(u.id)}!`); save();
    }
  }
  renderUI();
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (modalOpen()){ if (e.key === 'Escape' && $('#modalOk')) hideModal(); return; }
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P'){ pauseGame(); return; }
  const n = parseInt(e.key);
  if (n >= 0 && n <= 9){
    const list = kitchenMenu();
    const i = n === 0 ? 9 : n - 1; // 0 tuşu = 10. ürün
    if (list[i]) makeProduct(list[i].id);
  }
});

$('#pauseBtn').addEventListener('click', pauseGame);
$('#settingsBtn').addEventListener('click', () => { if (!modalOpen()) showSettings(); });
// Telefon kilitlenince / başka uygulamaya geçince: duraklat ve kaydet
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ pauseGame(); save(); hiddenAt = Date.now(); return; }
  const away = hiddenAt ? Date.now() - hiddenAt : 0;
  hiddenAt = 0;
  // Uzun süre arka planda kaldıysa kasayı göster (günlük ödül ondan sonra gelir)
  if (offline == null && checkOffline(away)) return;
  // Uygulama gece yarısını geçip açık kaldıysa, dönüşte günlük ödülü göster
  if (S.owner && status === 'closed' && !modalOpen() && dailyPending()) showDaily();
});
window.addEventListener('pagehide', save);
$('#editOwner').addEventListener('click', () => { if (!modalOpen()) openOwnerEditor(false); });
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (!b) return;
  setTab(b.dataset.tab);
  if (!desktopMQ.matches) toTop();
});

// ---------- Ana döngü ----------
let last = performance.now(), steamIn = 0;
function frame(ts){
  const dt = Math.min(0.1, (ts - last) / 1000); last = ts;
  // Dükkân büyüyünce / şube değişince / ekran dönünce sahnenin oranı değişir
  const vh = viewH(), view = W + '/' + vh;
  if (view !== sceneView){
    sceneView = view; const box = scene.parentElement;
    box.style.aspectRatio = `${W} / ${vh}`; box.style.setProperty('--ar', W / vh); fitCanvas(scene, g, W, vh);
  }
  if (status === 'running' && !modalOpen()){
    tick(dt);
    steamIn -= dt;
    if (steamIn <= 0 && inProgress() && R.steamTop){ puff(245, R.steamTop); steamIn = 0.12; }
  }
  updateParticles(dt);
  drawScene();
  drawPreview();
  drawAvatar();
  requestAnimationFrame(frame);
}
fitCanvas(scene, g, W, H);
requestAnimationFrame(frame);
setInterval(renderUI, 100);
renderUI();

if (!S.owner) openOwnerEditor(true); else if (!checkOffline(awayMs) && dailyPending()) showDaily();
</script>
</body>
</html>
